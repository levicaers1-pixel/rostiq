} catch (e) {} })();

<style>

  /* Getting started: welcome card for new players, setup checklist for team admins */
  .onboard { margin-top: 24px; padding: 18px; border-radius: var(--radius); background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow-sm); }
  .onboard-head { display: flex; align-items: flex-start; gap: 12px; }
  .onboard-head h3 { margin: 0; font-size: 1.05rem; }
  .onboard-head p { margin: 2px 0 0; font-size: .85rem; color: var(--muted); }
  .onboard-head .count { margin-left: auto; white-space: nowrap; }
  .onboard-bar { height: 6px; border-radius: 999px; margin: 14px 0 6px; background: color-mix(in srgb, var(--muted) 15%, var(--surface)); overflow: hidden; }
  .onboard-bar span { display: block; height: 100%; border-radius: 999px; background: var(--pampas); transition: width .4s var(--ease); }
  .steps { list-style: none; margin: 0; padding: 0; }
  .steps li { display: grid; grid-template-columns: 28px 1fr auto; gap: 4px 12px; align-items: center; padding: 10px 0; border-top: 1px solid var(--border); }
  .steps li:first-child { border-top: none; }
  .step-dot { width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    border: 2px solid color-mix(in srgb, var(--muted) 40%, transparent); color: var(--muted); }
  .steps li.done .step-dot { background: var(--yes); border-color: var(--yes); color: #fff; }
  .steps li.done .step-text b { color: var(--muted); font-weight: 500; text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--muted) 50%, transparent); }
  .step-text b { font-weight: 600; font-size: .92rem; }
  .step-text small { display: block; color: var(--muted); font-size: .78rem; }
  .step-extra { grid-column: 2 / -1; display: flex; gap: 6px; flex-wrap: wrap; }
  .step-extra input { flex: 1 1 180px; min-width: 0; font: inherit; font-size: .9rem; padding: 7px 10px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--bg); color: var(--text); }
  .step-extra .results { width: 100%; display: grid; gap: 6px; }
  .step-extra .results button { justify-content: flex-start; text-align: left; }
  .onboard-foot { display: flex; justify-content: flex-end; margin-top: 6px; }
  .onboard-foot button { color: var(--muted); }
  .onboard.setup { border-color: color-mix(in srgb, var(--accent) 30%, var(--border)); }
  @media (max-width: 520px) { .steps li { grid-template-columns: 28px 1fr; } .steps li > button, .steps li > a.btn-like { grid-column: 2; justify-self: start; } }
  a.btn-like { display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px; border-radius: var(--radius-sm); font-size: .85rem; font-weight: 600; text-decoration: none; }
  a.btn-like.action { background: var(--pampas); color: var(--brand); box-shadow: var(--shadow-sm); }
  a.btn-like.action:hover { background: color-mix(in srgb, var(--pampas) 85%, #fff); }

  /* "Next match" hero (replaces the small countdown on this page) */
  #countdown { display: none !important; }
  .hero { position: relative; overflow: hidden; margin-top: 28px; padding: 22px; border-radius: 20px; display: grid; gap: 16px;
    color: var(--brand-text); box-shadow: var(--shadow);
    background: radial-gradient(130% 150% at 100% 0%, color-mix(in srgb, var(--pampas) 32%, var(--brand)) 0%, var(--brand) 58%); }
  .hero > * { position: relative; z-index: 1; }
  .hero-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
  .hero-kicker { display: inline-flex; align-items: center; gap: 6px; font-size: .74rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; opacity: .82; }
  .hero-when { padding: 4px 12px; border-radius: 999px; font-size: .85rem; font-weight: 700; background: var(--pampas); color: var(--brand); }
  .hero-main { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
  .hero-title { margin: 0; color: var(--brand-text); font-size: clamp(1.7rem, 1.2rem + 2vw, 2.4rem); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .hero-date { margin-top: 2px; font-weight: 500; opacity: .88; }
  .hero .details { margin-top: 8px; display: grid; gap: 3px; font-size: .85rem; color: color-mix(in srgb, var(--brand-text) 80%, transparent); }
  .hero .details a { color: var(--brand-text); }
  .hero-stat { text-align: right; line-height: 1; }
  .hero-stat b { font-size: 2.7rem; font-weight: 800; }
  .hero-stat span { margin-left: 4px; font-size: 1.1rem; opacity: .75; }
  .hero-stat small { display: block; margin-top: 6px; font-size: .72rem; letter-spacing: .06em; text-transform: uppercase; opacity: .75; }
  .hero .hero-bar .fill { background: color-mix(in srgb, var(--brand-text) 18%, transparent); }
  .hero .hero-bar .yes { background: var(--pampas); }
  .hero .hero-bar .maybe { background: color-mix(in srgb, var(--brand-text) 45%, transparent); }
  .hero .hero-bar .min { background: var(--brand-text); opacity: .7; }
  .hero-people { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; min-height: 30px; }
  .hero .av { border-color: var(--brand); }
  .hero-actions { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .hero-answer { background: color-mix(in srgb, var(--brand-text) 14%, transparent); }
  .hero-answer button { color: color-mix(in srgb, var(--brand-text) 85%, transparent); }
  .hero-answer button:hover:not(:disabled) { background: color-mix(in srgb, var(--brand-text) 14%, transparent); }
  .hero-btns { display: flex; gap: 8px; flex-wrap: wrap; }
  .hero-btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 10px; font-size: .85rem; font-weight: 600; text-decoration: none;
    color: var(--brand-text); background: color-mix(in srgb, var(--brand-text) 12%, transparent); border: 1px solid color-mix(in srgb, var(--brand-text) 22%, transparent); }
  .hero-btn:hover:not(:disabled) { background: color-mix(in srgb, var(--brand-text) 20%, transparent); border-color: color-mix(in srgb, var(--brand-text) 35%, transparent); }
  @media (max-width: 520px) {
    .hero { padding: 18px; }
    .hero-answer { width: 100%; } .hero-answer button { flex: 1; }
    .hero-btns { width: 100%; gap: 6px; flex-wrap: nowrap; }
    .hero-btns .hero-btn { flex: 1; justify-content: center; white-space: nowrap; padding: 9px 8px; font-size: .8rem; min-width: 0; }
    .hero-btns .hero-btn[data-share] { flex: 0 0 auto; padding: 9px 12px; }
  }

  /* Match cards: date, details, progress towards the minimum, who's coming, my answer, the whole team */
  .matches { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(min(380px, 100%), 1fr)); align-items: start; }
  .matches > .empty-state { grid-column: 1 / -1; }
  .match { display: grid; grid-template-columns: 58px 1fr auto; gap: 14px; }
  .m-body { min-width: 0; }
  .m-meta .details { display: grid; gap: 3px; margin-top: 6px; }
  .m-actions { display: flex; gap: 2px; align-items: flex-start; }
  .m-actions button { border-color: transparent; background: transparent; color: var(--muted); padding: 7px; position: relative; }
  .m-actions button:hover:not(:disabled) { color: var(--accent); background: color-mix(in srgb, var(--accent) 8%, var(--surface)); border-color: transparent; }
  .m-actions .count { position: absolute; top: 1px; right: 0; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 999px;
    background: var(--no); color: #fff; font-size: .62rem; font-weight: 700; line-height: 16px; }
  .m-progress, .m-people, .m-mine, .m-team, .m-missing, .m-foot { grid-column: 1 / -1; }
  /* Admins: who still has to answer, with one button to remind exactly them */
  .m-missing { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 10px 12px; border-radius: 12px;
    background: color-mix(in srgb, var(--maybe) 10%, var(--surface)); border: 1px solid color-mix(in srgb, var(--maybe) 28%, var(--surface)); }
  .m-missing .av { filter: grayscale(.6); opacity: .85; border-color: var(--surface); }
  .m-missing-text { display: grid; line-height: 1.25; margin-right: auto; min-width: 0; font-size: .85rem; }
  .m-missing-text small { color: var(--muted); font-size: .76rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .m-missing-btn { display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 10px; font-weight: 600; font-size: .82rem; }
  .hero .m-missing { background: color-mix(in srgb, var(--brand-text) 10%, transparent); border-color: color-mix(in srgb, var(--brand-text) 22%, transparent); }
  .hero .m-missing .av { border-color: var(--brand); }
  .hero .m-missing-text small { color: color-mix(in srgb, var(--brand-text) 75%, transparent); }
  .hero .m-missing-btn { background: var(--pampas); color: var(--brand); border-color: transparent; }
  @media (max-width: 440px) { .m-missing-btn { width: 100%; justify-content: center; } }
  /* Tidy: one summary line, the rest behind "More info"; one quiet button style */
  .hero-top-r { display: inline-flex; align-items: center; gap: 8px; }
  .hero-icon { padding: 6px; border-radius: 9px; color: var(--brand-text); background: color-mix(in srgb, var(--brand-text) 12%, transparent); border: 1px solid color-mix(in srgb, var(--brand-text) 22%, transparent); }
  .hero-head { min-width: 0; flex: 1; }
  .hero-date { font-size: .95rem; }
  .hero-more { margin-top: 8px; font-size: .85rem; }
  .hero-more summary { cursor: pointer; list-style: none; display: inline-flex; align-items: center; gap: 4px; font-weight: 600; opacity: .85; }
  .hero-more summary::-webkit-details-marker { display: none; }
  .hero-more summary .i { transition: transform .2s var(--ease); }
  .hero-more[open] summary .i { transform: rotate(180deg); }
  .hero-more .details { margin-top: 6px; }
  .hero .m-missing-btn { background: color-mix(in srgb, var(--brand-text) 14%, transparent) !important; color: var(--brand-text) !important;
    border: 1px solid color-mix(in srgb, var(--brand-text) 28%, transparent) !important; }
  .m-sub { margin-top: 3px; font-size: .84rem; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .m-score { align-self: start; padding: 4px 10px; border-radius: 999px; font-size: .8rem; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums;
    background: color-mix(in srgb, var(--muted) 10%, var(--surface)); }
  .m-score b { font-size: 1rem; color: var(--text); }
  .m-score.yes { background: var(--yes-bg); color: var(--yes); } .m-score.yes b { color: var(--yes); }
  .m-score.maybe { background: var(--maybe-bg); color: var(--maybe); } .m-score.maybe b { color: var(--maybe); }
  .m-score.no { background: var(--no-bg); color: var(--no); } .m-score.no b { color: var(--no); }
  .m-foot { grid-column: 1 / -1; display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .m-foot .answer button { padding: 6px 10px; font-size: .85rem; }
  .m-coming { font-size: .82rem; color: var(--muted); }
  .m-team .details { display: grid; gap: 3px; margin-top: 10px; font-size: .84rem; color: var(--muted); }
  .avatars .av { margin-left: -5px !important; }
  .avatars .av:first-child { margin-left: 0 !important; }
  .av { font-size: .62rem; letter-spacing: -.02em; }
  .m-foot .answer button { white-space: nowrap; }
  @media (max-width: 440px) { .m-foot .answer { width: 100%; } .m-foot .answer .i { display: none; } .m-foot .m-actions { margin-left: auto; } .m-sub { white-space: normal; } }
  /* Phone: the big table is folded away (the cards above already say who's coming) */
  .show-table { display: none; }
  @media (max-width: 640px) {
    .show-table { display: inline-flex; }
    #overview-head:not(.open) .head-actions, #overview-head:not(.open) ~ #table-view, #overview-head:not(.open) ~ #table-note { display: none !important; }
  }
  /* Calendar subscription */
  .cal-dlg { width: min(480px, calc(100vw - 32px)); }
  .cal-lead { margin: -4px 0 14px; color: var(--muted); font-size: .9rem; }
  .cal-btns { display: grid; gap: 8px; }
  .cal-btns a, .cal-btns button { display: flex; align-items: center; gap: 10px; justify-content: flex-start; padding: 11px 14px; border-radius: 12px;
    border: 1px solid var(--border); background: var(--surface); color: var(--text); font-weight: 600; font-size: .95rem; text-decoration: none; }
  .cal-btns a:hover, .cal-btns button:hover { border-color: color-mix(in srgb, var(--accent) 45%, var(--border)); }
  .cal-btns a.primary-cal { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
  .cal-check { display: flex; gap: 10px; align-items: flex-start; margin: 14px 0 0; font-size: .9rem; cursor: pointer; }
  .cal-check input { margin-top: 3px; }
  .cal-small { margin: 10px 0 0; color: var(--muted); font-size: .8rem; }
  .cal-invite { margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--border); }
  .cal-invite h4 { margin: 0 0 4px; font-size: .95rem; }
  .cal-invite .cal-check small { display: block; color: var(--muted); font-size: .8rem; margin-top: 2px; }
  .cal-links { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 12px; font-size: .85rem; }
  .cal-links button { border: none; background: none; padding: 0; color: var(--accent); text-decoration: underline; font-size: .85rem; }
  /* Answer history (admins) */
  .history-dlg { width: min(520px, calc(100vw - 32px)); }
  .history-sub { margin: -6px 0 12px; color: var(--muted); font-size: .85rem; }
  .history-list { list-style: none; margin: 0; padding: 0; max-height: 55vh; overflow: auto; }
  .history-list li { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; padding: 9px 0; border-top: 1px solid var(--border); font-size: .9rem; }
  .history-list li:first-child { border-top: none; }
  .history-list .h-time { grid-row: span 2; color: var(--muted); font-size: .78rem; font-variant-numeric: tabular-nums; padding-top: 2px; min-width: 7.5em; }
  .history-list .h-change { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .history-list .h-change .pill { font-size: .72rem; }
  .history-list .h-arrow { color: var(--muted); }
  .history-list small { color: var(--muted); font-size: .78rem; }
  .history-list .h-empty { display: block; color: var(--muted); padding: 8px 0; border: none; }
  .history-note { margin: 12px 0 0; color: var(--muted); font-size: .78rem; }
  /* Enough players: a short celebration */
  .match.complete, .hero.complete { animation: complete-glow 1.2s ease-out both; }
  @keyframes complete-glow { from { box-shadow: 0 0 0 0 color-mix(in srgb, var(--yes) 55%, transparent); } to { box-shadow: 0 0 0 16px transparent; } }
  .confetti { position: fixed; inset: 0; pointer-events: none; z-index: 1000; overflow: hidden; }
  .confetti i { position: absolute; width: 8px; height: 12px; border-radius: 2px; animation: confetti 1.4s cubic-bezier(.2, .7, .3, 1) both; }
  @keyframes confetti {
    0% { transform: translate(0, 0) rotate(0); opacity: 1; }
    55% { transform: translate(var(--x), var(--y)) rotate(var(--r)); opacity: 1; }
    100% { transform: translate(calc(var(--x) * 1.25), calc(var(--y) + 280px)) rotate(calc(var(--r) * 1.6)); opacity: 0; }
  }
  .bar { position: relative; height: 8px; }
  .bar .fill { display: flex; height: 100%; border-radius: 999px; overflow: hidden; background: color-mix(in srgb, var(--muted) 15%, var(--surface)); }
  .bar .fill span { height: 100%; }
  @keyframes grow { from { width: var(--from); } }
  .bar .yes { background: var(--yes); }
  .bar .maybe { background: color-mix(in srgb, var(--maybe) 55%, var(--surface)); }
  .bar .min { position: absolute; top: -4px; bottom: -4px; width: 2px; margin-left: -1px; border-radius: 2px; background: var(--text); opacity: .5; }
  .m-count { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 10px; font-size: .85rem; color: var(--muted); }
  .m-count b { color: var(--text); font-size: 1.05rem; }
  .m-count .pill { margin-left: auto; }
  .m-people { display: flex; align-items: center; gap: 10px; min-height: 30px; font-size: .82rem; color: var(--muted); }
  .m-mine { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding-top: 14px; border-top: 1px solid var(--border); }
  .m-mine > span { font-size: .8rem; font-weight: 600; color: var(--muted); margin-right: auto; }
  .answer { display: inline-flex; gap: 3px; padding: 3px; border-radius: 12px; background: color-mix(in srgb, var(--muted) 11%, var(--surface)); }
  .answer button { border: none; background: transparent; border-radius: 9px; padding: 7px 12px; font-weight: 600; color: var(--muted); }
  .answer button:hover:not(:disabled) { background: var(--surface); border: none; }
  .answer button[aria-pressed="true"] { color: #fff; box-shadow: var(--shadow-sm); }
  .answer button[aria-pressed="true"][data-a="yes"] { background: var(--yes); }
  .answer button[aria-pressed="true"][data-a="maybe"] { background: var(--maybe); }
  .answer button[aria-pressed="true"][data-a="no"] { background: var(--no); }
  .m-team { border-top: 1px solid var(--border); padding-top: 12px; }
  .m-team summary { cursor: pointer; list-style: none; display: flex; align-items: center; gap: 7px; font-size: .82rem; font-weight: 600; color: var(--muted); }
  .m-team summary::-webkit-details-marker { display: none; }
  .m-team summary .i:last-child { margin-left: auto; transition: transform .2s var(--ease); }
  .m-team[open] summary .i:last-child { transform: rotate(180deg); }
  .m-team .chips { margin-top: 12px; }
  @media (max-width: 440px) {
    .match { grid-template-columns: 50px 1fr auto; gap: 12px; }
    .m-mine > span { width: 100%; }
    .answer { width: 100%; } .answer button { flex: 1; padding: 9px 6px; }
  }
  .section-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin: 44px 0 14px; }
  .section-head h2 { margin: 0; }
  .head-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

  /* Toolbar */
  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
  .legend { display: flex; flex-wrap: wrap; gap: 12px; color: var(--muted); font-size: .85rem; margin-right: auto; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }

  /* Overview table: sticky header row, player column and totals; next match column highlighted */
  .grid-wrap { overflow: auto; max-height: min(78vh, 820px); background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow-sm); }
  table { border-collapse: separate; border-spacing: 0; width: 100%; }
  th, td { border-bottom: 1px solid var(--border); text-align: center; padding: 0; }
  tbody td:not(.name) { padding: 3px; }
  thead th { position: sticky; top: 0; z-index: 2; background: var(--surface); padding: 10px 4px 8px; vertical-align: bottom; line-height: 1.25;
    font-size: .72rem; font-weight: 600; color: var(--muted); }
  thead th .d { display: block; font-size: .66rem; letter-spacing: .05em; text-transform: uppercase; }
  thead th .opp { display: block; max-width: 104px; margin: 2px auto 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text); font-size: .8rem; font-weight: 700; }
  thead th.final .opp { color: var(--final); }
  thead th .time { display: block; font-weight: 500; }
  th.next, td.next { background: color-mix(in srgb, var(--pampas) 9%, var(--surface)); }
  thead th.next .d { color: color-mix(in srgb, var(--pampas) 50%, var(--text)); }
  th.name, td.name { position: sticky; left: 0; z-index: 1; background: var(--surface); text-align: left; min-width: 180px; border-right: 1px solid var(--border); }
  thead th.name { z-index: 3; vertical-align: bottom; padding-left: 12px; }

const SYMBOL = { "": "–", yes: "✓", maybe: "?", no: "✗" };
const LABEL = { "": "", yes: t("label.yes"), maybe: t("label.maybe"), no: t("label.no") };

let compact = pref.get("compact", "") === "1";
let showPast = pref.get("showPast", "0") === "1";

// Avatars: initials on a colour that stays the same for a name.
const initials = n => initials0(n) || "?";
const avatar = (p, i, popStyle) => `<span class="av${popStyle ? " pop" : ""}" style="${avatarBg(p)}${popStyle || ""}" title="${esc(displayName(p, i))}">${photoOf(p) ? "" : esc(initials(displayName(p, i)))}</span>`;
const LEVEL_PILL = { ok: "yes", low: "maybe", short: "no" };
// One line under a match's name: time and place (the rest, like weather, meeting point and notes, is behind "More info").
const summaryLine = e => { const v = matchInfo(e).venue; return [timeText(e), v && venueShort(v)].filter(Boolean).map(esc).join(" · "); };
let heroMoreOpen = false;
// Admins: the players who haven't answered this match yet, and one button that prepares a reminder for exactly them.
const missingHtml = (e, players) => {
  const miss = players.filter(p => p.name && !p.avail[e.date]);
  if (!AUTH_ON || !session.admin || !isOn(e)) return "";
  if (!miss.length) return remindedLine(e, players); // everyone answered: still show what the reminder did
  return `<div class="m-missing"><span class="avatars">${miss.slice(0, 6).map(p => avatar(p, players.indexOf(p))).join("")}${
      miss.length > 6 ? `<span class="av more">+${miss.length - 6}</span>` : ""}</span>
    <span class="m-missing-text"><b>${t("missing.title", { n: miss.length })}</b><small>${esc(miss.slice(0, 4).map(p => firstName(p.name)).join(", "))}${miss.length > 4 ? " …" : ""}</small></span>
    <button class="remind m-missing-btn" data-date="${e.date}">${ic("bell")} ${t("missing.remind", { n: miss.length, name: esc(firstName(miss[0].name)) })}</button></div>${remindedLine(e, players)}`;
};
// Admins: when the last personal reminder went out, and how many of the players it reached have answered since.
function remindedLine(e, players) {
  const r = (root.reminded || {})[e.date], reached = Object.entries((r && r.p) || {}).filter(([, x]) => x && x.v !== "none");
  if (!session.admin || !isOn(e) || !reached.length) return "";
  const byId = Object.fromEntries(players.map(p => [p.id, p]));
  const answered = reached.filter(([pid]) => byId[pid] && byId[pid].avail[e.date]).length;
  return `<div class="m-reminded">${ic("bell")} ${esc(t("rem.line", { when: remindTime(r.at), n: answered, of: reached.length }))}</div>`;
}
const remindTime = at => {
  const d = new Date(at), time = d.toLocaleTimeString(LOCALE, { hour: "2-digit", minute: "2-digit" });
  return d.toDateString() === new Date().toDateString() ? t("rem.today", { time }) : `${d.toLocaleDateString(LOCALE, { weekday: "short", day: "numeric", month: "short" })} ${time}`;
};
const openTeams = new Set(); // match cards whose team list is unfolded (kept across live updates)

// Remembered from the previous render, to animate what changed (bar widths, new avatars, my answer).
const prevBar = {}, prevComing = {}, prevMine = {};
// Running animations by key, with their start time: a re-render (e.g. when the database confirms the change)
// continues them at the same point instead of cutting them off.
const anim = {};
const animStyle = (key, ms, extra = "") => {
  const a = anim[key], t0 = a ? performance.now() - a.at : Infinity;
  return t0 < ms ? `${extra}animation-delay:-${Math.round(t0)}ms;` : null;
};

function renderMatches(players, events) {
  const box = document.getElementById("matches");
  // No matches yet: one clear empty state instead of an empty list and an empty table.
  const none = dataLoaded && !EVENTS.length;
  document.getElementById("table-view").hidden = !dataLoaded || none;
  for (const id of ["overview-head", "table-note", "share-overview", "ics-all"]) document.getElementById(id).hidden = none;
  if (!dataLoaded) { box.innerHTML = skeletonCards(4); return; }
  if (none) {
    box.innerHTML = session.admin || !AUTH_ON
      ? emptyState("calendar", t("empty.noMatches"), t("empty.noMatchesAdmin"),
          `<a class="btn primary" href="${pageUrl("admin.html")}#sec-matches">${ic("plus")} ${t("empty.addMatches")}</a>`)
      : emptyState("calendar", t("empty.noMatches"), t("empty.noMatchesPlayer"));
    return;
  }
  if (!events.length) { box.innerHTML = emptyState("calendar-check", t("empty.noUpcoming"), t("empty.noUpcomingText"), "", true); return; }
  const min = minPlayers(), named = players.filter(p => p.name), total = Math.max(named.length, min, 1);
  const pct = n => Math.min(100, n / total * 100);
  const me = AUTH_ON ? players.find(p => p.id === session.pid) : null;
  const order = { yes: 0, maybe: 1, no: 2, "": 3 };
  // The next match is the big card at the top: the list continues after it (unless past matches are shown too).
  const heroDate = !showPast && (EVENTS.find(isOn) || {}).date;
  const listed = events.filter(e => e.date !== heroDate);
  if (!listed.length) { box.innerHTML = ""; return; }
  box.innerHTML = listed.map(e => {
    const c = tally(e, players);
    const coming = players.filter(p => p.avail[e.date] === "yes");
    const mine = me ? me.avail[e.date] || "" : null;
    const now = performance.now(), w = [pct(c.yes), pct(c.maybe)], before = prevBar[e.date];
    if (!before || before[0] !== w[0] || before[1] !== w[1]) anim["bar:" + e.date] = { at: now, from: before || [0, 0] };
    prevBar[e.date] = w;
    if (prevComing[e.date]) for (const p of coming) if (!prevComing[e.date].has(p.id)) anim[`pop:${e.date}:${p.id}`] = { at: now };
    prevComing[e.date] = new Set(coming.map(p => p.id));
    if (mine !== null && e.date in prevMine && prevMine[e.date] !== mine && mine) anim["just:" + e.date] = { at: now };
    if (mine !== null) prevMine[e.date] = mine;
    const ba = anim["bar:" + e.date];
    const barStyle = i => `width:${w[i]}%;` + (animStyle("bar:" + e.date, 450, `--from:${ba ? ba.from[i] : 0}%;animation:grow .45s var(--ease) both;`) || "");
    const team = players.map((p, i) => ({ p, i, s: p.avail[e.date] || "" })).filter(x => x.p.name)
      .sort((a, b) => order[a.s] - order[b.s] || a.i - b.i);
    const glow = animStyle("done:" + e.date, 1200);
    const off = !!e.cancelled, open = isOn(e);
    return `<article class="match${e.final ? " final" : ""}${isPast(e) ? " past" : ""}${off ? " off" : ""}${glow ? " complete" : ""}"${glow ? ` style="${glow}"` : ""}>
      <div class="m-date"><span>${fmt(e.date, { weekday: "short" }).replace(".", "")}</span><b>${parse(e.date).getDate()}</b><span>${fmt(e.date, { month: "short" }).replace(".", "")}</span></div>
      <div class="m-body">
        <div class="m-title"><span class="m-opp">${esc(e.opp)}</span>${statusPill(e)}${homePill(e)}${e.final ? `<span class="pill violet">${ic("trophy")} ${t("final")}</span>` : ""}</div>
        ${summaryLine(e) ? `<div class="m-sub">${summaryLine(e)}</div>` : ""}
        ${selLine(e, players)}
        ${remindedLine(e, players)}
      </div>
      <div class="m-score ${LEVEL_PILL[c.level]}" title="${esc(t("level." + c.level))}"><b>${c.yes}</b>/${min}</div>
      <div class="m-progress">
        <div class="bar" data-date="${e.date}"><div class="fill"><span class="yes" style="${barStyle(0)}"></span><span class="maybe" style="${barStyle(1)}"></span></div>
          <i class="min" style="left:${pct(min)}%" title="min. ${min}"></i></div>
      </div>
      <div class="m-foot">
        ${mine !== null && open ? `<div class="answer" role="group" aria-label="${t("match.mine")}">${
          ["yes", "maybe", "no"].map(a => `<button data-answer="${a}" data-date="${e.date}" data-a="${a}" aria-pressed="${mine === a}"${mine === a && animStyle("just:" + e.date, 300) ? ` class="just" style="${animStyle("just:" + e.date, 300)}"` : ""}>${ic({ yes: "check", maybe: "help", no: "x" }[a])} ${t("answer." + a)}</button>`).join("")
        }</div>` : `<span class="m-coming">${coming.length ? `<span class="avatars">${coming.slice(0, 6).map(p => avatar(p, players.indexOf(p), animStyle(`pop:${e.date}:${p.id}`, 350))).join("")}${coming.length > 6 ? `<span class="av more">+${coming.length - 6}</span>` : ""}</span>` : t("match.nobody")}</span>`}
        <div class="m-actions">
          <button data-share="${e.date}" title="${t("share.match")}" aria-label="${t("share.match")}">${ic("share")}</button>
          <button data-ics="${e.date}" title="${t("ics.oneTitle")}" aria-label="${t("ics.oneTitle")}">${ic("calendar-plus")}</button>
          ${!open ? "" : `<button class="remind" data-date="${e.date}" title="${t("remind.title", { n: c.missing.length })}" aria-label="${t("remind.short")}"
            ${c.missing.length ? "" : "disabled"}>${ic("bell")}${c.missing.length ? `<span class="count">${c.missing.length}</span>` : ""}</button>`}
          ${session.admin && open ? `<button data-history="${e.date}" title="${t("hist.button")}" aria-label="${t("hist.button")}">${ic("clock")}</button>` : ""}
          ${session.admin && open ? `<button data-select="${e.date}" title="${t("sel.button")}" aria-label="${t("sel.button")}">${ic("users")}</button>` : ""}
          ${session.admin ? `<button data-edit="${e.date}" title="${t("details.edit")}" aria-label="${t("details.edit")}">${ic("pencil")}</button>` : ""}
        </div>
      </div>
      <details class="m-team" data-date="${e.date}"${openTeams.has(e.date) ? " open" : ""}>
        <summary>${ic("users")} ${t("match.everyone", { n: named.length })}${c.missing.length && open ? ` · ${t("match.noAnswer", { n: c.missing.length })}` : ""}${ic("chevron-down")}</summary>
        ${detailsHtml(e, "", true)}
        <div class="chips">${team.map(({ p, i, s }) => `<button class="chip${me && p.id === me.id ? " me" : ""}" data-s="${s}" data-pid="${p.id}" data-date="${e.date}"
          ${canEdit(p.id) ? "" : "disabled"}>${SYMBOL[s]} ${esc(displayName(p, i))}</button>`).join("")}</div>
      </details>
    </article>`;
  }).join("");
}
// ---- Getting started ----
// Steps are read from the team's data where possible (so they're right on every device); the WhatsApp group
// and the calendar download can't be checked, so they count as done once tapped (remembered on this device).
const onb = { place: { status: "idle", results: [] }, phoneErr: false };
const flagKey = k => `${k}:${TEAM_ID}`;
const stepsHtml = steps => steps.map(s => `<li class="${s.done ? "done" : ""}">
    <span class="step-dot">${s.done ? ic("check") : ic(s.icon)}</span>
    <span class="step-text"><b>${s.title}</b>${s.sub ? `<small>${s.sub}</small>` : ""}</span>
    ${s.done ? "" : s.action || ""}${s.extra && !s.done ? `<div class="step-extra">${s.extra}</div>` : ""}</li>`).join("");
const cardHtml = (title, sub, steps, hideKey) => {
  const done = steps.filter(s => s.done).length;
  return `<div class="onboard-head"><div><h3>${title}</h3><p>${sub}</p></div>
      <span class="pill ${done === steps.length ? "yes" : "cyan"} count">${t("onb.progress", { done, total: steps.length })}</span></div>
    <div class="onboard-bar"><span style="width:${done / steps.length * 100}%"></span></div>
    <ul class="steps">${stepsHtml(steps)}</ul>
    <div class="onboard-foot"><button class="link" data-onb-hide="${hideKey}">${t("onb.hide")}</button></div>`;
};

function renderWelcome(players) {
  const el = document.getElementById("welcome");
  const me = AUTH_ON && dataLoaded ? players.find(p => p.id === session.pid) : null;
  if (!me || DEMO || pref.get(flagKey("welcomeHidden"), "")) { el.hidden = true; return; }
  const upcoming = EVENTS.filter(isOn);
  const answered = upcoming.filter(e => me.avail[e.date]).length;
  const wa = root.settings && root.settings.waGroup;
  const pl = onb.place;
  const steps = [
    ...(upcoming.length ? [{ icon: "help", checkable: true, done: answered === upcoming.length, title: t("onb.answer"), sub: t("onb.answerSub", { n: answered, total: upcoming.length }),
      action: `<button class="primary" data-onb="answer">${t("onb.do")}</button>` }] : []),
    { icon: "pin", checkable: true, done: !!me.geo, title: t("onb.place"), sub: me.geo ? esc(me.geo.label) : t("onb.placeSub"),
      extra: `<input id="onb-place" placeholder="${t("carpool.gemeentePh")}" autocomplete="address-level2" enterkeyhint="search"><button data-onb="find">${t("carpool.find")}</button>
        ${pl.status === "loading" ? `<div class="results"><small class="muted">${t("carpool.searching")}</small></div>` : ""}
        ${pl.status === "none" ? `<div class="results"><small class="warn">${t("carpool.noPlace")}</small></div>` : ""}
        ${pl.status === "error" ? `<div class="results"><small class="warn">${t("carpool.searchFailed")}</small></div>` : ""}
        ${pl.status === "results" ? `<div class="results">${pl.results.map((r, i) => `<button data-onb-pick="${i}">${ic("pin")} ${esc(r.label)}${r.country ? ` · ${esc(r.country)}` : ""}</button>`).join("")}</div>` : ""}` },
    { icon: "phone", checkable: true, done: !!me.phone, title: t("onb.phone"), sub: me.phone ? "+" + esc(me.phone) : t("onb.phoneSub"),
      extra: `<input id="onb-phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="${t("phone.ph")}"><button data-onb="phone">${t("phone.save")}</button>
        ${onb.phoneErr ? `<div class="results"><small class="err">${t("phone.invalid")}</small></div>` : ""}` },
    ...(wa && WA_LINK.test(wa) ? [{ icon: "message", done: !!pref.get(flagKey("onbWa"), ""), title: t("onb.wa"), sub: t("onb.waSub"),
      action: `<a class="btn-like action" data-onb="wa" href="${esc(wa)}" target="_blank" rel="noopener">${t("onb.open")}</a>` }] : []),
    ...(EVENTS.length ? [{ icon: "calendar-plus", done: !!pref.get(flagKey("onbCal"), ""), title: t("onb.calendar"), sub: t("onb.calendarSub"),
      action: `<button data-onb="cal">${t("onb.download")}</button>` }] : []), // nothing to put in a calendar yet
    ...(pushAvailable() ? [{ icon: "bell", done: pushOn(), title: t("onb.push"), sub: t("onb.pushSub"),
      action: `<button class="btn-like action" data-push>${t("onb.pushDo")}</button>` }] : []),
    { icon: "user", done: !!photoOf(me), title: t("onb.photo"), sub: t("onb.photoSub"),
      action: `<a class="btn-like action" href="${pageUrl("ploeg.html")}#me">${t("onb.add")}</a>` },
  ];
  // Only when something checkable is still missing (answers, location, phone): players who are complete
  // don't get a "welcome" just because the group / calendar steps can't be verified.
  if (steps.every(s => s.done) || steps.filter(s => s.checkable).every(s => s.done)) { el.hidden = true; return; }
  // Keep what someone is typing in the card across live updates.
  const keep = ["onb-place", "onb-phone"].map(id => document.getElementById(id)).filter(x => x && x.value).map(x => [x.id, x.value, document.activeElement === x]);
  el.hidden = false;
  el.innerHTML = cardHtml(t("onb.title", { team: esc(TEAM.shortName || TEAM.brand), name: esc(firstName(me.name || "")) }), t("onb.sub"), steps, "welcomeHidden");
  for (const [id, v, focus] of keep) { const x = document.getElementById(id); if (x) { x.value = v; if (focus) x.focus(); } }
}

function renderSetup(players) {
  const el = document.getElementById("setup");
  if (!AUTH_ON || DEMO || !dataLoaded || !session.admin || pref.get(flagKey("setupHidden"), "")) { el.hidden = true; return; }
  const s = root.settings || {};
  const link = (h, label) => `<a class="btn-like action" href="${pageUrl("admin.html")}${h}">${label}</a>`;
  const steps = [
    { icon: "calendar", done: EVENTS.length > 0, title: t("setup.matches"), sub: t("setup.matchesSub", { n: EVENTS.length }), action: link("#sec-matches", t("setup.go")) },
    { icon: "users", done: players.filter(p => p.uid).length > 1, title: t("setup.players"), sub: t("setup.playersSub", { n: players.filter(p => p.uid).length }), action: link("#requests-panel", t("setup.invite")) },
    { icon: "settings", done: !!s.minPlayers, title: t("setup.min"), sub: s.minPlayers ? t("setup.minSet", { n: s.minPlayers }) : t("setup.minSub"), action: link("#sec-settings", t("setup.go")) },
    { icon: "image", done: !!(TEAM.logo || TEAM.colors), title: t("setup.brand"), sub: t("setup.brandSub"), action: link("#sec-brand", t("setup.go")) },
    { icon: "message", done: !!s.waGroup, title: t("setup.wa"), sub: t("setup.waSub"), action: link("#sec-settings", t("setup.go")) },
  ];
  if (steps.every(x => x.done)) { el.hidden = true; return; }
  el.hidden = false;
  el.innerHTML = cardHtml(t("setup.title", { team: esc(TEAM.brand) }), t("setup.sub"), steps, "setupHidden");
}

async function findOnbPlace() {
  const q = (document.getElementById("onb-place") || {}).value || "";
  if (q.trim().length < 2) return;
  onb.place = { status: "loading", results: [] }; render();
  try { const results = await searchPlaces(q); onb.place = { status: results.length ? "results" : "none", results }; }
  catch { onb.place = { status: "error", results: [] }; }
  render();
}
for (const id of ["welcome", "setup"]) document.getElementById(id).addEventListener("click", ev => {
  const hide = ev.target.closest("[data-onb-hide]");
  if (hide) { pref.set(flagKey(hide.dataset.onbHide), "1"); render(); return; }
  const pick = ev.target.closest("[data-onb-pick]");
  if (pick) { const r = onb.place.results[Number(pick.dataset.onbPick)]; onb.place = { status: "idle", results: [] }; if (r && session.pid) setPlace(session.pid, r); return; }
  const b = ev.target.closest("[data-onb]");
  if (!b) return;
  const act = b.dataset.onb;
  if (act === "answer") {
    const me = root.players[session.pid] || {}, e = EVENTS.find(x => isOn(x) && !(me.avail || {})[x.date]);
    const target = e && document.querySelector(`.match [data-answer][data-date="${e.date}"]`) || document.getElementById("hero");
    target.scrollIntoView({ behavior: "smooth", block: "center" });
  }
  if (act === "find") findOnbPlace();
  if (act === "phone") {
    const raw = document.getElementById("onb-phone").value, n = normPhone(raw);
    onb.phoneErr = !n;
    if (n && session.pid) { document.getElementById("onb-phone").value = ""; write(`players/${session.pid}/phone`, n); } else render();
  }
  if (act === "wa") { pref.set(flagKey("onbWa"), "1"); setTimeout(render, 300); }
  if (act === "cal") { document.getElementById("ics-all").click(); pref.set(flagKey("onbCal"), "1"); render(); }
});
document.getElementById("welcome").addEventListener("keydown", ev => {
  if (ev.key === "Enter" && ev.target.id === "onb-place") { ev.preventDefault(); findOnbPlace(); }
  if (ev.key === "Enter" && ev.target.id === "onb-phone") { ev.preventDefault(); document.querySelector('[data-onb="phone"]').click(); }
});

      <i class="min" style="left:${pct(min)}%" title="min. ${min}"></i></div>
    <div class="hero-people">${coming.length ? `<span class="avatars">${coming.slice(0, 10).map(p => avatar(p, players.indexOf(p))).join("")}${

      <span class="pill ${LEVEL_PILL[c.level]}">${t("level." + c.level)}</span></div>

        `<button data-answer="${a}" data-date="${e.date}" data-a="${a}" aria-pressed="${mine === a}">${ic({ yes: "check", maybe: "help", no: "x" }[a])} ${t("answer." + a)}</button>`).join("")}</div>` : ""}
      <div class="hero-btns">
        <button class="hero-btn" data-ics="${e.date}">${ic("calendar-plus")} ${t("hero.calendar")}</button>

function onMatchClick(ev) {

const minPlayers = () => (root.settings && root.settings.minPlayers) || TEAM.minPlayers || 3;
const shownEvents = () => EVENTS.filter(e => showPast || !isPast(e));

function tally(e, players) {
  const c = { yes: 0, maybe: 0, no: 0, missing: [] };
  for (const p of players) {
    const s = p.avail[e.date];
    if (s) c[s]++;
    else if (p.name) c.missing.push(p.name); // unnamed rows are empty slots
  }
  const min = minPlayers();
  c.level = c.yes >= min ? "ok" : c.yes + c.maybe >= min ? "low" : "short";
  return c;
}

function cycle(p, e) {
  const next = CYCLE[(CYCLE.indexOf(p.avail[e.date] || "") + 1) % CYCLE.length];
  write(`players/${p.id}/avail/${e.date}`, next || null);
}

// A match that just reached enough players: confetti and a toast. Only for a change seen while the page is open,
// never on page load, so it marks the moment the team became complete (by your answer or someone else's).
const prevLevel = {};
function checkComplete(players) {
  if (!dataLoaded) return;
  for (const e of EVENTS) {
    if (!isOn(e)) continue;
    const lv = tally(e, players).level, was = prevLevel[e.date];

function celebrate(e) {

  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const at = isNext && !hero.hidden ? hero : card;
  const r = at && at.getBoundingClientRect();
  // Burst from the middle of the part of the card that's on screen (or the screen's middle), low enough to fly up.
  const top = r ? Math.max(0, r.top) : 0, bottom = r ? Math.min(innerHeight, r.bottom) : 0;
  const x0 = bottom > top ? r.left + r.width / 2 : innerWidth / 2;

const remDlg = document.getElementById("rem");
var remState = null; // (var: render() may run before this line) { e, phase: "idle" | "sending" | "done" | "error", prevAt, result }
const REMIND_GAP = 12 * 3600e3; // the same as functions/remind.mjs: one reminder per player per 12 hours
const missingOf = e => sortedPlayers().filter(p => p.name && !p.avail[e.date]);
// Linked players (with an account) can get a personal reminder; the others only WhatsApp. In the demo: everyone.
const linkedIds = () => new Set(DEMO ? sortedPlayers().map(p => p.id) : Object.values(root.members || {}));
const recentReminder = (e, pid) => { const x = ((((root.reminded || {})[e.date] || {}).p) || {})[pid]; return x && Date.now() - x.at < REMIND_GAP ? x : null; };
function openRemind(e) {
  remState = { e, phase: "idle", off: new Set() }; // off: players the admin unticked
  document.getElementById("rem-title").textContent = t("rem.title", { n: missingOf(e).length, opp: e.opp, when: fmt(e.date, { weekday: "long", day: "numeric", month: "long" }) });
  renderRemind();
  remDlg.showModal();
}
function renderRemind() {
  if (!remState) return;
  const { e, phase, result } = remState, players = sortedPlayers(), linked = linkedIds(), miss = missingOf(e);
  const sendable = miss.filter(p => p.id !== session.pid && linked.has(p.id) && !recentReminder(e, p.id)); // never to yourself
  const chosen = sendable.filter(p => !remState.off.has(p.id)), can = new Set(sendable.map(p => p.id));
  document.getElementById("rem-sub").textContent = miss.length ? t("rem.sub") : t("rem.allAnswered");
  document.getElementById("rem-list").innerHTML = miss.map(p => {
    const recent = recentReminder(e, p.id);
    const via = p.id === session.pid ? `<span class="via">${esc(t("rem.you"))}</span>`
      : !linked.has(p.id) ? `<span class="via wa">${esc(t("rem.noAccount"))}</span>`
      : recent ? `<span class="via">${esc(t("rem.recent", { when: remindTime(recent.at), via: t("rem.v." + recent.v) }))}</span>`
      : `<span class="via">${esc(t("rem.personal"))}</span>`;
    const box = can.has(p.id) && phase !== "sending" ? `<input type="checkbox" data-rem-pick="${p.id}" ${remState.off.has(p.id) ? "" : "checked"} aria-label="${esc(displayName(p, players.indexOf(p)))}">` : `<span class="rem-nobox"></span>`;
    return `<li><label>${box}${avatar(p, players.indexOf(p))}<span class="grow">${esc(displayName(p, players.indexOf(p)))}</span>${via}</label></li>`;
  }).join("");
  const btn = document.getElementById("rem-send");
  btn.disabled = phase === "sending" || !chosen.length;
  btn.innerHTML = phase === "sending" ? esc(t("rem.sending")) : `${ic("bell")} ${esc(chosen.length ? t("rem.send", { n: chosen.length }) : sendable.length ? t("rem.noneTicked") : t("rem.none"))}`;
  document.getElementById("rem-wa").hidden = !miss.length;
  const box = document.getElementById("rem-result");
  box.hidden = !result;
  box.className = "rem-result" + (phase === "error" ? " err" : "");
  box.innerHTML = result || "";
}
// What the reminder function wrote back: who got a notification, an email, or couldn't be reached.
function remindResult(e, r, noAccount) {
  const names = ids => ids.map(id => { const p = sortedPlayers().find(x => x.id === id); return p ? firstName(p.name) : null; }).filter(Boolean).join(", ");
  const got = Object.entries((r && r.p) || {}).filter(([, x]) => x && x.at === r.at);
  const of = v => names(got.filter(([, x]) => x.v === v).map(([id]) => id));
  const lines = [of("push") && t("rem.viaPush", { names: of("push") }), of("mail") && t("rem.viaMail", { names: of("mail") }),
    of("none") && t("rem.viaNone", { names: of("none") }), !got.length && t("rem.nobody"),
    noAccount.length && t("rem.waNeeded", { names: names(noAccount) })].filter(Boolean);
  return lines.map(l => `<span>${esc(l)}</span>`).join("");
}
document.getElementById("rem-list").addEventListener("change", ev => {
  const id = ev.target.dataset.remPick;
  if (!id || !remState) return;
  ev.target.checked ? remState.off.delete(id) : remState.off.add(id);
  renderRemind();
});
document.getElementById("rem-send").onclick = async () => {
  const { e } = remState, linked = linkedIds();
  const picked = missingOf(e).filter(p => p.id !== session.pid && linked.has(p.id) && !recentReminder(e, p.id) && !remState.off.has(p.id)).map(p => p.id);
  if (!picked.length) return;
  const noAccount = missingOf(e).filter(p => p.id !== session.pid && !linked.has(p.id)).map(p => p.id);
  const prevAt = ((root.reminded || {})[e.date] || {}).at || 0;
  remState.phase = "sending"; remState.result = ""; renderRemind();
  if (DEMO) { // the demo sends nothing: it shows what the admin would see
    const now = Date.now(), p = {};
    picked.forEach((id, i) => { p[id] = { at: now, v: i % 3 === 2 ? "mail" : "push" }; });
    await update({ [`reminded/${e.date}`]: { at: now, by: "demo", p: { ...((((root.reminded || {})[e.date]) || {}).p || {}), ...p } } });
  } else if (await notifyTeam("a", e.date, null, Object.fromEntries(picked.map(id => [id, true]))) !== true) {
    remState.phase = "error"; remState.result = `<span>${esc(t("rem.failed"))}</span>`; return renderRemind();
  }
  // Wait for the function's answer (it arrives with the live team data).
  const t0 = Date.now();
  while (remState && remState.e === e && Date.now() - t0 < 30e3) {
    const r = (root.reminded || {})[e.date];
    if (r && r.at && r.at !== prevAt) { remState.phase = "done"; remState.result = remindResult(e, r, noAccount); render(); return renderRemind(); }
    await new Promise(res => setTimeout(res, 300));
  }
  if (!remState || remState.e !== e) return;
  remState.phase = "done"; remState.result = `<span>${esc(t("rem.later"))}</span>`; renderRemind();
};

// ---- Selection: the admin picks who plays, in the way the team's sport does it ----
// Formats (settings/sel, else the sport's default below): squad = n starters + b on the bench, optionally with positions
// and a captain (hockey, football…); order = n players in playing order, sorted by handicap or ranking (golf, tennis);
// pairs = n pairs (padel, doubles), strongest first. selection/<date> = { p: { <pid>: "s" | "r" }, o: playing / reserve
// order, pos: position or "bench", pair: pair number, cap: captain, pub, at } (functions/lineup.js reads it the same way).
// Publishing tells the players with a notification that names their role (notices k "s") and opens a WhatsApp message.
const SEL_PRESETS = {

  hockey: { f: "squad", n: 11, b: 5, pos: true, cap: true }, football: { f: "squad", n: 11, b: 5, pos: true, cap: true },
  basketball: { f: "squad", n: 5, b: 7, cap: true }, volleyball: { f: "squad", n: 6, b: 6, cap: true }, other: { f: "squad", n: 0, b: 0 },

const SEL_POS = ["gk", "def", "mid", "fwd"];
const RESERVES = 5;
function selFormat() {
  const f = { b: 0, pos: false, cap: false, by: "none", auto: true, ...SEL_PRESETS[sportKey()], ...((root.settings || {}).sel || {}) };
  if (!f.n) f.n = minPlayers();
  if (f.f !== "squad") Object.assign(f, { b: 0, pos: false, cap: false });
  return f;
}
const selOf = e => (root.selection || {})[e.date] || null;
const selNames = (e, players, s) => players.filter(p => p.name && ((selOf(e) || {}).p || {})[p.id] === s).map(p => p.name);
// This player's place (the same as roleOf in functions/lineup.js).
function roleOf(sel, pid) {
  const k = ((sel && sel.p) || {})[pid];
  if (k !== "s" && k !== "r") return null;
  const o = Number((sel.o || {})[pid]) || null, pair = Number((sel.pair || {})[pid]) || null;
  const mate = k === "s" && pair ? Object.keys(sel.pair || {}).find(id => id !== pid && Number(sel.pair[id]) === pair && (sel.p || {})[id] === "s") || null : null;
  return { k, o, pos: k === "s" ? (sel.pos || {})[pid] || null : null, pair: k === "s" ? pair : null, mate, cap: k === "s" && sel.cap === pid };
}
// The player's handicap / ranking / preferred position, from the team's sport fields (common.js sportSlots).
// A team may keep the ranking in the federation field (its label then says "ranking", e.g. "Padel-ranking").
const RANK_LABEL = /rank|klassement|classement|niveau|level/i;
function sportValue(p, kind) {
  let slot = sportSlots(root.settings)[kind];
  if (!slot && kind === "ranking" && RANK_LABEL.test((root.settings || {}).fedLabel || "")) slot = "fed";
  const v = slot ? rowValue(p, slot) : null;
  return v == null || String(v).trim() === "" ? null : String(v).trim();
}
// Handicap: lower is better ("+1.5" is better than 0); ranking: the number in it, higher is better (padel P-levels).
function strength(p, by) {
  const v = by === "handicap" || by === "ranking" ? sportValue(p, by) : null;
  if (v == null) return null;
  const m = /(\+)?\s*(\d+(?:[.,]\d+)?)/.exec(v);
  if (!m) return null;
  const x = Number(m[2].replace(",", "."));
  return by === "handicap" ? -(m[1] ? -x : x) : x; // as a score: higher = stronger
}
const byStrength = by => (a, b) => { const x = strength(a, by), y = strength(b, by); return x == null && y == null ? 0 : x == null ? 1 : y == null ? -1 : y - x; };
function posPref(p) {

}
// Matches played this season: a published selection counts (in the squad, bench included), otherwise answering yes.
function playedCount(p) {

  for (const e of EVENTS) {
    if (!isPast(e) || e.cancelled) continue;
    const s = selOf(e);
    if (s && s.pub ? (s.p || {})[p.id] === "s" : p.avail[e.date] === "yes") n++;

// The line-up as lines of text (window preview, WhatsApp, match card).
function lineupLines(sel, f, players) {
  const P = (sel && sel.p) || {}, name = id => { const p = players.find(x => x.id === id); return p ? displayName(p, players.indexOf(p)) : "?"; };
  const capped = id => name(id) + (sel.cap === id ? " (C)" : "");
  const ids = k => Object.keys(P).filter(id => P[id] === k && players.some(p => p.id === id));
  const byO = (a, b) => (Number((sel.o || {})[a]) || 99) - (Number((sel.o || {})[b]) || 99);

  if (f.f === "squad") {

    for (const k of [...SEL_POS, "start", "bench"]) {
      const g = s.filter(id => pos(id) === k);
      if (g.length) lines.push({ k, label: t(k === "start" ? "sel.group.start" : k === "bench" ? "sel.group.bench" : "sel.pos." + k), text: g.map(capped).join(", ") });
    }
  } else if (f.f === "order") {
    s.sort(byO).forEach((id, i) => lines.push({ k: "o", label: `${i + 1}.`, text: name(id) + (f.by !== "none" && sportValue(players.find(p => p.id === id), f.by) ? ` · ${t("sel.by." + f.by)} ${sportValue(players.find(p => p.id === id), f.by)}` : "") }));
  } else {
    const pairs = {};
    s.forEach(id => { const n = Number((sel.pair || {})[id]) || 0; (pairs[n] = pairs[n] || []).push(id); });
    Object.keys(pairs).map(Number).sort((a, b) => (a || 99) - (b || 99)).forEach(n => lines.push({ k: "p", label: n ? t("sel.slot.pair", { n }) : t("sel.group.start"), text: pairs[n].map(name).join(" + ") }));
  }
  const r = ids("r").sort(byO);
  if (r.length) lines.push({ k: "r", label: t("sel.group.reserves"), text: r.map((id, i) => `${i + 1}. ${name(id)}`).join(", ") });
  return lines;
}
// Checks before publishing: what a federation (or common sense) would object to. Only warnings: the admin decides.
function selChecks(e, f, rec) {
  const all = sortedPlayers(), P = rec.p || {}, s = Object.keys(P).filter(id => P[id] === "s" && root.players[id]);
  const nm = id => { const p = root.players[id]; return p ? firstName(p.name) : "?"; }, list = ids => ids.map(nm).join(", ");
  const out = [];
  const no = s.filter(id => root.players[id].avail && root.players[id].avail[e.date] === "no");
  const away = s.filter(id => !no.includes(id) && awayOn(root.players[id], e.date));
  const open = s.filter(id => !no.includes(id) && !away.includes(id) && !(root.players[id].avail || {})[e.date]);
  if (no.length) out.push(t("sel.chk.no", { names: list(no) }));
  if (away.length) out.push(t("sel.chk.away", { names: list(away) }));
  if (open.length) out.push(t("sel.chk.open", { names: list(open) }));
  if (f.f === "squad") {
    const start = s.filter(id => ((rec.pos || {})[id] || "start") !== "bench"), bench = s.length - start.length;
    if (start.length !== f.n) out.push(t("sel.chk.starters", { s: start.length, n: f.n }));
    if (bench > f.b) out.push(t("sel.chk.bench", { b: bench, B: f.b }));
    if (f.pos && start.length) {
      const gk = start.filter(id => (rec.pos || {})[id] === "gk").length;
      if (!gk) out.push(t("sel.chk.noKeeper"));
      if (gk > 1) out.push(t("sel.chk.keepers", { n: gk }));
    }
    if (f.cap && start.length && !rec.cap) out.push(t("sel.chk.noCap"));
  } else {
    const missing = s.filter(id => f.by !== "none" && strength(root.players[id], f.by) == null);
    if (missing.length) out.push(t("sel.chk.noValue", { by: t("sel.fmt.by." + f.by).toLowerCase(), names: list(missing) }));
    if (f.f === "order") {
      if (s.length < f.n) out.push(t("sel.chk.players", { k: s.length, n: f.n }));
      const ord = s.filter(id => !missing.includes(id)).sort((a, b) => (rec.o || {})[a] - (rec.o || {})[b]);
      for (let i = 1; i < ord.length && f.by !== "none"; i++) {
        const a = root.players[ord[i - 1]], b = root.players[ord[i]];
        if (strength(a, f.by) < strength(b, f.by)) { // a higher number is stronger than a lower one
          out.push(t("sel.chk.order", { a: (rec.o || {})[ord[i - 1]], an: nm(ord[i - 1]), av: sportValue(a, f.by), b: (rec.o || {})[ord[i]], bn: nm(ord[i]), bv: sportValue(b, f.by) }));
          break;
        }
      }
    } else {
      const pairs = {};
      s.forEach(id => { const n = (rec.pair || {})[id]; if (n) (pairs[n] = pairs[n] || []).push(id); });
      const full = Object.keys(pairs).filter(n => pairs[n].length === 2).length;
      if (full < f.n) out.push(t("sel.chk.pairs", { k: full, n: f.n }));
      const single = Object.keys(pairs).filter(n => pairs[n].length === 1);
      if (single.length) out.push(t("sel.chk.single", { n: single.join(", ") }));
      if (f.by !== "none") {
        const sum = n => pairs[n].reduce((x, id) => x + (strength(root.players[id], f.by) ?? NaN), 0);
        const ns = Object.keys(pairs).filter(n => pairs[n].length === 2 && !Number.isNaN(sum(n))).map(Number).sort((a, b) => a - b);
        for (let i = 1; i < ns.length; i++) if (sum(ns[i]) > sum(ns[i - 1])) { out.push(t("sel.chk.pairOrder", { a: ns[i], b: ns[i - 1] })); break; }

// Short words about my own place, for the pill on the match card.
function roleShort(role, players) {

  document.getElementById("venue-chosen").innerHTML = v ? `
    <div class="venue-card">📍 <b>${esc(v.name || "")}</b>${v.address ? `<br><span class="muted">${esc(v.address)}</span>` : ""}
      <div class="venue-actions"><a href="${mapsUrl(v)}" target="_blank" rel="noopener">${t("maps")} ↗</a>
      <button type="button" class="link" data-venue="change">${t("details.change")}</button>
      <button type="button" class="link" data-venue="remove">${t("details.remove")}</button></div></div>` : "";
  document.getElementById("venue-search").hidden = !!v;
  const q = form.q.value.trim();
  const google = q ? `<a class="google-check" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(q)}" target="_blank" rel="noopener">${t("details.googleCheck")}</a>` : "";
  const typed = q ? `<button type="button" class="link" data-venue="typed">${t("details.useTyped")}</button>` : "";
  document.getElementById("venue-results").innerHTML =
    draft.status === "loading" ? `<div class="muted">${t("details.searching")}</div>` :
    draft.status === "error" ? `<div class="warn">${t("details.searchFailed")}</div>` :
    draft.status === "none" ? `<div class="warn">${t("details.noResults")}</div><div class="venue-actions">${typed} ${google}</div>` :
    draft.status === "results" ? draft.results.map((r, i) => `
      <button type="button" class="result" data-pick="${i}">📍 <b>${esc(r.name)}</b>${r.address ? `<br><span class="muted">${esc(r.address)}</span>` : ""}</button>`).join("") +
      `<div class="venue-actions">${typed} ${google}</div>` : "";
}

// Place search (common.js findVenues: Photon, built on OpenStreetMap): sports halls, clubs, addresses.
async function findVenue() {
  const q = form.q.value.trim();
  if (q.length < 2) return;
  draft.status = "loading"; renderVenue();
  try {
    draft.results = await findVenues(q);
    draft.status = draft.results.length ? "results" : "none";
  } catch {
    draft.status = "error";
  }
  renderVenue();
}

let venueTimer;
form.q.addEventListener("input", () => { clearTimeout(venueTimer); venueTimer = setTimeout(findVenue, 700); });
form.q.addEventListener("keydown", ev => { if (ev.key === "Enter") { ev.preventDefault(); clearTimeout(venueTimer); findVenue(); } });
document.getElementById("venue-find").onclick = () => { clearTimeout(venueTimer); findVenue(); };
detailsDlg.addEventListener("click", ev => {
  const pick = ev.target.closest("[data-pick]");
  if (pick) { draft.venue = draft.results[Number(pick.dataset.pick)]; draft.status = "idle"; renderVenue(); }
  const act = ev.target.closest("[data-venue]");
  if (!act) return;
  if (act.dataset.venue === "typed") draft.venue = { name: form.q.value.trim().slice(0, 120) };
  if (act.dataset.venue === "change" || act.dataset.venue === "remove") {
    if (act.dataset.venue === "change") form.q.value = draft.venue.name || "";
    draft.venue = null; draft.status = "idle";
  }
  renderVenue();
});
document.getElementById("details-cancel").onclick = () => detailsDlg.close();
document.getElementById("details-clear").onclick = () => {
  if (!confirm(t("details.clearConfirm"))) return;
  write(`matches/${draft.e.date}`, null);
  detailsDlg.close();
};
form.addEventListener("submit", () => {
  const v = draft.venue;
  const data = {
    start: form.start.value || null,
    end: form.end.value || null,
    venue: v ? {
      name: (v.name || "").slice(0, 120),
      ...(v.address ? { address: v.address.slice(0, 160) } : {}),
      ...(v.lat != null ? { lat: v.lat, lon: v.lon } : {}),
    } : null,
    meet: form.meet.value.trim().slice(0, 120) || null,
    info: form.info.value.trim().slice(0, 200) || null,
  };
  for (const k of Object.keys(data)) if (data[k] === null) delete data[k];
  write(`matches/${draft.e.date}`, Object.keys(data).length ? data : null);
});


document.getElementById("export").onclick = () => {
  const rows = [[t("csv.player"), ...EVENTS.map(e => `${e.date} ${e.opp}`)]];
  sortedPlayers().forEach((p, i) =>
    rows.push([displayName(p, i), ...EVENTS.map(e => LABEL[p.avail[e.date] || ""])]));
  // A cell starting with = + - @ would run as a formula in a spreadsheet: a leading ' keeps it plain text.
  const cell = v => { const s = String(v); return `"${(/^[=+\-@\t\r]/.test(s) ? "'" + s : s).replace(/"/g, '""')}"`; };
  const csv = rows.map(r => r.map(cell).join(",")).join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob(["﻿" + csv], { type: "text/csv" }));
  a.download = "team-availability.csv";
  a.click();
  URL.revokeObjectURL(a.href);
};

// ---- Calendar (.ics) export: match times from the details, else 09:00–17:00 Brussels time ----
const VTIMEZONE = [
  "BEGIN:VTIMEZONE", "TZID:Europe/Brussels",
  "BEGIN:DAYLIGHT", "TZOFFSETFROM:+0100", "TZOFFSETTO:+0200", "TZNAME:CEST",
  "DTSTART:19700329T020000", "RRULE:FREQ=YEARLY;BYMONTH=3;BYDAY=-1SU", "END:DAYLIGHT",
  "BEGIN:STANDARD", "TZOFFSETFROM:+0200", "TZOFFSETTO:+0100", "TZNAME:CET",
  "DTSTART:19701025T030000", "RRULE:FREQ=YEARLY;BYMONTH=10;BYDAY=-1SU", "END:STANDARD",
  "END:VTIMEZONE",
];
const icsText = s => String(s).replace(/[\\;,]/g, c => "\\" + c).replace(/\r\n|\r|\n/g, "\\n");
const hhmmss = hm => hm.replace(":", "") + "00";
// Long lines are folded (RFC 5545) so strict calendar apps accept them.
const fold = line => line.length <= 70 ? line : line.match(/.{1,70}/gu).join("\r\n ");

// Titles read "{player} {TEAM.calendarLabel} {location}"; the player is left out for team-wide exports.
// statusOf(e) may return "maybe" to mark an event as tentative.
// Unique event ids per team; Pampas keeps its original ones so re-importing updates existing events.
const uidDomain = TEAM_ID === "pampas-wintermidam" ? "team-availability" : `${TEAM_ID}.rostiq`;
function buildIcs(events, statusOf = () => "", player = "") {
  const stamp = new Date().toISOString().replace(/[-:]/g, "").replace(/\.\d+/, "");
  const url = pageUrl("");
  const lines = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Caersultancy//RostiQ//EN", "CALSCALE:GREGORIAN", "METHOD:PUBLISH", ...VTIMEZONE];
  for (const e of events) {
    const d = e.date.replace(/-/g, "");
    const m = matchInfo(e), v = m.venue;
    const maybe = statusOf(e) === "maybe";
    const sp = sportInfo();
    const allDay = !m.start && !sp.allDay; // no time known and no default day for this sport: an all-day event
    const start = m.start || (sp.allDay || ["09:00"])[0];
    const end = m.end || (m.start ? `${String(Math.min(23, Number(m.start.slice(0, 2)) + sp.hours)).padStart(2, "0")}${m.start.slice(2)}` : (sp.allDay || ["", "17:00"])[1]);
    const nextDay = new Date(parse(e.date).getTime() + 864e5).toISOString().slice(0, 10).replace(/-/g, "");
    const desc = [m.meet && t("ics.meet", { meet: m.meet }), m.info, v && mapsUrl(v), t("ics.markAvail", { url })].filter(Boolean).join("\n");
    lines.push(
      "BEGIN:VEVENT",
      `UID:${d}-${slug(e.opp)}@${uidDomain}`,
      `DTSTAMP:${stamp}`,
      ...(allDay ? [`DTSTART;VALUE=DATE:${d}`, `DTEND;VALUE=DATE:${nextDay}`]
        : [`DTSTART;TZID=Europe/Brussels:${d}T${hhmmss(start)}`, `DTEND;TZID=Europe/Brussels:${d}T${hhmmss(end)}`]),
      `STATUS:${maybe ? "TENTATIVE" : "CONFIRMED"}`,
      `SUMMARY:${icsText([player, TEAM.calendarLabel || TEAM.shortName || TEAM.brand, e.opp].filter(Boolean).join(" ") + (e.final ? " " + t("ics.final") : "") + (maybe ? " " + t("ics.maybe") : ""))}`,
      `LOCATION:${icsText(v ? venueText(v) : e.opp)}`,
      ...(v && v.lat != null ? [`GEO:${v.lat};${v.lon}`] : []),
      `DESCRIPTION:${icsText(desc)}`,
      "END:VEVENT");
  }
  lines.push("END:VCALENDAR");
  return lines.map(fold).join("\r\n") + "\r\n";
}

function downloadIcs(events, filename, statusOf, player) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([buildIcs(events, statusOf, player)], { type: "text/calendar;charset=utf-8" }));
  a.download = filename;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
// "Add all to calendar": a personal calendar subscription when that's set up (config.js CAL_BASE), else a one-off file.
const calOn = () => !!window.CAL_BASE && AUTH_ON && !DEMO && !!session.pid && !!session.user;
document.getElementById("ics-all").onclick = () => calOn() ? openCalendar() : downloadIcs(EVENTS, "team-schedule-2026-2027.ics");

// ---- Calendar subscription: one read-only link per player (calKeys/<key>, calIndex/<team>/<player>) ----
const calDlg = document.getElementById("cal");
document.getElementById("cal-close").onclick = () => calDlg.close();
let cal = { key: "", hideNo: false, invite: null };
const calRecord = () => ({ t: TEAM_ID, p: session.pid, at: { ".sv": "timestamp" }, l: LANG, ...(cal.hideNo ? { h: true } : {}) });
async function openCalendar() {
  const body = document.getElementById("cal-body");
  body.innerHTML = `<p class="cal-small">${t("cal.loading")}</p>`;
  calDlg.showModal();
  let key = await getAbs(`calIndex/${TEAM_ID}/${session.pid}`);
  let rec = key ? await getAbs(`calKeys/${key}`) : null;
  if (!rec) { // no link yet (or it was stopped): make one
    key = newQuickKey(); cal = { key, hideNo: false };
    const ok = await send("PATCH", "", { [`calKeys/${key}`]: calRecord(), [`calIndex/${TEAM_ID}/${session.pid}`]: key }, true, true);
    if (ok !== true) { body.innerHTML = `<p class="cal-small">${t("cal.failed")}</p>`; return; }
  } else {
    cal = { key, hideNo: rec.h === true, invite: null };
    if (rec.l !== LANG) send("PUT", `calKeys/${key}/l`, LANG, true, true, true); // the feed follows the app's language
  }
  if (window.INVITES_ON) cal.invite = !!(await getAbs(`inviteSubs/${TEAM_ID}/${session.pid}`));
  renderCalendar();
}
function renderCalendar() {
  const https = window.CAL_BASE + cal.key + ".ics", webcal = https.replace(/^https?:/, "webcal:");
  const name = TEAM.shortName || TEAM.brand || "RostiQ";
  document.getElementById("cal-body").innerHTML = `
    <div class="cal-btns">
      <a class="primary-cal" href="${esc(webcal)}">${ic("calendar-plus")} ${t("cal.apple")}</a>
      <a href="https://calendar.google.com/calendar/r?cid=${encodeURIComponent(webcal)}" target="_blank" rel="noopener">${ic("calendar")} ${t("cal.google")}</a>
      <a href="https://outlook.live.com/calendar/0/addfromweb?url=${encodeURIComponent(https)}&name=${encodeURIComponent(name)}" target="_blank" rel="noopener">${ic("calendar")} ${t("cal.outlook")}</a>
      <button type="button" data-cal="copy">${ic("link")} ${t("cal.copy")}</button>
    </div>
    <label class="cal-check"><input type="checkbox" data-cal="hide"${cal.hideNo ? " checked" : ""}> <span>${t("cal.hideNo")}</span></label>
    <p class="cal-small">${t("cal.refresh")}</p>
    <p class="cal-small">${t("cal.private")}</p>
    <div class="cal-links"><button type="button" data-cal="download">${t("cal.download")}</button><button type="button" data-cal="reset">${t("cal.reset")}</button></div>
    ${window.INVITES_ON && session.user.email ? `<div class="cal-invite"><h4>${t("inv.title")}</h4>
      <label class="cal-check"><input type="checkbox" data-cal="invite"${cal.invite ? " checked" : ""}>
        <span>${t("inv.toggle", { email: esc(session.user.email) })}<small>${t("inv.help")}</small></span></label></div>` : ""}`;
}
document.getElementById("cal-body").addEventListener("click", async ev => {
  const b = ev.target.closest("[data-cal]");
  if (!b || b.dataset.cal === "hide") return;
  const act = b.dataset.cal;
  if (act === "copy") {
    try { await navigator.clipboard.writeText(window.CAL_BASE + cal.key + ".ics"); toast(t("cal.copied")); } catch { prompt(t("cal.copy"), window.CAL_BASE + cal.key + ".ics"); }
  }
  if (act === "download") downloadIcs(EVENTS, "team-schedule-2026-2027.ics", e => (root.players[session.pid] || {}).avail?.[e.date]);
  if (act === "reset" && confirm(t("cal.resetConfirm"))) {
    const old = cal.key, key = newQuickKey();
    const ok = await send("PATCH", "", { [`calKeys/${old}`]: null, [`calKeys/${key}`]: { ...calRecord() }, [`calIndex/${TEAM_ID}/${session.pid}`]: key }, true, true);
    if (ok === true) { cal.key = key; renderCalendar(); toast(t("cal.resetDone"), "", 3500); } else toast(t("cal.failed"), "err");
  }
});
document.getElementById("cal-body").addEventListener("change", async ev => {
  if (ev.target.matches('[data-cal="invite"]')) {
    const on = ev.target.checked;
    const ok = await send(on ? "PUT" : "DELETE", `inviteSubs/${TEAM_ID}/${session.pid}`,
      on ? { e: session.user.email, l: LANG, at: { ".sv": "timestamp" } } : undefined, true, true);
    if (ok === true) { cal.invite = on; toast(t(on ? "inv.on" : "inv.off"), "", 4000); }
    else { ev.target.checked = !on; toast(t("cal.failed"), "err"); }
    return;
  }
  if (!ev.target.matches('[data-cal="hide"]')) return;
  cal.hideNo = ev.target.checked;
  const ok = await send(cal.hideNo ? "PUT" : "DELETE", `calKeys/${cal.key}/h`, cal.hideNo ? true : undefined, true, true);
  if (ok === true) toast(t("toast.saved")); else { ev.target.checked = !cal.hideNo; cal.hideNo = !cal.hideNo; toast(t("cal.failed"), "err"); }
});

start();
</script>
