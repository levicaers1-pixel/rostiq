<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title data-i18n-doc="page.title">RostiQ · Availability</title>
<meta name="theme-color" content="#1e1b4b">
<!-- Link preview (WhatsApp, iMessage, Facebook, …) -->
<meta name="description" content="RostiQ – teamplanner voor sportploegen: beschikbaarheid, kalender, carpool en WhatsApp.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="RostiQ">
<meta property="og:title" content="RostiQ">
<meta property="og:description" content="RostiQ – teamplanner voor sportploegen: beschikbaarheid, kalender, carpool en WhatsApp.">
<meta property="og:url" content="https://levicaers1-pixel.github.io/rostiq/">
<meta property="og:image" content="https://levicaers1-pixel.github.io/rostiq/assets/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="RostiQ – teamplanner">
<meta property="og:locale" content="nl_BE">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="RostiQ">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Cormorant+Garamond:wght@600&display=swap">
<link rel="stylesheet" href="common.css">
<script src="boot.js"></script>
<style>

  /* "Next match" hero (replaces the small countdown on this page) */
  #countdown { display: none !important; }
  .hero { position: relative; overflow: hidden; margin-top: 28px; padding: 22px; border-radius: 20px; display: grid; gap: 16px;
    color: var(--brand-text); box-shadow: var(--shadow);
    background: radial-gradient(130% 150% at 100% 0%, color-mix(in srgb, var(--pampas) 32%, var(--brand)) 0%, var(--brand) 58%); }
  .hero::after { content: ""; position: absolute; right: -70px; top: -70px; width: 230px; height: 230px; border-radius: 50%; pointer-events: none;
    border: 30px solid color-mix(in srgb, var(--pampas) 18%, transparent); }
  .hero > * { position: relative; z-index: 1; }
  .hero-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
  .hero-kicker { display: inline-flex; align-items: center; gap: 6px; font-size: .74rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; opacity: .82; }
  .hero-when { padding: 4px 12px; border-radius: 999px; font-size: .85rem; font-weight: 700; background: var(--pampas); color: var(--brand); }
  .hero-main { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
  .hero-title { margin: 0; color: var(--brand-text); font-size: clamp(1.7rem, 1.2rem + 2vw, 2.4rem); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .hero-date { margin-top: 2px; font-weight: 500; opacity: .88; }
  .hero .details { margin-top: 8px; display: grid; gap: 3px; font-size: .85rem; color: color-mix(in srgb, var(--brand-text) 80%, transparent); }
  .hero .details a { color: var(--brand-text); }
  .hero-stat { text-align: right; line-height: 1; }
  .hero-stat b { font-size: 2.7rem; font-weight: 800; }
  .hero-stat span { margin-left: 4px; font-size: 1.1rem; opacity: .75; }
  .hero-stat small { display: block; margin-top: 6px; font-size: .72rem; letter-spacing: .06em; text-transform: uppercase; opacity: .75; }
  .hero .hero-bar .fill { background: color-mix(in srgb, var(--brand-text) 18%, transparent); }
  .hero .hero-bar .yes { background: var(--pampas); }
  .hero .hero-bar .maybe { background: color-mix(in srgb, var(--brand-text) 45%, transparent); }
  .hero .hero-bar .min { background: var(--brand-text); opacity: .7; }
  .hero-people { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; min-height: 30px; }
  .hero .av { border-color: var(--brand); }
  .hero-actions { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .hero-answer { background: color-mix(in srgb, var(--brand-text) 14%, transparent); }
  .hero-answer button { color: color-mix(in srgb, var(--brand-text) 85%, transparent); }
  .hero-answer button:hover:not(:disabled) { background: color-mix(in srgb, var(--brand-text) 14%, transparent); }
  .hero-btns { display: flex; gap: 8px; flex-wrap: wrap; }
  .hero-btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 10px; font-size: .85rem; font-weight: 600; text-decoration: none;
    color: var(--brand-text); background: color-mix(in srgb, var(--brand-text) 12%, transparent); border: 1px solid color-mix(in srgb, var(--brand-text) 22%, transparent); }
  .hero-btn:hover:not(:disabled) { background: color-mix(in srgb, var(--brand-text) 20%, transparent); border-color: color-mix(in srgb, var(--brand-text) 35%, transparent); }
  @media (max-width: 520px) {
    .hero { padding: 18px; }
    .hero-answer { width: 100%; } .hero-answer button { flex: 1; }
    .hero-btns { width: 100%; gap: 6px; flex-wrap: nowrap; }
    .hero-btns .hero-btn { flex: 1; justify-content: center; white-space: nowrap; padding: 9px 8px; font-size: .8rem; min-width: 0; }
    .hero-btns .hero-btn[data-share] { flex: 0 0 auto; padding: 9px 12px; }
  }

  /* Match cards: date, details, progress towards the minimum, who's coming, my answer, the whole team */
  .matches { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(min(380px, 100%), 1fr)); align-items: start; }
  .match { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow-sm);
    padding: 16px; display: grid; grid-template-columns: 58px 1fr auto; gap: 14px 14px; transition: box-shadow .2s var(--ease); }
  .match:hover { box-shadow: var(--shadow); }
  .match.final { border-color: color-mix(in srgb, var(--final) 45%, var(--border)); }
  .match.past { opacity: .55; }
  .m-date { height: 68px; border-radius: 12px; background: color-mix(in srgb, var(--accent) 8%, var(--surface));
    display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1; }
  .m-date b { font-family: var(--font-head); font-weight: var(--head-weight); font-size: 1.55rem; color: var(--accent); font-variant-numeric: lining-nums; }
  .m-date span { font-size: .62rem; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); white-space: nowrap; }
  .m-date b { margin: 3px 0 2px; }
  .m-body { min-width: 0; }
  .m-title { font-weight: 700; font-size: 1.08rem; line-height: 1.3; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; overflow-wrap: anywhere; }
  .m-meta .details { display: grid; gap: 3px; margin-top: 6px; }
  .m-actions { display: flex; gap: 2px; align-items: flex-start; }
  .m-actions button { border-color: transparent; background: transparent; color: var(--muted); padding: 7px; position: relative; }
  .m-actions button:hover:not(:disabled) { color: var(--accent); background: color-mix(in srgb, var(--accent) 8%, var(--surface)); border-color: transparent; }
  .m-actions .count { position: absolute; top: 1px; right: 0; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 999px;
    background: var(--no); color: #fff; font-size: .62rem; font-weight: 700; line-height: 16px; }
  .m-progress, .m-people, .m-mine, .m-team { grid-column: 1 / -1; }
  .bar { position: relative; height: 8px; }
  .bar .fill { display: flex; height: 100%; border-radius: 999px; overflow: hidden; background: color-mix(in srgb, var(--muted) 15%, var(--surface)); }
  .bar .fill span { height: 100%; }
  @keyframes grow { from { width: var(--from); } }
  .bar .yes { background: var(--yes); }
  .bar .maybe { background: color-mix(in srgb, var(--maybe) 55%, var(--surface)); }
  .bar .min { position: absolute; top: -4px; bottom: -4px; width: 2px; margin-left: -1px; border-radius: 2px; background: var(--text); opacity: .5; }
  .m-count { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 10px; font-size: .85rem; color: var(--muted); }
  .m-count b { color: var(--text); font-size: 1.05rem; }
  .m-count .pill { margin-left: auto; }
  .m-people { display: flex; align-items: center; gap: 10px; min-height: 30px; font-size: .82rem; color: var(--muted); }
  .avatars { display: flex; }
  .av { width: 30px; height: 30px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;
    font-size: .68rem; font-weight: 700; color: #fff; border: 2px solid var(--surface); margin-left: -8px; }
  .av:first-child { margin-left: 0; }
  .av.more { background: color-mix(in srgb, var(--muted) 18%, var(--surface)); color: var(--muted); }
  .m-mine { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding-top: 14px; border-top: 1px solid var(--border); }
  .m-mine > span { font-size: .8rem; font-weight: 600; color: var(--muted); margin-right: auto; }
  .answer { display: inline-flex; gap: 3px; padding: 3px; border-radius: 12px; background: color-mix(in srgb, var(--muted) 11%, var(--surface)); }
  .answer button { border: none; background: transparent; border-radius: 9px; padding: 7px 12px; font-weight: 600; color: var(--muted); }
  .answer button:hover:not(:disabled) { background: var(--surface); border: none; }
  .answer button[aria-pressed="true"] { color: #fff; box-shadow: var(--shadow-sm); }
  .answer button[aria-pressed="true"][data-a="yes"] { background: var(--yes); }
  .answer button[aria-pressed="true"][data-a="maybe"] { background: var(--maybe); }
  .answer button[aria-pressed="true"][data-a="no"] { background: var(--no); }
  .m-team { border-top: 1px solid var(--border); padding-top: 12px; }
  .m-team summary { cursor: pointer; list-style: none; display: flex; align-items: center; gap: 7px; font-size: .82rem; font-weight: 600; color: var(--muted); }
  .m-team summary::-webkit-details-marker { display: none; }
  .m-team summary .i:last-child { margin-left: auto; transition: transform .2s var(--ease); }
  .m-team[open] summary .i:last-child { transform: rotate(180deg); }
  .m-team .chips { margin-top: 12px; }
  @media (max-width: 440px) {
    .match { grid-template-columns: 50px 1fr; }
    .m-actions { grid-column: 2; margin-top: -6px; }
    .m-mine > span { width: 100%; }
    .answer { width: 100%; } .answer button { flex: 1; padding: 9px 6px; }
  }
  .section-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin: 44px 0 14px; }
  .section-head h2 { margin: 0; }
  .head-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .tag { font-size: .7rem; font-weight: 600; color: var(--final); border: 1px solid var(--final); border-radius: 999px; padding: 0 6px; margin-left: 6px; white-space: nowrap; vertical-align: 1px; }

  /* Toolbar */
  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
  .legend { display: flex; flex-wrap: wrap; gap: 12px; color: var(--muted); font-size: .85rem; margin-right: auto; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }

  /* Grid */
  .grid-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow-sm); }
  tbody td:not(.name) { padding: 3px; }
  table { border-collapse: collapse; width: 100%; min-width: 900px; }
  th, td { border-bottom: 1px solid var(--border); text-align: center; padding: 0; }
  thead th { font-size: .75rem; font-weight: 600; color: var(--muted); padding: 8px 4px; vertical-align: bottom; line-height: 1.25; }
  thead th .opp { display: block; color: var(--text); font-size: .78rem; }
  thead th.final .opp { color: var(--final); }
  thead th .time { display: block; font-weight: 400; }
  th.name, td.name {
    position: sticky; left: 0; z-index: 1; background: var(--surface);
    text-align: left; min-width: 170px; border-right: 1px solid var(--border);
  }
  td.name { display: flex; align-items: center; gap: 4px; padding: 2px 4px 2px 8px; }
  td.name .num { color: var(--muted); font-size: .75rem; width: 18px; font-variant-numeric: tabular-nums; }
  td.name input {
    flex: 1; min-width: 0; font: inherit; color: var(--text); background: transparent;
    border: 1px solid transparent; border-radius: 6px; padding: 6px;
  }
  td.name input:hover { border-color: var(--border); }
  td.name input:focus { outline: none; border-color: var(--accent); }
  td.name .del { border: none; background: none; color: var(--muted); padding: 4px 6px; visibility: hidden; }
  tr:hover td.name .del { visibility: visible; }
  td.name .cal { border: none; background: none; padding: 4px 6px; font-size: .95rem; }
  td.name .cal:disabled { opacity: .25; cursor: default; }
  td.name .del:hover { color: var(--no); }

  .cell {
    width: 100%; min-width: 60px; height: 34px; border: none; border-radius: 8px; padding: 0;
    background: transparent; font-size: .95rem; font-weight: 700; color: var(--muted);
  }
  .cell:hover { background: var(--bg); }
  .cell[data-s="yes"]   { background: var(--yes-bg);   color: var(--yes); }
  .cell[data-s="maybe"] { background: var(--maybe-bg); color: var(--maybe); }
  .cell[data-s="no"]    { background: var(--no-bg);    color: var(--no); }
  .swatch { width: 14px; height: 14px; border-radius: 4px; display: inline-block; }

  tfoot td { font-size: .8rem; padding: 8px 4px; font-variant-numeric: tabular-nums; border-bottom: none; }
  tfoot td.name { font-weight: 600; }
  tfoot .y { color: var(--yes); font-weight: 700; font-size: .95rem; }
  tfoot .m { color: var(--maybe); }
  tfoot .n { color: var(--no); }

  .note { color: var(--muted); font-size: .8rem; margin-top: 10px; }

  /* Past matches */
  .month li.past { opacity: .45; }
  .month li.past .opp-name { text-decoration: line-through; }

  /* Toolbar controls */
  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .seg button { border: none; border-radius: 0; }
  .seg button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
  .min { display: inline-flex; align-items: center; gap: 6px; font-size: .85rem; color: var(--muted); }
  .min input { width: 56px; font: inherit; padding: 5px 6px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); color: var(--text); }

  /* Totals colored against the minimum */
  tfoot td.ok, .badge.ok       { background: var(--yes-bg); }
  tfoot td.low, .badge.low     { background: var(--maybe-bg); }
  tfoot td.short, .badge.short { background: var(--no-bg); }
  .remind { border: none; background: none; padding: 2px 4px; font-size: .9rem; }

  /* Answer chips (the whole team, in a match card) */
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { font-size: .82rem; padding: 5px 11px; border-radius: 999px; color: var(--muted); border-color: var(--border); }
  .chip[data-s="yes"]   { background: var(--yes-bg);   color: var(--yes);   border-color: transparent; }
  .chip[data-s="maybe"] { background: var(--maybe-bg); color: var(--maybe); border-color: transparent; }
  .chip[data-s="no"]    { background: var(--no-bg);    color: var(--no);    border-color: transparent; }
  .badge { font-size: .8rem; font-weight: 700; border-radius: 999px; padding: 2px 10px; font-variant-numeric: tabular-nums; white-space: nowrap; }

  /* Read-only (other players' answers when logged in) */
  .cell:disabled, .chip:disabled { opacity: 1; cursor: default; }
  .cell:disabled:hover { background: inherit; }
  td.name input[readonly] { cursor: default; }
  td.name input[readonly]:hover { border-color: transparent; }
  tr.me td.name { box-shadow: inset 3px 0 0 var(--accent); }
  tr.me td.name input { font-weight: 700; }
  .chip.me { font-weight: 700; outline: 2px solid var(--accent); outline-offset: 1px; }

  /* Admin: accounts */
  .accounts { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow-sm); padding: 12px 14px; margin-top: 24px; }
  .accounts h2 { margin-top: 0; }
  .accounts ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px 16px; grid-template-columns: repeat(auto-fill, minmax(min(260px, 100%), 1fr)); }
  .accounts li { display: flex; align-items: center; gap: 8px; font-size: .9rem; padding: 3px 0; }
  .accounts li .who { flex: 1; }
  .accounts .muted { color: var(--muted); font-size: .8rem; }
  .wa-setting { margin-top: 16px; border-top: 1px solid var(--border); padding-top: 12px; }
  .wa-setting label { font-weight: 600; font-size: .9rem; }
  .wa-setting .search-row { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
  .wa-setting input { flex: 1 1 240px; min-width: 0; font: inherit; font-size: .9rem; color: var(--text); background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 7px 8px; }
  .wa-setting .err { color: var(--no); }


  /* Admin: match details dialog */
  .details-dlg { width: min(520px, calc(100vw - 32px)); }
  .details-dlg label.block { display: flex; flex-direction: column; gap: 4px; font-size: .8rem; color: var(--muted); margin-top: 12px; }
  .details-dlg .times { display: flex; gap: 12px; flex-wrap: wrap; }
  .details-dlg .times label { display: flex; flex-direction: column; gap: 4px; font-size: .8rem; color: var(--muted); }
  .details-dlg input { font: inherit; font-size: .9rem; color: var(--text); background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 7px 8px; }
  .details-dlg .search-row { display: flex; gap: 6px; margin-top: 4px; }
  .details-dlg .search-row input { flex: 1; min-width: 0; }
  #venue-results { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; font-size: .85rem; }
  #venue-results .result { text-align: left; font-size: .85rem; padding: 7px 10px; }
  .venue-card { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font-size: .9rem; margin-top: 4px; }
  .venue-actions { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; margin-top: 6px; font-size: .85rem; }
  .venue-actions a { color: var(--accent); }
  .details-dlg .muted { color: var(--muted); }
  .details-dlg .warn { color: var(--maybe); }
  .details-dlg .row { margin-top: 16px; align-items: center; }
  .details-dlg .spacer { flex: 1; }
  .details-dlg .primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
  .link-danger { background: none; border: none; padding: 0; color: var(--no); text-decoration: underline; font-size: .85rem; }
</style>
</head>
<body>
<header class="brand">
  <div class="brand-inner">
    <a href="./"><img class="logo rostiq-logo" src="assets/rostiq-logo-header.png" alt="RostiQ"></a>
    <nav class="tabs"><a href="./" aria-current="page" data-i18n="tab.availability">Availability</a><a href="carpool.html" data-i18n="tab.carpool">🚗 Carpool</a><a href="ploeg.html" data-i18n="tab.team">👥 Team</a><a href="admin.html" class="admin-tab" hidden data-i18n="tab.admin">⚙️ Admin</a></nav>
  </div>
</header>
<script>rostiqBootHeader()</script>
<main>
  <h1 data-season>RostiQ</h1>
  <p class="sub"><span data-i18n="avail.sub">Tap a cell to set your availability</span> · <span class="status" id="status" data-i18n="status.connecting">Connecting…</span></p>
  <p class="banner" id="banner" hidden data-i18n-html="banner.noDb"></p>

  <section class="hero" id="hero" hidden aria-live="polite"></section>

  <div class="section-head">
    <h2 data-i18n="matches">Matches</h2>
    <div class="head-actions">
      <button id="past" hidden></button>
      <button id="share-overview" data-i18n="share.overview">📲 Share overview</button>
      <button id="ics-all" class="primary" data-i18n="ics.all" data-i18n-title="ics.allTitle">📅 Add all to calendar</button>
    </div>
  </div>
  <div class="matches" id="matches"></div>

  <div class="section-head">
    <h2 data-i18n="overview">Overview</h2>
    <div class="head-actions">
      <div class="legend">
        <span class="pill yes" data-i18n="legend.yes">✓ Available</span>
        <span class="pill maybe" data-i18n="legend.maybe">? Maybe</span>
        <span class="pill no" data-i18n="legend.no">✗ Not available</span>
      </div>
      <button id="export" data-i18n="export">Export CSV</button>
    </div>
  </div>
  <div class="grid-wrap" id="table-view">
    <table>
      <thead><tr id="head"></tr></thead>
      <tbody id="body"></tbody>
      <tfoot><tr id="foot"></tr></tfoot>
    </table>
  </div>
  <p class="note" data-i18n="note"></p>

</main>


<!-- Admin: time, venue and meeting point for one match -->
<dialog id="details" class="details-dlg">
  <form method="dialog" id="details-form">
    <h3 id="details-title"></h3>
    <div class="times">
      <label><span data-i18n="details.start">Start</span> <input type="time" name="start"></label>
      <label><span data-i18n="details.end">End</span> <input type="time" name="end"></label>
    </div>
    <label class="block"><span data-i18n="details.venue">Venue</span></label>
    <div id="venue-chosen"></div>
    <div id="venue-search">
      <div class="search-row">
        <input name="q" data-i18n-placeholder="details.venuePh" enterkeyhint="search" autocomplete="off">
        <button type="button" id="venue-find" data-i18n="details.search">Search</button>
      </div>
      <div id="venue-results"></div>
    </div>
    <label class="block"><span data-i18n="details.meet">Meeting time / place</span>
      <input name="meet" maxlength="120" data-i18n-placeholder="details.meetPh"></label>
    <label class="block"><span data-i18n="details.info">Extra info</span>
      <input name="info" maxlength="200" data-i18n-placeholder="details.infoPh"></label>
    <div class="row">
      <button type="button" id="details-clear" class="link-danger" data-i18n="details.clear">Clear all</button>
      <span class="spacer"></span>
      <button type="button" id="details-cancel" data-i18n="details.cancel">Cancel</button>
      <button type="submit" class="primary" data-i18n="details.save">Save</button>
    </div>
  </form>
</dialog>

<script>window.SKELETON_PAGE = true;</script>
<script src="icons.js"></script>
<script src="config.js"></script>
<script src="team.js"></script>
<script src="i18n.js"></script>
<script src="common.js"></script>
<script>
const CYCLE = ["", "yes", "maybe", "no"];
const SYMBOL = { "": "–", yes: "✓", maybe: "?", no: "✗" };
const LABEL = { "": "", yes: t("label.yes"), maybe: t("label.maybe"), no: t("label.no") };

let showPast = pref.get("showPast", "0") === "1";

// Avatars: initials on a colour that stays the same for a name.
const initials = n => (n || "?").trim().split(/\s+/).map(w => w[0]).slice(0, 2).join("").toUpperCase();
const avatar = (p, i, popStyle) => `<span class="av${popStyle ? " pop" : ""}" style="background:${avColor(p.name || "")};${popStyle || ""}" title="${esc(displayName(p, i))}">${esc(initials(displayName(p, i)))}</span>`;
const LEVEL_PILL = { ok: "yes", low: "maybe", short: "no" };
const openTeams = new Set(); // match cards whose team list is unfolded (kept across live updates)

// Remembered from the previous render, to animate what changed (bar widths, new avatars, my answer).
const prevBar = {}, prevComing = {}, prevMine = {};
// Running animations by key, with their start time: a re-render (e.g. when the database confirms the change)
// continues them at the same point instead of cutting them off.
const anim = {};
const animStyle = (key, ms, extra = "") => {
  const a = anim[key], t0 = a ? performance.now() - a.at : Infinity;
  return t0 < ms ? `${extra}animation-delay:-${Math.round(t0)}ms;` : null;
};

function renderMatches(players, events) {
  const box = document.getElementById("matches");
  document.getElementById("table-view").hidden = !dataLoaded;
  if (!dataLoaded) { box.innerHTML = skeletonCards(4); return; }
  const min = minPlayers(), named = players.filter(p => p.name), total = Math.max(named.length, min, 1);
  const pct = n => Math.min(100, n / total * 100);
  const me = AUTH_ON ? players.find(p => p.id === session.pid) : null;
  const order = { yes: 0, maybe: 1, no: 2, "": 3 };
  box.innerHTML = events.map(e => {
    const c = tally(e, players);
    const coming = players.filter(p => p.avail[e.date] === "yes");
    const mine = me ? me.avail[e.date] || "" : null;
    const now = performance.now(), w = [pct(c.yes), pct(c.maybe)], before = prevBar[e.date];
    if (!before || before[0] !== w[0] || before[1] !== w[1]) anim["bar:" + e.date] = { at: now, from: before || [0, 0] };
    prevBar[e.date] = w;
    if (prevComing[e.date]) for (const p of coming) if (!prevComing[e.date].has(p.id)) anim[`pop:${e.date}:${p.id}`] = { at: now };
    prevComing[e.date] = new Set(coming.map(p => p.id));
    if (mine !== null && e.date in prevMine && prevMine[e.date] !== mine && mine) anim["just:" + e.date] = { at: now };
    if (mine !== null) prevMine[e.date] = mine;
    const ba = anim["bar:" + e.date];
    const barStyle = i => `width:${w[i]}%;` + (animStyle("bar:" + e.date, 450, `--from:${ba ? ba.from[i] : 0}%;animation:grow .45s var(--ease) both;`) || "");
    const team = players.map((p, i) => ({ p, i, s: p.avail[e.date] || "" })).filter(x => x.p.name)
      .sort((a, b) => order[a.s] - order[b.s] || a.i - b.i);
    return `<article class="match${e.final ? " final" : ""}${isPast(e) ? " past" : ""}">
      <div class="m-date"><span>${fmt(e.date, { weekday: "short" }).replace(".", "")}</span><b>${parse(e.date).getDate()}</b><span>${fmt(e.date, { month: "short" }).replace(".", "")}</span></div>
      <div class="m-body">
        <div class="m-title">${esc(e.opp)}${e.final ? `<span class="pill violet">${ic("trophy")} ${t("final")}</span>` : ""}</div>
        <div class="m-meta">${detailsHtml(e, "", true)}</div>
      </div>
      <div class="m-actions">
        <button data-share="${e.date}" title="${t("share.match")}" aria-label="${t("share.match")}">${ic("share")}</button>
        <button data-ics="${e.date}" title="${t("ics.oneTitle")}" aria-label="${t("ics.oneTitle")}">${ic("calendar-plus")}</button>
        <button class="remind" data-date="${e.date}" title="${t("remind.title", { n: c.missing.length })}" aria-label="${t("remind.short")}"
          ${c.missing.length ? "" : "disabled"}>${ic("bell")}${c.missing.length ? `<span class="count">${c.missing.length}</span>` : ""}</button>
        ${session.admin ? `<button data-edit="${e.date}" title="${t("details.edit")}" aria-label="${t("details.edit")}">${ic("pencil")}</button>` : ""}
      </div>
      <div class="m-progress">
        <div class="bar" data-date="${e.date}"><div class="fill"><span class="yes" style="${barStyle(0)}"></span><span class="maybe" style="${barStyle(1)}"></span></div>
          <i class="min" style="left:${pct(min)}%" title="min. ${min}"></i></div>
        <div class="m-count"><span>${t("match.avail", { y: c.yes, min })}</span>${c.maybe ? `<span>· ${t("match.maybe", { n: c.maybe })}</span>` : ""}
          <span class="pill ${LEVEL_PILL[c.level]}">${t("level." + c.level)}</span></div>
      </div>
      <div class="m-people">${coming.length
        ? `<span class="avatars">${coming.slice(0, 8).map(p => avatar(p, players.indexOf(p), animStyle(`pop:${e.date}:${p.id}`, 350))).join("")}${coming.length > 8 ? `<span class="av more">+${coming.length - 8}</span>` : ""}</span>`
        : `<span>${t("match.nobody")}</span>`}</div>
      ${mine !== null && !isPast(e) ? `<div class="m-mine"><span>${t("match.mine")}</span><div class="answer" role="group" aria-label="${t("match.mine")}">${
        ["yes", "maybe", "no"].map(a => `<button data-answer="${a}" data-date="${e.date}" data-a="${a}" aria-pressed="${mine === a}"${mine === a && animStyle("just:" + e.date, 300) ? ` class="just" style="${animStyle("just:" + e.date, 300)}"` : ""}>${ic({ yes: "check", maybe: "help", no: "x" }[a])} ${t("answer." + a)}</button>`).join("")
      }</div></div>` : ""}
      <details class="m-team" data-date="${e.date}"${openTeams.has(e.date) ? " open" : ""}>
        <summary>${ic("users")} ${t("match.everyone", { n: named.length })}${c.missing.length ? ` · ${t("match.noAnswer", { n: c.missing.length })}` : ""}${ic("chevron-down")}</summary>
        <div class="chips">${team.map(({ p, i, s }) => `<button class="chip${me && p.id === me.id ? " me" : ""}" data-s="${s}" data-pid="${p.id}" data-date="${e.date}"
          ${canEdit(p.id) ? "" : "disabled"}>${SYMBOL[s]} ${esc(displayName(p, i))}</button>`).join("")}</div>
      </details>
    </article>`;
  }).join("");
}
// The next match, big, at the top: countdown, details, progress, who's coming, my answer, quick actions.
function renderHero(players) {
  const el = document.getElementById("hero");
  const e = dataLoaded ? EVENTS.find(x => !isPast(x)) : null;
  el.hidden = !e;
  if (!e) return;
  const c = tally(e, players), min = minPlayers();
  const total = Math.max(players.filter(p => p.name).length, min, 1), pct = n => Math.min(100, n / total * 100);
  const days = Math.round((parse(e.date) - parse(TODAY)) / 864e5);
  const when = days <= 0 ? t("hero.today") : days === 1 ? t("hero.tomorrow") : t("hero.inDays", { n: days });
  const me = AUTH_ON ? players.find(p => p.id === session.pid) : null;
  const mine = me ? me.avail[e.date] || "" : null;
  const coming = players.filter(p => p.avail[e.date] === "yes");
  el.innerHTML = `
    <div class="hero-top"><span class="hero-kicker">${ic("flag")} ${t("hero.next")}</span><span class="hero-when">${when}</span></div>
    <div class="hero-main">
      <div><h2 class="hero-title">${esc(e.opp)}${e.final ? `<span class="pill violet">${ic("trophy")} ${t("final")}</span>` : ""}</h2>
        <div class="hero-date">${esc(fmt(e.date, { weekday: "long", day: "numeric", month: "long" }))}</div>
        ${detailsHtml(e)}</div>
      <div class="hero-stat"><b>${c.yes}</b><span>/ ${min}</span><small>${t("label.yes")}</small></div>
    </div>
    <div class="bar hero-bar"><div class="fill"><span class="yes" style="width:${pct(c.yes)}%"></span><span class="maybe" style="width:${pct(c.maybe)}%"></span></div>
      <i class="min" style="left:${pct(min)}%" title="min. ${min}"></i></div>
    <div class="hero-people">${coming.length ? `<span class="avatars">${coming.slice(0, 10).map(p => avatar(p, players.indexOf(p))).join("")}${
      coming.length > 10 ? `<span class="av more">+${coming.length - 10}</span>` : ""}</span>` : `<span>${t("match.nobody")}</span>`}
      <span class="pill ${LEVEL_PILL[c.level]}">${t("level." + c.level)}</span></div>
    <div class="hero-actions">
      ${mine !== null ? `<div class="answer hero-answer" role="group" aria-label="${t("match.mine")}">${["yes", "maybe", "no"].map(a =>
        `<button data-answer="${a}" data-date="${e.date}" data-a="${a}" aria-pressed="${mine === a}">${ic({ yes: "check", maybe: "help", no: "x" }[a])} ${t("answer." + a)}</button>`).join("")}</div>` : ""}
      <div class="hero-btns">
        <button class="hero-btn" data-ics="${e.date}">${ic("calendar-plus")} ${t("hero.calendar")}</button>
        <a class="hero-btn" href="${pageUrl("carpool.html")}">${ic("car")} ${t("hero.carpool")}</a>
        <button class="hero-btn" data-share="${e.date}" title="${t("share.match")}" aria-label="${t("share.match")}">${ic("share")}</button>
      </div>
    </div>`;
}

const matchesEl = document.getElementById("matches");
matchesEl.addEventListener("toggle", ev => {
  const d = ev.target.closest && ev.target.closest(".m-team");
  if (d) d.open ? openTeams.add(d.dataset.date) : openTeams.delete(d.dataset.date);
}, true);
function onMatchClick(ev) {
  const find = el => EVENTS.find(x => x.date === el.dataset.ics || x.date === el.dataset.share || x.date === el.dataset.edit || x.date === el.dataset.date);
  const ics = ev.target.closest("[data-ics]");
  if (ics) { const e = find(ics); downloadIcs([e], `${e.date}-${slug(e.opp)}.ics`); }
  const share = ev.target.closest("[data-share]");
  if (share) { const e = find(share); openShare(`${t("share.match")} – ${e.opp}`, matchMessage(e)); }
  const edit = ev.target.closest("[data-edit]");
  if (edit) openDetails(find(edit));
  // My own answer: tap again to clear it.
  const ans = ev.target.closest("[data-answer]");
  if (ans && session.pid && root.players[session.pid]) {
    const cur = (root.players[session.pid].avail || {})[ans.dataset.date] || "";
    write(`players/${session.pid}/avail/${ans.dataset.date}`, cur === ans.dataset.answer ? null : ans.dataset.answer);
  }
  const chip = ev.target.closest(".chip[data-pid]");
  if (chip && !chip.disabled) {
    const p = sortedPlayers().find(x => x.id === chip.dataset.pid), e = find(chip);
    if (p && e) cycle(p, e);
  }
}
matchesEl.addEventListener("click", onMatchClick);
document.getElementById("hero").addEventListener("click", onMatchClick);

const minPlayers = () => (root.settings && root.settings.minPlayers) || TEAM.minPlayers || 3;
const shownEvents = () => EVENTS.filter(e => showPast || !isPast(e));

function tally(e, players) {
  const c = { yes: 0, maybe: 0, no: 0, missing: [] };
  for (const p of players) {
    const s = p.avail[e.date];
    if (s) c[s]++;
    else if (p.name) c.missing.push(p.name); // unnamed rows are empty slots
  }
  const min = minPlayers();
  c.level = c.yes >= min ? "ok" : c.yes + c.maybe >= min ? "low" : "short";
  return c;
}

function cycle(p, e) {
  const next = CYCLE[(CYCLE.indexOf(p.avail[e.date] || "") + 1) % CYCLE.length];
  write(`players/${p.id}/avail/${e.date}`, next || null);
}

const nameTimers = {};

function render() {
  // Keep whatever someone is typing (and the caret) intact across live updates.
  const active = document.activeElement;
  const focusId = active && active.dataset && active.dataset.pid;
  const focusVal = focusId ? active.value : null;
  const caret = focusId ? [active.selectionStart, active.selectionEnd] : null;

  const players = sortedPlayers();
  const events = shownEvents();
  renderHero(players);
  renderMatches(players, events);
  renderControls();

  document.querySelector("#table-view table").style.minWidth = `${180 + events.length * 72}px`;
  document.getElementById("head").innerHTML =
    `<th class="name">${t("player")}</th>` +
    events.map(e => `<th class="${e.final ? "final" : ""}">
      ${fmt(e.date, { weekday: "short", day: "numeric", month: "short" })}
      <span class="opp">${esc(e.opp)}${e.final ? " 🏆" : ""}</span>
      ${matchInfo(e).start ? `<span class="time">${esc(matchInfo(e).start)}</span>` : ""}</th>`).join("");

  const body = document.getElementById("body");
  body.innerHTML = "";
  players.forEach((p, i) => {
    const tr = document.createElement("tr");
    const editable = canEdit(p.id);
    if (AUTH_ON && p.id === session.pid) tr.className = "me";
    const nameTd = document.createElement("td");
    nameTd.className = "name";
    nameTd.innerHTML = `<span class="num">${i + 1}</span>`;
    const input = document.createElement("input");
    input.dataset.pid = p.id;
    input.placeholder = t("playerN", { n: i + 1 });
    input.value = p.id === focusId ? focusVal : p.name || "";
    input.readOnly = !editable;
    input.addEventListener("input", () => {
      clearTimeout(nameTimers[p.id]);
      nameTimers[p.id] = setTimeout(() => write(`players/${p.id}/name`, input.value || null), 400);
    });
    const mine = events.filter(e => p.avail[e.date] === "yes" || p.avail[e.date] === "maybe");
    const cal = document.createElement("button");
    cal.className = "cal";
    cal.textContent = "📅";
    cal.disabled = !mine.length;
    cal.title = mine.length ? t("cal.mine", { n: mine.length }) : t("cal.none");
    cal.addEventListener("click", () => {
      const who = slug(p.name || `player-${i + 1}`);
      downloadIcs(mine, `${who}-matches.ics`, e => p.avail[e.date], p.name);
    });
    nameTd.append(input, cal);
    tr.append(nameTd);

    for (const e of events) {
      const td = document.createElement("td");
      const btn = document.createElement("button");
      btn.className = "cell";
      const s = p.avail[e.date] || "";
      btn.dataset.s = s;
      btn.textContent = SYMBOL[s];
      btn.title = LABEL[s];
      btn.disabled = !editable;
      btn.addEventListener("click", () => cycle(p, e));
      td.append(btn);
      tr.append(td);
    }
    body.append(tr);

    if (p.id === focusId) {
      input.focus();
      input.setSelectionRange(caret[0], caret[1]);
    }
  });

  document.getElementById("foot").innerHTML =
    `<td class="name">${t("foot.available", { min: minPlayers() })}</td>` +
    events.map(e => {
      const c = tally(e, players);
      return `<td class="${c.level}"><div class="y">${c.yes}</div>
        <div><span class="m">${c.maybe}?</span> · <span class="n">${c.no}✗</span></div>
        <button class="remind" data-date="${e.date}" title="${t("remind.title", { n: c.missing.length })}"
          ${c.missing.length ? "" : "disabled"}>📣${c.missing.length ? " " + c.missing.length : ""}</button></td>`;
    }).join("");
}

// Coming from the Admin page: ./#edit=YYYY-MM-DD opens that match's details once the data is loaded.
let pendingEdit = location.hash.startsWith("#edit=") ? location.hash.slice(6) : "";
function openPendingEdit() {
  if (!pendingEdit || !session.admin || !session.ready || !root.players) return;
  const e = EVENTS.find(x => x.date === pendingEdit);
  pendingEdit = "";
  history.replaceState(null, "", location.pathname + (TEAM_ID ? `?t=${TEAM_ID}` : ""));
  if (e) setTimeout(() => openDetails(e), 0);
}

function renderControls() {
  openPendingEdit();
  const pastCount = EVENTS.filter(isPast).length;
  const pastBtn = document.getElementById("past");
  pastBtn.hidden = !pastCount;
  pastBtn.textContent = showPast ? t("past.hide") : t("past.show", { n: pastCount });
}


document.getElementById("past").onclick = () => {
  showPast = !showPast; pref.set("showPast", showPast ? "1" : "0"); render();
};

// ---- Ready-made WhatsApp messages ----
const longDate = e => fmt(e.date, { weekday: "long", day: "numeric", month: "long" });
const namesWith = (e, s) => sortedPlayers().filter(p => p.name && (p.avail[e.date] || "") === s).map(p => p.name);

// Everything about one match, including who is available.
function matchMessage(e) {
  const m = matchInfo(e), v = m.venue;
  const yes = namesWith(e, "yes"), maybe = namesWith(e, "maybe"), no = namesWith(e, "no"), none = namesWith(e, "");
  return lines([
    `*🏌️ ${TEAM.shortName || TEAM.brand} – ${e.opp}${e.final ? " " + t("ics.final") : ""}*`,
    `📅 ${longDate(e)}`,
    timeText(e) && `🕘 ${timeText(e)}`,
    v && `📍 ${venueText(v)}`,
    v && `🗺️ ${chatMapsUrl(v)}`,
    weatherFor(e) && wxText(weatherFor(e)),
    m.meet && `🚩 ${t("meet")}: ${m.meet}`,
    m.info && `ℹ️ ${m.info}`,
    BLANK,
    `✅ ${t("label.yes")} (${yes.length}/${minPlayers()}): ${yes.join(", ") || "–"}`,
    maybe.length && `❓ ${t("label.maybe")} (${maybe.length}): ${maybe.join(", ")}`,
    no.length && `❌ ${t("msg.notAvail")} (${no.length}): ${no.join(", ")}`,
    none.length && `⏳ ${t("msg.noAnswer")} (${none.length}): ${none.join(", ")}`,
    BLANK,
    t("msg.fill", { url: pageUrl("") }),
  ]);
}

// All upcoming matches in one message.
function overviewMessage() {
  const players = sortedPlayers();
  const rows = EVENTS.filter(e => !isPast(e)).map(e => {
    const c = tally(e, players), v = matchInfo(e).venue;
    const where = [timeText(e) && `🕘 ${timeText(e)}`, v && `📍 ${venueShort(v)}`].filter(Boolean).join(" · ");
    return lines([
      `*${fmt(e.date, { weekday: "short", day: "numeric", month: "short" })} – ${e.opp}*${e.final ? " 🏆" : ""}`,
      where ? `   ${where}` : null,
      `   ${t("msg.counts", { y: c.yes, min: minPlayers(), m: c.maybe, none: c.missing.length })}`,
    ]);
  });
  return lines([`*${t("msg.overviewHead", { season: seasonName() })}*`, BLANK, rows.join("\n\n"), BLANK, t("msg.fill", { url: pageUrl("") })]);
}
document.getElementById("share-overview").onclick = () => openShare(t("share.overviewTitle"), overviewMessage());

// Reminder for players who haven't answered a match.
document.addEventListener("click", ev => {
  const b = ev.target.closest(".remind");
  if (!b) return;
  const e = EVENTS.find(x => x.date === b.dataset.date);
  const c = tally(e, sortedPlayers());
  const m = matchInfo(e);
  const when = fmt(e.date, { weekday: "long", day: "numeric", month: "long" });
  const details = [timeText(e) && `🕘 ${timeText(e)}`, m.venue && `📍 ${venueText(m.venue)}`].filter(Boolean).join(" · ");
  const text = t("reminder.text", {
    opp: e.opp + (e.final ? " " + t("ics.final") : ""), when,
    details: details ? "\n" + details : "",
    url: pageUrl(""), names: c.missing.join(", "),
  });
  const url = pageUrl("");
  const people = sortedPlayers().filter(p => p.name && !p.avail[e.date]).map(p => ({
    name: p.name, phone: p.phone || "",
    text: t("msg.personalReminder", { first: firstName(p.name), opp: e.opp, when: shortDate(e.date), url }),
  }));
  openShare(t("reminder.heading", { n: c.missing.length, opp: e.opp, when }), text, people);
});

// ---- Admin: match details (time, venue via place search, meeting point) ----
const detailsDlg = document.getElementById("details");
const form = document.getElementById("details-form");
let draft = null; // { e, venue, results, status }

function openDetails(e) {
  const m = matchInfo(e);
  draft = { e, venue: m.venue || null, results: [], status: "idle" };
  document.getElementById("details-title").textContent =
    t("details.title", { opp: e.opp, when: fmt(e.date, { weekday: "long", day: "numeric", month: "long" }) });
  form.start.value = m.start || "";
  form.end.value = m.end || "";
  form.meet.value = m.meet || "";
  form.info.value = m.info || "";
  form.q.value = "";
  renderVenue();
  detailsDlg.showModal();
}

function renderVenue() {
  const v = draft.venue;
  document.getElementById("venue-chosen").innerHTML = v ? `
    <div class="venue-card">📍 <b>${esc(v.name || "")}</b>${v.address ? `<br><span class="muted">${esc(v.address)}</span>` : ""}
      <div class="venue-actions"><a href="${mapsUrl(v)}" target="_blank" rel="noopener">${t("maps")} ↗</a>
      <button type="button" class="link" data-venue="change">${t("details.change")}</button>
      <button type="button" class="link" data-venue="remove">${t("details.remove")}</button></div></div>` : "";
  document.getElementById("venue-search").hidden = !!v;
  const q = form.q.value.trim();
  const google = q ? `<a class="google-check" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(q)}" target="_blank" rel="noopener">${t("details.googleCheck")}</a>` : "";
  const typed = q ? `<button type="button" class="link" data-venue="typed">${t("details.useTyped")}</button>` : "";
  document.getElementById("venue-results").innerHTML =
    draft.status === "loading" ? `<div class="muted">${t("details.searching")}</div>` :
    draft.status === "error" ? `<div class="warn">${t("details.searchFailed")}</div>` :
    draft.status === "none" ? `<div class="warn">${t("details.noResults")}</div><div class="venue-actions">${typed} ${google}</div>` :
    draft.status === "results" ? draft.results.map((r, i) => `
      <button type="button" class="result" data-pick="${i}">📍 <b>${esc(r.name)}</b>${r.address ? `<br><span class="muted">${esc(r.address)}</span>` : ""}</button>`).join("") +
      `<div class="venue-actions">${typed} ${google}</div>` : "";
}

// Free place search (Photon, built on OpenStreetMap): sports halls, clubs, addresses.
const SKIP = new Set(["parcel_locker", "vending_machine", "post_box", "atm", "bench", "waste_basket"]);
async function findVenue() {
  const q = form.q.value.trim();
  if (q.length < 2) return;
  draft.status = "loading"; renderVenue();
  try {
    const url = "https://photon.komoot.io/api/?limit=10&lat=50.85&lon=4.35&bbox=2.4,49.4,6.5,51.8&q=" + encodeURIComponent(q);
    const data = await fetch(url).then(r => r.json());
    const seen = new Set();
    draft.results = data.features
      .filter(f => !SKIP.has(f.properties.osm_value))
      .map(f => {
        const p = f.properties;
        const street = [p.street, p.housenumber].filter(Boolean).join(" ");
        const town = [p.postcode, p.city || p.locality || p.district].filter(Boolean).join(" ");
        const name = p.name || street || town;
        const address = [street !== name ? street : "", town !== name ? town : ""].filter(Boolean).join(", ");
        return { name, address, lat: f.geometry.coordinates[1], lon: f.geometry.coordinates[0] };
      })
      .filter(r => r.name && !seen.has(r.name + r.address) && seen.add(r.name + r.address))
      .slice(0, 6);
    draft.status = draft.results.length ? "results" : "none";
  } catch {
    draft.status = "error";
  }
  renderVenue();
}

let venueTimer;
form.q.addEventListener("input", () => { clearTimeout(venueTimer); venueTimer = setTimeout(findVenue, 700); });
form.q.addEventListener("keydown", ev => { if (ev.key === "Enter") { ev.preventDefault(); clearTimeout(venueTimer); findVenue(); } });
document.getElementById("venue-find").onclick = () => { clearTimeout(venueTimer); findVenue(); };
detailsDlg.addEventListener("click", ev => {
  const pick = ev.target.closest("[data-pick]");
  if (pick) { draft.venue = draft.results[Number(pick.dataset.pick)]; draft.status = "idle"; renderVenue(); }
  const act = ev.target.closest("[data-venue]");
  if (!act) return;
  if (act.dataset.venue === "typed") draft.venue = { name: form.q.value.trim().slice(0, 120) };
  if (act.dataset.venue === "change" || act.dataset.venue === "remove") {
    if (act.dataset.venue === "change") form.q.value = draft.venue.name || "";
    draft.venue = null; draft.status = "idle";
  }
  renderVenue();
});
document.getElementById("details-cancel").onclick = () => detailsDlg.close();
document.getElementById("details-clear").onclick = () => {
  if (!confirm(t("details.clearConfirm"))) return;
  write(`matches/${draft.e.date}`, null);
  detailsDlg.close();
};
form.addEventListener("submit", () => {
  const v = draft.venue;
  const data = {
    start: form.start.value || null,
    end: form.end.value || null,
    venue: v ? {
      name: (v.name || "").slice(0, 120),
      ...(v.address ? { address: v.address.slice(0, 160) } : {}),
      ...(v.lat != null ? { lat: v.lat, lon: v.lon } : {}),
    } : null,
    meet: form.meet.value.trim().slice(0, 120) || null,
    info: form.info.value.trim().slice(0, 200) || null,
  };
  for (const k of Object.keys(data)) if (data[k] === null) delete data[k];
  write(`matches/${draft.e.date}`, Object.keys(data).length ? data : null);
});


document.getElementById("export").onclick = () => {
  const rows = [[t("csv.player"), ...EVENTS.map(e => `${e.date} ${e.opp}`)]];
  sortedPlayers().forEach((p, i) =>
    rows.push([displayName(p, i), ...EVENTS.map(e => LABEL[p.avail[e.date] || ""])]));
  const csv = rows.map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(",")).join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob(["﻿" + csv], { type: "text/csv" }));
  a.download = "team-availability.csv";
  a.click();
  URL.revokeObjectURL(a.href);
};

// ---- Calendar (.ics) export: match times from the details, else 09:00–17:00 Brussels time ----
const VTIMEZONE = [
  "BEGIN:VTIMEZONE", "TZID:Europe/Brussels",
  "BEGIN:DAYLIGHT", "TZOFFSETFROM:+0100", "TZOFFSETTO:+0200", "TZNAME:CEST",
  "DTSTART:19700329T020000", "RRULE:FREQ=YEARLY;BYMONTH=3;BYDAY=-1SU", "END:DAYLIGHT",
  "BEGIN:STANDARD", "TZOFFSETFROM:+0200", "TZOFFSETTO:+0100", "TZNAME:CET",
  "DTSTART:19701025T030000", "RRULE:FREQ=YEARLY;BYMONTH=10;BYDAY=-1SU", "END:STANDARD",
  "END:VTIMEZONE",
];
const icsText = s => String(s).replace(/[\\;,]/g, c => "\\" + c).replace(/\r?\n/g, "\\n");
const hhmmss = hm => hm.replace(":", "") + "00";
// Long lines are folded (RFC 5545) so strict calendar apps accept them.
const fold = line => line.length <= 70 ? line : line.match(/.{1,70}/gu).join("\r\n ");

// Titles read "{player} {TEAM.calendarLabel} {location}"; the player is left out for team-wide exports.
// statusOf(e) may return "maybe" to mark an event as tentative.
// Unique event ids per team; Pampas keeps its original ones so re-importing updates existing events.
const uidDomain = TEAM_ID === "pampas-wintermidam" ? "team-availability" : `${TEAM_ID}.rostiq`;
function buildIcs(events, statusOf = () => "", player = "") {
  const stamp = new Date().toISOString().replace(/[-:]/g, "").replace(/\.\d+/, "");
  const url = pageUrl("");
  const lines = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Caersultancy//RostiQ//EN", "CALSCALE:GREGORIAN", "METHOD:PUBLISH", ...VTIMEZONE];
  for (const e of events) {
    const d = e.date.replace(/-/g, "");
    const m = matchInfo(e), v = m.venue;
    const maybe = statusOf(e) === "maybe";
    const start = m.start || "09:00";
    const end = m.end || (m.start ? `${String((Number(m.start.slice(0, 2)) + 2) % 24).padStart(2, "0")}${m.start.slice(2)}` : "17:00");
    const desc = [m.meet && t("ics.meet", { meet: m.meet }), m.info, v && mapsUrl(v), t("ics.markAvail", { url })].filter(Boolean).join("\n");
    lines.push(
      "BEGIN:VEVENT",
      `UID:${d}-${slug(e.opp)}@${uidDomain}`,
      `DTSTAMP:${stamp}`,
      `DTSTART;TZID=Europe/Brussels:${d}T${hhmmss(start)}`,
      `DTEND;TZID=Europe/Brussels:${d}T${hhmmss(end)}`,
      `STATUS:${maybe ? "TENTATIVE" : "CONFIRMED"}`,
      `SUMMARY:${icsText([player, TEAM.calendarLabel || TEAM.shortName || TEAM.brand, e.opp].filter(Boolean).join(" ") + (e.final ? " " + t("ics.final") : "") + (maybe ? " " + t("ics.maybe") : ""))}`,
      `LOCATION:${icsText(v ? venueText(v) : e.opp)}`,
      ...(v && v.lat != null ? [`GEO:${v.lat};${v.lon}`] : []),
      `DESCRIPTION:${icsText(desc)}`,
      "END:VEVENT");
  }
  lines.push("END:VCALENDAR");
  return lines.map(fold).join("\r\n") + "\r\n";
}

function downloadIcs(events, filename, statusOf, player) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([buildIcs(events, statusOf, player)], { type: "text/calendar;charset=utf-8" }));
  a.download = filename;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
document.getElementById("ics-all").onclick = () => downloadIcs(EVENTS, "team-schedule-2026-2027.ics");

start();
</script>
