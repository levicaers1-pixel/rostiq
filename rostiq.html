<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title data-i18n-doc="rostiq.pageTitle">RostiQ · Teams</title>
<meta name="theme-color" content="#1e1b4b">
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<script>try { if (localStorage.getItem("theme") === "dark") document.documentElement.classList.add("dark"); } catch (e) {}</script>
<style>
  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow-sm); padding: 14px 16px; margin-top: 16px; }
  .panel h2 { margin: 0 0 8px; }
  .muted { color: var(--muted); font-size: .85rem; }
  .ok { color: var(--yes); } .err { color: var(--no); }
  .teams { list-style: none; margin: 0; padding: 0; }
  .teams li { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; padding: 10px 0; border-top: 1px solid var(--border); }
  .teams li:first-child { border-top: none; }
  .teams .swatch { width: 14px; height: 14px; border-radius: 4px; border: 1px solid var(--border); flex-shrink: 0; }
  .teams .name { font-weight: 700; }
  .teams .grow { flex: 1; min-width: 180px; }
  .teams a, .teams button { font-size: .85rem; }
  .teams a.open { padding: 5px 10px; border-radius: 8px; background: var(--accent); color: var(--on-accent); text-decoration: none; }
  form.new { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(min(240px, 100%), 1fr)); }
  form.new label { display: grid; gap: 4px; font-size: .85rem; color: var(--muted); }
  form.new input, form.new select { font: inherit; font-size: .95rem; color: var(--text); background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 8px; }
  form.new .full { grid-column: 1 / -1; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .teams .by { font-size: .78rem; color: var(--muted); }
  .teams button.del { color: var(--no); }
  .signup label.check { display: flex; align-items: center; gap: 8px; font-size: .92rem; }
  .codes { list-style: none; margin: 12px 0; padding: 0; display: grid; gap: 6px; }
  .codes li { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 8px 10px; border: 1px solid var(--border); border-radius: 10px; }
  .codes code { font-weight: 700; font-size: .9rem; }
  .codes .grow { flex: 1; color: var(--muted); font-size: .85rem; }
  form.code-new { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  form.code-new input { font: inherit; font-size: .9rem; padding: 8px 10px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--bg); color: var(--text); }
  form.code-new input[name=code] { text-transform: uppercase; width: 190px; }
  form.code-new input[name=uses] { width: 90px; }
  form.code-new input[name=note] { flex: 1 1 160px; min-width: 0; }
  .fb-filters { display: flex; gap: 6px; flex-wrap: wrap; margin: 6px 0 12px; }
  .fb-filters button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
  .fb-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  .fb-list li { padding: 12px 14px; border: 1px solid var(--border); border-radius: 12px; display: grid; gap: 6px; }
  .fb-list li.new { border-color: color-mix(in srgb, var(--pampas) 60%, var(--border)); box-shadow: inset 3px 0 0 var(--pampas); }
  .fb-list .top { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font-size: .8rem; color: var(--muted); }
  .fb-list .top .when { margin-left: auto; }
  .fb-list .text { white-space: pre-wrap; overflow-wrap: anywhere; font-size: .95rem; }
  .fb-list .ctx { font-size: .76rem; color: var(--muted); }
  .fb-list .acts { display: flex; gap: 12px; flex-wrap: wrap; font-size: .85rem; }
  .fb-list .acts a { color: var(--accent); }
  .err-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .err-head button { font-size: .85rem; font-weight: 500; }
  .err-list { list-style: none; margin: 10px 0 0; padding: 0; }
  .err-list li { padding: 10px 0; border-top: 1px solid var(--border); display: grid; gap: 4px; }
  .err-list li:first-child { border-top: none; }
  .err-list li.list-empty { border-top: none; }
  .err-list code { font-size: .85rem; word-break: break-word; white-space: pre-wrap; }
  .err-list .ctx { font-size: .78rem; color: var(--muted); }
  .teams li.list-empty, .fb-list li.list-empty { display: block; border-top: none; }
  .club-row { display: grid; grid-template-columns: 1fr auto auto; gap: 6px 12px; align-items: center; padding: 10px 0; border-top: 1px solid var(--border); }
  .club-row:first-child { border-top: 0; }
  .club-row small { display: block; color: var(--muted); }
  .club-form { display: grid; gap: 10px; margin-top: 12px; padding: 14px; border: 1px solid var(--border); border-radius: 14px; }
  .club-form .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .club-form label { display: grid; gap: 4px; font-size: .85rem; }
  .club-boxes { display: flex; flex-wrap: wrap; gap: 6px; }
  .club-boxes label { display: inline-flex; gap: 6px; align-items: center; padding: 5px 10px; border-radius: 999px; border: 1px solid var(--border); font-size: .82rem; cursor: pointer; }
  @media (max-width: 560px) { .club-form .two { grid-template-columns: 1fr; } }
  /* Numbers */
  .nums { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .num { padding: 14px; border-radius: 16px; border: 1px solid var(--border); background: var(--surface); }
  .num b { display: block; font-family: Anton, var(--font-head, inherit); font-weight: 400; font-size: 2rem; line-height: 1.05; color: var(--text); }
  .num span { display: block; font-size: .78rem; font-weight: 700; color: var(--muted); }
  .num small { display: block; margin-top: 4px; font-size: .76rem; color: var(--muted); }
  .num small.up { color: var(--yes); font-weight: 700; }
  .nums-h { font-size: .7rem; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin: 18px 0 8px; }
  .weeks { display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px; align-items: end; height: 130px; padding: 0 2px; border-bottom: 1px solid var(--border); }
  .wk { position: relative; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 4px; cursor: default; }
  .wk i { display: block; width: 100%; max-width: 34px; min-height: 2px; background: var(--accent); border-radius: 4px 4px 0 0; }
  .wk em { font-style: normal; font-size: .74rem; font-weight: 700; color: var(--text); }
  .wk:hover i { opacity: .8; }
  .wk .tip { position: absolute; bottom: calc(100% + 4px); left: 50%; transform: translateX(-50%); white-space: nowrap; font-size: .74rem; padding: 4px 8px;
    border-radius: 8px; background: var(--text); color: var(--bg); opacity: 0; pointer-events: none; transition: opacity .12s; }
  .wk:hover .tip, .wk:focus .tip { opacity: 1; }
  .wk-labels { display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px; font-size: .7rem; color: var(--muted); text-align: center; margin-top: 4px; }
  .mix { display: grid; gap: 6px; }
  .mix-row { display: grid; grid-template-columns: 110px 1fr 36px; gap: 10px; align-items: center; font-size: .86rem; }
  .mix-row .track { height: 10px; border-radius: 99px; background: color-mix(in srgb, var(--accent) 8%, transparent); overflow: hidden; }
  .mix-row .track i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
  .mix-row b { text-align: right; font-variant-numeric: tabular-nums; }
  @media (max-width: 700px) { .nums { grid-template-columns: 1fr 1fr; } }
</style>

<body>
<header class="brand">
  <div class="brand-inner">
    <a href="./"><img class="logo rostiq-logo" src="assets/rostiq-logo-header.webp" alt="RostiQ"></a>
  </div>
</header>
<main>
  <h1 data-i18n="rostiq.title">RostiQ</h1>
  <p class="sub"><span data-i18n="rostiq.sub"></span></p>
  <p class="banner" id="no-access" hidden data-i18n="rostiq.noAccess"></p>

  <div id="platform" hidden>
    <section class="panel">
      <h2 data-i18n="rostiq.numbers">Numbers</h2>
      <div id="numbers"><p class="muted">…</p></div>
    </section>

    <section class="panel">
      <h2 data-i18n="rostiq.teams">Teams</h2>
      <ul class="teams" id="teams"><li class="muted">…</li></ul>
    </section>

    <section class="panel" id="fb-panel">
      <h2 data-i18n="fb.inbox">Feedback</h2>
      <div class="fb-filters" id="fb-filters"></div>
      <ul class="fb-list" id="fb-list"><li class="muted">…</li></ul>
    </section>

    <section class="panel" id="err-panel">
      <h2 class="err-head"><span data-i18n="err.title">Error reports</span> <button class="link del" id="err-clear" hidden data-i18n="err.clear">Clear all</button></h2>
      <p class="muted" data-i18n="err.help"></p>
      <ul class="err-list" id="err-list"><li class="muted">…</li></ul>
    </section>

    <section class="panel">
      <h2 data-i18n="rostiq.plans">Plans</h2>
      <p class="muted" id="plans-state"></p>
      <p><button type="button" class="primary" id="plans-pilot">Mark pilot teams</button></p>
      <label class="check"><input type="checkbox" id="plans-preview"> <span data-i18n="rostiq.plansPreview">Preview the plans on this device</span></label>
      <p class="muted" data-i18n="rostiq.plansPreviewHelp"></p>
    </section>

    <section class="panel">
      <h2 data-i18n="rostiq.clubs">Clubs</h2>
      <p class="muted" data-i18n="rostiq.clubsHelp"></p>
      <div id="club-list"></div>
      <div id="club-form-box"></div>
      <p><button type="button" id="club-new" data-i18n="rostiq.clubNew">+ New club</button></p>
    </section>

    <section class="panel signup">
      <h2 data-i18n="rostiq.signup">Self-service</h2>
      <p class="muted" data-i18n-html="rostiq.signupHelp"></p>
      <label class="check"><input type="checkbox" id="signup-open"> <span data-i18n="rostiq.signupOpen">Anyone may start a team (no code needed)</span></label>
      <h3 data-i18n="rostiq.codes" style="margin:16px 0 0;font-size:1rem">Pilot codes</h3>
      <ul class="codes" id="codes"></ul>
      <form class="code-new" id="code-new">
        <input name="code" maxlength="30" required pattern="[A-Za-z0-9\-]{3,30}" placeholder="PILOT-7KQ3-M9XR">
        <button type="button" id="code-dice" data-i18n-title="rostiq.codeRandom" aria-label="New random code">🎲</button>
        <input name="uses" type="number" min="1" max="1000" value="5" required data-i18n-title="rostiq.codeUses">
        <input name="note" maxlength="60" data-i18n-placeholder="rostiq.codeNote">
        <button class="primary" data-i18n="rostiq.codeAdd">Create code</button>
      </form>
    </section>

    <section class="panel">
      <h2 data-i18n="rostiq.new">New team</h2>
      <form class="new" id="new-team">
        <label><span data-i18n="rostiq.fBrand">Team name</span><input name="brand" maxlength="60" required></label>
        <label><span data-i18n="rostiq.fId">Short id</span><input name="id" maxlength="40" required pattern="[a-z0-9][a-z0-9\-]{1,39}">
          <span data-i18n="rostiq.fIdHelp"></span></label>
        <label><span data-i18n="rostiq.fSeason">Season</span><input name="season" maxlength="60"></label>
        <label><span data-i18n="rostiq.fAdminName">Admin name</span><input name="adminName" maxlength="60"></label>
        <label><span data-i18n="rostiq.fMin">Minimum players</span><input name="min" type="number" min="1" max="50" value="4" required></label>
        <label><span data-i18n="rostiq.fColor">Colours</span>
          <select name="colors"></select></label>
        <div class="full"><button type="submit" class="primary" data-i18n="rostiq.create">Create team</button> <span class="msg"></span></div>
      </form>
    </section>
  </div>
</main>

<script>window.PLATFORM_PAGE = true;</script>
<script src="icons.js"></script>
<script src="config.js"></script>
<script src="team.js"></script>
<script src="i18n.js"></script>
<script src="common.js"></script>
<script>
const ID_OK = /^[a-z0-9][a-z0-9-]{1,39}$/;
let teams = null; // [{ id, info, members }]

const shallow = async path => { const u = await dbUrlAbs(path); return u + (u.includes("?") ? "&" : "?") + "shallow=true"; };
async function loadTeams() {
  const ids = Object.keys((await fetch(await shallow("teams")).then(r => r.json()).catch(() => null)) || {});
  teams = await Promise.all(ids.map(async id => {
    const memberIds = Object.keys((await fetch(await shallow(`teams/${id}/members`)).then(r => r.json()).catch(() => null)) || {});
    const admins = Object.keys((await fetch(await shallow(`teams/${id}/admins`)).then(r => r.json()).catch(() => null)) || {}).length;
    const players = Object.keys((await fetch(await shallow(`teams/${id}/players`)).then(r => r.json()).catch(() => null)) || {}).length;
    // Who started it: teamCreators/<team> (older teams: still inside meta until the daily job moves it).
    const [meta, cr] = await Promise.all([getAbs(`teams/${id}/meta`), getAbs(`teamCreators/${id}`)]);
    const m = meta || cr ? { ...(meta || {}), ...(cr ? { creatorName: cr.n, creatorEmail: cr.e, code: cr.c } : {}) } : null;
    return { id, info: (await getAbs(`teams/${id}/info`)) || {}, meta: m, memberIds, members: memberIds.length, admins, players, seen: (await getAbs(`lastSeen/${id}`)) || {} };
  }));
  signup = { open: (await getAbs("signup/open")) === true, codes: (await getAbs("signupCodes")) || {} };
  feedback = (await getAbs("feedback")) || {};
  errors = (await getAbs("errors")) || {};
  bills = (await getAbs("billing")) || {};
  clubs = (await getAbs("clubs")) || {};
  teams.sort((a, b) => (a.info.brand || a.id).localeCompare(b.info.brand || b.id));
  render();
}

function render() {
  const ok = AUTH_ON ? session.platformAdmin : true;
  document.getElementById("no-access").hidden = ok || !session.ready;
  document.getElementById("platform").hidden = !ok;
  if (!ok) return;
  if (!teams) { teams = []; loadTeams(); return; }
  document.getElementById("teams").innerHTML = teams.length ? teams.map(x => {
    const color = (x.info.colors && x.info.colors.light && x.info.colors.light["--brand"]) || "#1e1b4b";
    const link = appUrl("index.html") + "?t=" + x.id;
    return `<li>
      <span class="swatch" style="background:${esc(color)}"></span>
      <div class="grow"><div class="name">${esc(x.info.brand || x.id)}</div>
        <div class="muted">${esc(x.info.season || "")} · ${esc(x.id)} · ${t("rostiq.members", { n: x.members })}
          ${!x.members ? `<span class="pill gray">${t("rostiq.emptyTeam")}</span>` : !x.admins ? `<span class="pill maybe">${t("rostiq.noAdmin")}</span>` : ""}
          <span class="pill ${planOf(bills[x.id]) === "free" ? "gray" : "yes"}">${esc(t("plan." + planOf(bills[x.id])))}${bills[x.id] && bills[x.id].src === "pilot" ? " · pilot" : ""}</span></div>
        ${x.meta ? `<div class="by">${t("rostiq.startedBy", { who: esc(x.meta.creatorName || "?") + (x.meta.creatorEmail ? ` (${esc(x.meta.creatorEmail)})` : ""),
          when: esc(new Date(x.meta.createdAt || 0).toLocaleDateString(LOCALE)) })}${x.meta.code ? ` · ${esc(x.meta.code)}` : ""}</div>` : ""}</div>
      <button class="link" data-plan-edit="${esc(x.id)}">${t("rostiq.planEdit")}</button>
      <button class="link" data-copy="${esc(link)}">${t("rostiq.copyInvite")}</button>
      <a class="open" href="${esc(link)}">${t("rostiq.open")}</a>
      <button class="link del" data-delete="${esc(x.id)}">${t("rostiq.delete")}</button>
    </li>`;
  }).join("") : `<li class="list-empty">${emptyState("users", t("rostiq.none"), "", "", true)}</li>`;
  renderFeedback();
  renderErrors();
  renderClubs();
  renderNumbers();
  // Plans
  const unmarked = teams.filter(pilotUnmarked);
  document.getElementById("plans-pilot").textContent = t("rostiq.plansPilot", { n: unmarked.length });
  document.getElementById("plans-pilot").disabled = !unmarked.length;
  document.getElementById("plans-state").textContent = t(window.PLANS_ON ? "rostiq.plansOn" : "rostiq.plansOff");
  document.getElementById("plans-preview").checked = pref.get("plansPreview", "") === "1";
  // Self-service
  document.getElementById("signup-open").checked = signup.open;
  const codes = Object.entries(signup.codes).sort(([a], [b]) => a.localeCompare(b));
  document.getElementById("codes").innerHTML = codes.length ? codes.map(([c, v]) => `<li><code>${esc(c)}</code>
      <span class="pill ${v.uses > 0 ? "yes" : "gray"}">${t("rostiq.codeLeft", { n: v.uses || 0 })}</span>
      <span class="grow">${esc(v.note || "")}</span>
      <button class="link" data-copy="${esc(appUrl("start.html"))}">${t("rostiq.copyStart")}</button>
      <button class="link del" data-code-del="${esc(c)}">${t("rostiq.delete")}</button></li>`).join("")
    : `<li class="muted">${t("rostiq.noCodes")}</li>`;
}
let signup = { open: false, codes: {} }, bills = {};
// ---- Numbers: growth, use, plans and money, from what this page already loads (nothing extra is stored) ----
// Season: 1 July – 30 June. Money counts live Mollie payments only (test payments and refunds left out); clubs are
// invoiced, so their amount is what the count of 1 October says (or so far).
function renderNumbers() {
  const box = document.getElementById("numbers"), now = Date.now(), DAY = 864e5, list = teams || [];
  const today = new Date().toLocaleDateString("sv-SE"), y = Number(today.slice(0, 4)), m = Number(today.slice(5, 7));
  const seasonFrom = `${m >= 7 ? y : y - 1}-07-01`, seasonStartMs = Date.parse(seasonFrom + "T00:00:00");
  const created = x => (x.meta && x.meta.createdAt) || 0;
  const newIn = days => list.filter(x => created(x) > now - days * DAY).length;
  const uids = new Set(list.flatMap(x => x.memberIds || []));
  const active = new Set(list.flatMap(x => Object.entries(x.seen || {}).filter(([, at]) => typeof at === "number" && at > now - 7 * DAY).map(([uid]) => uid)));
  // Plans, per team
  const kind = x => {
    const b = bills[x.id] || {}, p = planOf(b);
    if (p === "club") return "club";
    if (p === "pro") return b.plan && b.src === "paid" ? "paid" : b.plan && b.src === "pilot" ? "pilot" : b.plan ? "gift" : "trial";
    return "free";
  };
  const kinds = ["free", "trial", "paid", "pilot", "gift", "club"], count = Object.fromEntries(kinds.map(k => [k, 0]));
  list.forEach(x => count[kind(x)]++);
  // Big Free teams (more players than the hint in Beheer): would a player limit matter?
  const big = list.filter(x => kind(x) === "free" && x.players > FREE_PLAYERS_HINT), biggest = Math.max(0, ...list.map(x => x.players || 0));
  // Trials: started, still running, ended; of the ended ones, how many pay now
  const trials = list.filter(x => typeof (bills[x.id] || {}).trial === "number");
  const ended = trials.filter(x => bills[x.id].trial < now), converted = ended.filter(x => kind(x) === "paid");
  // Money this season
  const receipts = Object.values(bills).flatMap(b => Object.values((b && b.history) || {})).filter(r => r && r.mode === "live" && r.at >= seasonStartMs);
  const paid = receipts.filter(r => !r.refunded).reduce((n, r) => n + (r.cents || 0), 0);
  const refunded = receipts.filter(r => r.refunded).reduce((n, r) => n + (r.cents || 0), 0);
  const clubCents = Object.values(clubs).reduce((n, c) => n + ((c.stats && ((c.stats.count && c.stats.count.cents) || c.stats.cents)) || 0), 0);
  const eur = c => new Intl.NumberFormat(LOCALE, { style: "currency", currency: "EUR", maximumFractionDigits: c % 100 ? 2 : 0 }).format(c / 100);
  const tile = (value, label, sub, up) => `<div class="num"><span>${esc(label)}</span><b>${esc(String(value))}</b>${sub ? `<small class="${up ? "up" : ""}">${esc(sub)}</small>` : ""}</div>`;
  // New teams per week, the last 8 weeks (Monday to Sunday)
  const monday = d => { const x = new Date(d); x.setHours(0, 0, 0, 0); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x.getTime(); };
  const thisWeek = monday(now), weeks = Array.from({ length: 8 }, (_, i) => thisWeek - (7 - i) * 7 * DAY);
  const perWeek = weeks.map(w => list.filter(x => created(x) >= w && created(x) < w + 7 * DAY).length), top = Math.max(1, ...perWeek);
  const wkLabel = w => new Date(w).toLocaleDateString(LOCALE, { day: "numeric", month: "short" });
  box.innerHTML = `
    <div class="nums">
      ${tile(list.length, t("num.teams"), newIn(7) ? t("num.newWeek", { n: newIn(7) }) : t("num.newMonth", { n: newIn(30) }), newIn(7) > 0)}
      ${tile(uids.size, t("num.accounts"), t("num.accountsSub"))}
      ${tile(active.size, t("num.active"), uids.size ? t("num.activeShare", { p: Math.round(100 * active.size / uids.size) }) : "")}
      ${tile(count.paid, t("num.paying"), t("num.payingSub", { n: count.pilot + count.gift }))}
    </div>
    <div class="nums" style="margin-top:10px">
      ${tile(eur(paid), t("num.revenue"), refunded ? t("num.refunded", { amount: eur(refunded) }) : t("num.revenueSub"))}
      ${tile(eur(clubCents), t("num.clubs", { n: Object.keys(clubs).length }), t("num.clubsSub"))}
      ${tile(trials.length - ended.length, t("num.trials"), t("num.trialsSub", { n: trials.length }))}
      ${tile(ended.length ? Math.round(100 * converted.length / ended.length) + "%" : "–", t("num.conversion"), t("num.conversionSub", { n: converted.length, of: ended.length }))}
    </div>
    <div class="nums-h">${esc(t("num.perWeek"))}</div>
    <div class="weeks" role="img" aria-label="${esc(t("num.perWeek") + ": " + perWeek.join(", "))}">${perWeek.map((n, i) => `<div class="wk" tabindex="0">
      <span class="tip">${esc(t("num.weekTip", { n, week: wkLabel(weeks[i]) }))}</span>${n ? `<em>${n}</em>` : ""}<i style="height:${Math.round(100 * n / top * .82)}%"></i></div>`).join("")}</div>
    <div class="wk-labels">${weeks.map((w, i) => `<span>${i === 7 ? esc(t("num.thisWeek")) : esc(wkLabel(w))}</span>`).join("")}</div>
    <div class="nums-h">${esc(t("num.plans"))}</div>
    <div class="mix">${kinds.map(k => `<div class="mix-row"><span>${esc(t("num.k." + k))}</span>
      <span class="track"><i style="width:${list.length ? Math.round(100 * count[k] / list.length) : 0}%"></i></span><b>${count[k]}</b></div>`).join("")}</div>
    <p class="muted" id="num-big">${esc(t("num.big", { n: big.length, hint: FREE_PLAYERS_HINT, biggest }))}</p>`;
}

// ---- Clubs (functions/clubs.mjs): a club, its teams (all on the Club plan) and its people responsible ----
let clubs = {}, clubForm = null, adminCands = {};
const teamName = id => (((teams || []).find(x => x.id === id) || {}).info || {}).brand || id;
const seasonEnd = () => { const d = new Date(); return `${d.getMonth() >= 4 ? d.getFullYear() + 1 : d.getFullYear()}-06-30`; }; // from May: the coming season
const clubMoney = cents => new Intl.NumberFormat(LOCALE, { style: "currency", currency: "EUR", maximumFractionDigits: 0 }).format(cents / 100);
function renderClubs() {
  const list = Object.entries(clubs).sort(([, a], [, b]) => a.name.localeCompare(b.name));
  document.getElementById("club-list").innerHTML = list.length ? list.map(([cid, c]) => {
    const st = c.stats, n = Object.keys(c.teams || {}).length, count = st && st.count;
    return `<div class="club-row"><div><b>${esc(c.name)}</b><small>${esc(t("rostiq.clubLine", { teams: n, active: st ? st.active : "?", until: c.until }))}${
      count ? ` · ${esc(t("rostiq.clubCounted", { price: clubMoney(count.cents) }))}` : st ? ` · ${esc(t("rostiq.clubSoFar", { price: clubMoney(st.cents) }))}` : ""}</small></div>
      <a class="link" href="${appUrl("club.html")}?c=${encodeURIComponent(cid)}">${t("rostiq.open")}</a>
      <button class="link" data-club-edit="${esc(cid)}">✏️</button></div>`;
  }).join("") : `<p class="muted">${t("rostiq.noClubs")}</p>`;
  const box = document.getElementById("club-form-box");
  if (!clubForm) { box.innerHTML = ""; return; }
  const f = clubForm, candIds = Object.keys(adminCands).filter(uid => adminCands[uid].teams.some(tid => f.teams.has(tid)) || f.admins.has(uid));
  box.innerHTML = `<form class="club-form" id="club-form">
    <div class="two"><label><span>${t("rostiq.clubName")}</span><input name="name" maxlength="80" required value="${esc(f.name)}"></label>
      <label><span>${t("rostiq.clubUntil")}</span><input name="until" type="date" required value="${esc(f.until)}"></label></div>
    <div><b style="font-size:.85rem">${t("rostiq.clubTeams")}</b><div class="club-boxes">${(teams || []).map(x => {
      const other = Object.entries(clubs).find(([cid, c]) => cid !== f.id && (c.teams || {})[x.id]);
      return `<label><input type="checkbox" data-ct="${esc(x.id)}"${f.teams.has(x.id) ? " checked" : ""}${other ? " disabled" : ""}> ${esc(x.info.brand || x.id)}${other ? ` <small>(${esc(other[1].name)})</small>` : ""}</label>`;
    }).join("")}</div></div>
    <div><b style="font-size:.85rem">${t("rostiq.clubAdmins")}</b><p class="muted" style="margin:2px 0 6px;font-size:.8rem">${t("rostiq.clubAdminsHelp")}</p>
      <div class="club-boxes">${candIds.length ? candIds.map(uid => `<label><input type="checkbox" data-ca="${esc(uid)}"${f.admins.has(uid) ? " checked" : ""}> ${esc(adminCands[uid].name)} <small>(${esc(adminCands[uid].teams.map(teamName).join(", "))})</small></label>`).join("")
        : `<span class="muted" style="font-size:.82rem">${t("rostiq.clubPickTeams")}</span>`}</div></div>
    <div class="form-actions"><button class="primary">${t(f.id ? "rostiq.clubSave" : "rostiq.clubCreate")}</button>
      <button type="button" data-club-cancel>${t("brand.cancel")}</button>
      ${f.id ? `<button type="button" class="link del" data-club-del>${t("rostiq.delete")}</button>` : ""}</div></form>`;
}
// Who can be responsible: the admins of the club's teams (with their player name in that team).
async function loadAdminCands(ids) {
  for (const tid of ids) {
    if (Object.values(adminCands).some(c => c.teams.includes(tid))) continue;
    const [adm, mem] = await Promise.all([getAbs(`teams/${tid}/admins`), getAbs(`teams/${tid}/members`)]);
    for (const uid of Object.keys(adm || {})) {
      const pid = (mem || {})[uid], name = pid ? (await getAbs(`teams/${tid}/players/${pid}/name`)) || "?" : "?";
      const c = adminCands[uid] || (adminCands[uid] = { name, teams: [] });
      if (!c.teams.includes(tid)) c.teams.push(tid);
      if (c.name === "?") c.name = name;
    }
  }
  renderClubs();
}
function openClubForm(cid) {
  const c = cid ? clubs[cid] : null;
  clubForm = { id: cid || "", name: c ? c.name : "", until: c ? c.until : seasonEnd(), teams: new Set(Object.keys((c && c.teams) || {})),
    admins: new Set(Object.keys((c && c.admins) || {})), before: c ? { teams: Object.keys(c.teams || {}), admins: Object.keys(c.admins || {}) } : { teams: [], admins: [] } };
  renderClubs();
  loadAdminCands([...clubForm.teams]);
}
document.getElementById("club-new").onclick = () => openClubForm("");
document.getElementById("club-list").addEventListener("click", ev => { const b = ev.target.closest("[data-club-edit]"); if (b) openClubForm(b.dataset.clubEdit); });
document.getElementById("club-form-box").addEventListener("change", ev => {
  if (!clubForm) return;
  const f = clubForm, el = ev.target;
  if (el.name === "until") f.until = el.value;
  if (el.dataset.ct) { el.checked ? f.teams.add(el.dataset.ct) : f.teams.delete(el.dataset.ct); loadAdminCands([...f.teams]); }
  if (el.dataset.ca) el.checked ? f.admins.add(el.dataset.ca) : f.admins.delete(el.dataset.ca);
});
document.getElementById("club-form-box").addEventListener("input", ev => { if (clubForm && ev.target.name === "name") clubForm.name = ev.target.value; });
// Saving: the club, its teams on the Club plan (teams that leave go back to no plan), and the people responsible.
async function saveClub(remove) {
  const f = clubForm, cid = f.id || (f.name.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 40) || "club");
  if (!remove && (!f.name.trim() || !/^\d{4}-06-30$/.test(f.until) || !f.teams.size)) return toast(t("rostiq.clubIncomplete"), "err");
  if (!f.id && clubs[cid]) return toast(t("rostiq.clubExists"), "err");
  const ch = {};
  const leaveTeams = remove ? f.before.teams : f.before.teams.filter(tid => !f.teams.has(tid));
  const leaveAdmins = remove ? f.before.admins : f.before.admins.filter(uid => !f.admins.has(uid));
  if (leaveTeams.length && !confirm(t("rostiq.clubLeaveAsk", { teams: leaveTeams.map(teamName).join(", ") }))) return;
  for (const tid of leaveTeams) for (const k of ["plan", "until", "club", "src"]) ch[`billing/${tid}/${k}`] = null;
  for (const uid of leaveAdmins) ch[`clubAdmins/${uid}/${cid}`] = null;
  if (remove) ch[`clubs/${cid}`] = null;
  else {
    Object.assign(ch, { [`clubs/${cid}/name`]: f.name.trim().slice(0, 80), [`clubs/${cid}/until`]: f.until, [`clubs/${cid}/at`]: Date.now(),
      [`clubs/${cid}/teams`]: Object.fromEntries([...f.teams].map(tid => [tid, true])),
      [`clubs/${cid}/admins`]: f.admins.size ? Object.fromEntries([...f.admins].map(uid => [uid, true])) : null });
    for (const tid of f.teams) Object.assign(ch, { [`billing/${tid}/plan`]: "club", [`billing/${tid}/until`]: f.until, [`billing/${tid}/club`]: cid, [`billing/${tid}/src`]: "paid" });
    for (const uid of f.admins) ch[`clubAdmins/${uid}/${cid}`] = true;
  }
  const ok = await send("PATCH", "", ch, true, true);
  if (ok !== true) return toast(t("status.saveFailed"), "err");
  clubForm = null;
  [clubs, bills] = await Promise.all([getAbs("clubs").then(x => x || {}), getAbs("billing").then(x => x || {})]);
  toast(t(remove ? "rostiq.clubDeleted" : "rostiq.clubSaved"));
  render();
}
document.getElementById("club-form-box").addEventListener("submit", ev => { ev.preventDefault(); saveClub(false); });
document.getElementById("club-form-box").addEventListener("click", ev => {
  if (ev.target.closest("[data-club-cancel]")) { clubForm = null; renderClubs(); }
  if (ev.target.closest("[data-club-del]") && confirm(t("rostiq.clubDelAsk", { name: clubForm.name }))) saveClub(true);
});
// Plans: mark every team without a plan as a pilot team (Pro until the end of the 2026-27 season).
// Pilot teams: made here by the RostiQ admin (no creator record) or started with a pilot code. Teams started while sign-up
// was open (no code) are not pilots: they start on Free once the plans are on.
const PILOT_UNTIL = "2027-06-30";
const pilotUnmarked = x => (!bills[x.id] || !bills[x.id].plan) && (!x.meta || !!x.meta.code);
document.getElementById("plans-pilot").onclick = async () => {
  const ids = teams.filter(pilotUnmarked).map(x => x.id);
  if (!ids.length || !confirm(t("rostiq.plansPilotAsk", { n: ids.length, date: PILOT_UNTIL }))) return;
  const changes = {};
  for (const id of ids) Object.assign(changes, { [`billing/${id}/plan`]: "pro", [`billing/${id}/until`]: PILOT_UNTIL, [`billing/${id}/src`]: "pilot" });
  const ok = await send("PATCH", "", changes, true, true);
  if (ok !== true) return toast(t("status.saveFailed"), "err");
  bills = (await getAbs("billing")) || {};
  toast(t("rostiq.plansPilotDone", { n: ids.length }));
  render();
};
document.getElementById("plans-preview").onchange = ev => { pref.set("plansPreview", ev.target.checked ? "1" : ""); toast(t(ev.target.checked ? "rostiq.previewOn" : "rostiq.previewOff"), "", 4000); };
// ---- Feedback inbox ----
let feedback = {}, fbFilter = "open";
function renderFeedback() {
  const all = Object.entries(feedback).filter(([, x]) => x && x.text).sort(([, a], [, b]) => (b.at || 0) - (a.at || 0));
  const count = f => all.filter(([, x]) => f(x)).length;
  const filters = { open: x => x.status !== "done", new: x => x.status === "new", bug: x => x.type === "bug", idea: x => x.type === "idea", done: x => x.status === "done", all: () => true };
  document.getElementById("fb-filters").innerHTML = Object.keys(filters).map(k =>
    `<button data-fbf="${k}" aria-pressed="${k === fbFilter}">${t("fb.f." + k)} (${count(filters[k])})</button>`).join("");
  const list = all.filter(([, x]) => filters[fbFilter](x));
  document.getElementById("fb-list").innerHTML = list.length ? list.map(([id, x]) => `<li class="${x.status === "new" ? "new" : ""}">
      <div class="top"><span class="pill ${x.type === "bug" ? "no" : x.type === "praise" ? "yes" : "violet"}">${t("fb.type." + x.type)}</span>
        <span class="pill ${x.status === "new" ? "cyan" : x.status === "done" ? "yes" : "gray"}">${t("fb.s." + x.status)}</span>
        ${x.contact ? `<span>${esc(x.name || "")} ${esc(x.email || "")}</span>` : `<span>${t("fb.anonymous")}</span>`}
        <span class="when">${esc(new Date(x.at || 0).toLocaleString(LOCALE, { dateStyle: "medium", timeStyle: "short" }))}</span></div>
      <div class="text">${esc(x.text)}</div>
      <div class="ctx">${[x.team && `${t("fb.team")}: ${esc(x.team)}`, x.page && `${t("fb.page")}: ${esc(x.page)}`, x.device && esc(x.device), x.version && `v${esc(x.version)}`, x.lang && esc(x.lang.toUpperCase())].filter(Boolean).join(" · ")}</div>
      <div class="acts">
        ${x.contact && x.email ? `<a href="mailto:${esc(x.email)}?subject=${encodeURIComponent("RostiQ: " + t("fb.type." + x.type))}&body=${encodeURIComponent("\n\n> " + x.text.slice(0, 400))}">${t("fb.reply")}</a>` : ""}
        ${x.status !== "seen" && x.status !== "done" ? `<button class="link" data-fbs="${id}" data-to="seen">${t("fb.markSeen")}</button>` : ""}
        ${x.status !== "done" ? `<button class="link" data-fbs="${id}" data-to="done">${t("fb.markDone")}</button>` : `<button class="link" data-fbs="${id}" data-to="seen">${t("fb.reopen")}</button>`}
        <button class="link del" data-fbdel="${id}">${t("rostiq.delete")}</button>
      </div></li>`).join("") : `<li class="list-empty">${emptyState("inbox", t("fb.none"), "", "", true)}</li>`;
}
// ---- Error reports: the same error from many devices is shown once, with a count ----
let errors = {};
function renderErrors() {
  const groups = new Map();
  for (const r of Object.values(errors)) {
    if (!r || !r.items) continue;
    for (const it of Object.values(r.items)) {
      const key = it.msg + "|" + (it.src || ""), g = groups.get(key) || { msg: it.msg, src: it.src || "", n: 0, last: 0, pages: new Set(), devices: new Set(), versions: new Set() };
      g.n += it.n || 1; g.last = Math.max(g.last, r.at || 0);
      if (r.page) g.pages.add(r.page); if (r.device) g.devices.add(r.device.split(" · ").slice(0, 2).join(" · ")); if (r.version) g.versions.add(r.version);
      groups.set(key, g);
    }
  }
  const list = [...groups.values()].sort((a, b) => b.last - a.last);
  document.getElementById("err-clear").hidden = !list.length;
  document.getElementById("err-list").innerHTML = list.length ? list.map(g => `<li>
      <code>${esc(g.msg)}</code>
      <div class="ctx">${[g.src && esc(g.src), t("err.times", { n: g.n }), esc(new Date(g.last).toLocaleString(LOCALE, { dateStyle: "medium", timeStyle: "short" })),
        `${t("fb.page")}: ${esc([...g.pages].join(", "))}`, esc([...g.devices].slice(0, 3).join(" / ")), [...g.versions].map(v => "v" + esc(v)).join(", ")].filter(Boolean).join(" · ")}</div>
    </li>`).join("") : `<li class="list-empty">${emptyState("check", t("err.none"), t("err.noneText"), "", true)}</li>`;
}
document.getElementById("err-clear").addEventListener("click", async () => {
  if (confirm(t("err.clearConfirm")) && await writeAbs("errors", null)) { errors = {}; renderErrors(); }
});

document.getElementById("fb-panel").addEventListener("click", async ev => {
  const f = ev.target.closest("[data-fbf]");
  if (f) { fbFilter = f.dataset.fbf; renderFeedback(); return; }
  const st = ev.target.closest("[data-fbs]");
  if (st && await writeAbs(`feedback/${st.dataset.fbs}/status`, st.dataset.to)) { feedback[st.dataset.fbs].status = st.dataset.to; renderFeedback(); }
  const del = ev.target.closest("[data-fbdel]");
  if (del && confirm(t("fb.delConfirm")) && await writeAbs(`feedback/${del.dataset.fbdel}`, null)) { delete feedback[del.dataset.fbdel]; renderFeedback(); }
});
document.getElementById("signup-open").addEventListener("change", async ev => {
  const ok = await writeAbs("signup/open", ev.target.checked ? true : null);
  if (ok) signup.open = ev.target.checked; else ev.target.checked = signup.open;
  if (ok) toast(t("toast.saved"));
});
// Pilot codes: random by default, so nobody can guess one (a typed word like PILOT-GOLF can be).
// 8 characters from 32 (no 0/O, 1/I/L): about a trillion combinations.
const randomCode = () => {
  const A = "ABCDEFGHJKMNPQRSTUVWXYZ23456789", b = crypto.getRandomValues(new Uint8Array(8));
  const c = [...b].map(x => A[x % A.length]).join("");
  return `PILOT-${c.slice(0, 4)}-${c.slice(4)}`;
};
const codeForm = document.getElementById("code-new");
codeForm.code.value = randomCode();
document.getElementById("code-dice").onclick = () => { codeForm.code.value = randomCode(); };
document.getElementById("code-new").addEventListener("submit", async ev => {
  ev.preventDefault();
  const fm = ev.target, code = fm.code.value.trim().toUpperCase(), uses = Math.max(1, Math.min(1000, Number(fm.uses.value) || 1));
  if (!/^[A-Z0-9-]{3,30}$/.test(code)) return;
  const v = { uses, ...(fm.note.value.trim() ? { note: fm.note.value.trim().slice(0, 60) } : {}) };
  if (await writeAbs(`signupCodes/${code}`, v)) { signup.codes[code] = v; fm.reset(); fm.code.value = randomCode(); render(); toast(t("toast.saved")); }
});
document.getElementById("codes").addEventListener("click", async ev => {
  const d = ev.target.closest("[data-code-del]");
  if (d && confirm(t("rostiq.codeDelConfirm", { code: d.dataset.codeDel })) && await writeAbs(`signupCodes/${d.dataset.codeDel}`, null)) {
    delete signup.codes[d.dataset.codeDel]; render();
  }
  const c = ev.target.closest("[data-copy]");
  if (c) { navigator.clipboard.writeText(c.dataset.copy).catch(() => {}); c.textContent = t("rostiq.copied"); }
});
// Delete a team: the team, everyone's "my teams" entry for it, and the creator's "started" slot.
async function deleteTeam(id) {
  const x = teams.find(tm => tm.id === id);
  if (!x || !confirm(t("rostiq.deleteConfirm", { name: x.info.brand || id }))) return;
  const changes = { [`teams/${id}`]: null, [`lastSeen/${id}`]: null, [`teamCreators/${id}`]: null };
  for (const uid of x.memberIds) changes[`users/${uid}/teams/${id}`] = null;
  if (x.meta && x.meta.createdBy) {
    const slots = (await getAbs(`users/${x.meta.createdBy}/created`)) || {};
    for (const [slot, tid] of Object.entries(slots)) if (tid === id) changes[`users/${x.meta.createdBy}/created/${slot}`] = null;
  }
  if (await send("PATCH", "", changes, true, true) === true) { teams = teams.filter(tm => tm.id !== id); render(); toast(t("rostiq.deleted")); }
  else toast(t("status.saveFailed"), "err");
}

// One team's plan by hand: Pro until a date (a gift), or no plan. Paid and club plans are changed in Mollie / under Clubs.
async function editPlan(id) {
  const b = bills[id] || {};
  if (b.plan === "club") return toast(t("rostiq.planIsClub"), "err");
  const answer = prompt(t("rostiq.planAsk", { team: teamName(id), now: b.plan ? `${b.plan} → ${b.until} (${b.src || "?"})` : t("plan.free") }), b.until || seasonEnd());
  if (answer === null) return;
  const until = answer.trim();
  if (until && !/^\d{4}-\d{2}-\d{2}$/.test(until)) return toast(t("rostiq.planBadDate"), "err");
  if (b.src === "paid" && !confirm(t("rostiq.planPaidAsk"))) return;
  const base = `billing/${id}/`;
  const ok = await send("PATCH", "", until
    ? { [base + "plan"]: "pro", [base + "until"]: until, [base + "src"]: b.src === "pilot" ? "pilot" : "gift" }
    : { [base + "plan"]: null, [base + "until"]: null, [base + "src"]: null }, true, true);
  if (ok !== true) return toast(t("status.saveFailed"), "err");
  bills = (await getAbs("billing")) || {};
  toast(t(until ? "rostiq.planSet" : "rostiq.planCleared", { team: teamName(id), date: until }));
  render();
}
document.getElementById("teams").addEventListener("click", ev => {
  const pe = ev.target.closest("[data-plan-edit]");
  if (pe) return editPlan(pe.dataset.planEdit);
  const del = ev.target.closest("[data-delete]");
  if (del) return deleteTeam(del.dataset.delete);
  const b = ev.target.closest("[data-copy]");
  if (!b) return;
  navigator.clipboard.writeText(b.dataset.copy).catch(() => {});
  b.textContent = t("rostiq.copied");
});

// Colour sets (team admins can fine-tune them later on their Admin page).
const form = document.getElementById("new-team");
form.colors.innerHTML = BRAND_PRESETS.map(([key]) => `<option value="${key}">${t("brand.preset." + key)}</option>`).join("");

// Suggest an id from the team name.
form.brand.addEventListener("input", () => {
  if (!form.id.dataset.touched) form.id.value = slug(form.brand.value).replace(/^-+|-+$/g, "").slice(0, 40);
});
form.id.addEventListener("input", () => { form.id.dataset.touched = "1"; });

form.addEventListener("submit", async ev => {
  ev.preventDefault();
  const msg = form.querySelector(".msg");
  const id = form.id.value.trim(), brand = form.brand.value.trim(), season = form.season.value.trim();
  if (!ID_OK.test(id)) { msg.textContent = t("rostiq.idInvalid"); msg.className = "msg err"; return; }
  if (teams.some(x => x.id === id)) { msg.textContent = t("rostiq.idTaken"); msg.className = "msg err"; return; }
  const min = Math.min(50, Math.max(1, Math.round(Number(form.min.value) || 4)));
  const preset = BRAND_PRESETS.find(p => p[0] === form.colors.value);
  const colors = preset && preset !== BRAND_PRESETS[0] ? makePalette(preset[1], preset[2]) : null; // first = RostiQ default
  const info = { brand, season: season || brand, shortName: season || brand, calendarLabel: brand, teamSize: 0, minPlayers: min,
    ...(form.adminName.value.trim() ? { adminName: form.adminName.value.trim() } : {}), ...(colors ? { colors } : {}) };
  const ok = await writeAbs(`teams/${id}`, { info, settings: { minPlayers: min, scheduleInDb: true, seasonName: season || brand }, initialized: true });
  msg.className = "msg " + (ok ? "ok" : "err");
  msg.textContent = ok ? t("rostiq.created", { name: brand }) : t("status.saveFailed");
  if (ok) { form.reset(); delete form.id.dataset.touched; teams = null; render(); }
});

start();
</script>
