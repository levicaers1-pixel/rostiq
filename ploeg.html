<style>
  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 18px 0 12px; }
  .toolbar input { flex: 1 1 220px; min-width: 0; font: inherit; font-size: .9rem; padding: 7px 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); color: var(--text); }
  .grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(min(300px, 100%), 1fr)); }
  .grid > .empty-state { grid-column: 1 / -1; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 22px; box-shadow: var(--shadow-sm); padding: 0; display: flex; flex-direction: column; gap: 10px; min-width: 0; overflow: hidden; }
  .card.me { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent), var(--shadow-sm); }
  .head { display: flex; gap: 12px; align-items: center; padding: 14px 14px 12px;
    background: linear-gradient(135deg, color-mix(in srgb, var(--brand) 16%, var(--surface)), var(--surface) 75%); }
  .card.me .head { background: linear-gradient(135deg, var(--brand), color-mix(in srgb, var(--brand) 70%, var(--surface))); color: var(--brand-text); }
  .card.me .head .place { color: color-mix(in srgb, var(--brand-text) 78%, transparent); }
  .card.me .head .icon-btn { background: color-mix(in srgb, var(--brand-text) 14%, transparent); border-color: transparent; color: var(--brand-text); }
  .card > .facts, .card > .fill-in { margin: 0 14px; }
  .avatar { width: 52px; height: 52px; box-shadow: 0 0 0 3px var(--surface); border-radius: 50%; background: var(--brand); color: #fff; display: flex; align-items: center; justify-content: center;
    font-family: var(--font-head); font-weight: var(--head-weight); font-size: 1.2rem; flex-shrink: 0; font-variant-numeric: lining-nums; }
  .name { font-weight: 800; font-size: 1.05rem; overflow-wrap: anywhere; }
  .you { font-size: .7rem; font-weight: 700; background: var(--pampas); color: var(--brand); border-radius: 999px; padding: 1px 8px; margin-left: 6px; vertical-align: 2px; }
  .place { color: var(--muted); font-size: .85rem; }
  .head .who { min-width: 0; flex: 1; }
  .icons { display: flex; gap: 4px; align-self: flex-start; }
  .icon-btn { display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; padding: 0; border-radius: 9px;
    border: 1px solid var(--border); background: var(--surface); color: var(--muted); text-decoration: none; }
  .icon-btn:hover { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 40%, var(--border)); }
  .icon-btn.wa { color: #1da851; }
  .facts { font-size: .85rem; color: var(--text); display: flex; flex-wrap: wrap; align-items: center; gap: 2px 6px; overflow-wrap: anywhere; }
  .facts a { color: var(--accent); }
  .facts .lbl { color: var(--muted); }
  .facts .dot { color: var(--muted); }
  .fed { font-variant-numeric: tabular-nums; letter-spacing: .02em; }
  .copy { border: none; background: none; padding: 0 2px; color: var(--muted); vertical-align: -2px; }
  .copy svg.i { width: 14px; height: 14px; }
  .fill-in { align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; font-size: .82rem; padding: 5px 10px; border-radius: 8px; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); margin-top: auto; border-top: 1px solid var(--border); }
  .stats > div { padding: 10px 8px 12px; text-align: center; min-width: 0; }
  .stats > div + div { border-left: 1px solid var(--border); }
  .stats b { display: block; font-family: var(--font-display); font-weight: 400; font-size: 1.55rem; line-height: 1; color: var(--text); }
  .stats b small { font-size: .9rem; color: var(--muted); }
  .stats span { display: block; margin-top: 4px; font-size: .68rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .empty { color: var(--muted); }

  /* RostiQ next: ring, status dot, tags (tiles on phones), season leaderboard, player sheet */
  .av-wrap { position: relative; flex-shrink: 0; }
  .av-wrap .dot { position: absolute; right: -2px; bottom: -2px; width: 14px; height: 14px; border-radius: 50%; border: 3px solid var(--surface); background: var(--yes); }
  .av-wrap .dot.away { background: var(--maybe); }
  .av-wrap .dot.off { background: color-mix(in srgb, var(--muted) 60%, var(--surface)); }
  .card.me .av-wrap .dot { border-color: var(--brand); }
  .p-ring { display: none; position: absolute; right: 10px; top: 10px; width: 42px; height: 42px; border-radius: 50%; place-items: center;
    background: conic-gradient(var(--pampas) 0 var(--p), color-mix(in srgb, var(--muted) 18%, transparent) var(--p)); }
  .p-ring::after { content: ""; position: absolute; inset: 5px; border-radius: 50%; background: var(--surface); }
  .p-ring b { position: relative; z-index: 1; font-size: .62rem; font-weight: 800; }
  .card.me .p-ring::after { background: var(--brand); }
  .p-tags { display: none; gap: 4px; flex-wrap: wrap; }
  .p-tags span { font-size: .64rem; font-weight: 800; padding: 3px 7px; border-radius: 7px; background: color-mix(in srgb, var(--muted) 12%, var(--surface)); color: var(--muted); }
  .card.me .p-tags span { background: color-mix(in srgb, var(--brand-text) 14%, transparent); color: var(--pampas); }
  @media (max-width: 700px) {
    #grid { grid-template-columns: 1fr 1fr; gap: 10px; }
    #grid .card { position: relative; gap: 0; cursor: pointer; }
    #grid .card .head { flex-direction: column; align-items: flex-start; gap: 8px; padding: 12px; background: none; min-height: 100%; }
    #grid .card.me { background: var(--brand); border-color: var(--brand); }
    #grid .card.me .head { color: var(--brand-text); }
    #grid .card .avatar { width: 54px; height: 54px; border-radius: 18px; box-shadow: none; }
    #grid .card .name { font-size: .9rem; line-height: 1.2; }
    #grid .card .you { display: none; }
    #grid .card .place { font-size: .72rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
    #grid .card .who { width: 100%; }
    #grid .card .icons, #grid .card > .facts, #grid .card > .fill-in, #grid .card > .stats { display: none; }
    #grid .card .p-ring { display: grid; }
    #grid .card .p-tags { display: flex; }
  }
  .season-top { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(min(280px, 100%), 1fr)); margin-top: 22px; }
  .season-top h3 { margin: 0 0 8px; font-size: .7rem; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  .lb { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; overflow: hidden; box-shadow: var(--shadow-sm); }
  .lb-row { display: flex; align-items: center; gap: 12px; padding: 11px 14px; font-size: .88rem; font-weight: 700; }
  .lb-row + .lb-row { border-top: 1px solid var(--border); }
  .lb-row .rk { width: 18px; font-family: var(--font-display); font-weight: 400; font-size: 1.1rem; color: var(--muted); }
  .lb-row .avatar { width: 30px; height: 30px; font-size: .7rem; box-shadow: none; }
  .lb-row .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lb-row .v { font-family: var(--font-display); font-weight: 400; font-size: 1.15rem; }
  .p-sheet { padding: 16px; }
  .p-sheet .card { box-shadow: none; border: 0; }
  .p-sheet .p-ring, .p-sheet .p-tags { display: none !important; }
  .p-sheet .sheet-close { display: flex; justify-content: flex-end; margin-top: 10px; }

  /* Edit dialog: photo */
  .photo-row { display: flex; align-items: center; gap: 16px; margin: 4px 0 6px; }
  .avatar.big { width: 72px; height: 72px; font-size: 1.6rem; }
  .photo-btns { display: grid; gap: 6px; justify-items: start; }
  .file-btn { position: relative; overflow: hidden; display: inline-flex; align-items: center; cursor: pointer; font-size: .85rem; font-weight: 500;
    padding: 7px 14px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface); color: var(--text); }
  .file-btn input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
  .edit-dlg label.file-btn { display: inline-flex; margin: 0; color: var(--text); font-size: .85rem; }

  /* Edit dialog */
  .edit-dlg label { display: grid; gap: 4px; font-size: .8rem; color: var(--muted); margin-top: 10px; }
  .edit-dlg input { font: inherit; font-size: .95rem; color: var(--text); background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 8px; }
  .edit-dlg .err { color: var(--no); font-size: .85rem; margin: 8px 0 0; }
  .edit-dlg .hint { color: var(--muted); font-size: .8rem; }
</style>

<body>
<header class="brand">
  <div class="brand-inner">
    <a href="./"><img class="logo rostiq-logo" src="assets/rostiq-logo-header.webp" alt="RostiQ"></a>
    <nav class="tabs"><a href="./" data-tab="home" data-i18n="tab.home">Home</a><a href="./#kalender" data-tab="cal" data-i18n="tab.calendar">Calendar</a><a href="ploeg.html" data-i18n="tab.team">👥 Team</a><a href="admin.html" class="admin-tab" hidden data-i18n="tab.admin">⚙️ Admin</a></nav>
  </div>
</header>
<script>rostiqBootHeader()</script>
<main>
  <h1 data-i18n="team.title">Team</h1>
  <p class="sub"><span data-i18n="team.sub"></span> · <span class="status" id="status" data-i18n="status.connecting">Connecting…</span></p>
  <p class="banner" id="banner" hidden data-i18n-html="banner.noDb"></p>

  <div class="toolbar">
    <input id="filter" type="search" data-i18n-placeholder="team.search" autocomplete="off">
    <button id="export" hidden data-i18n="team.export">⬇️ Export member list</button>
  </div>
  <div class="grid" id="grid"></div>
  <div class="season-top" id="season-top"></div>
</main>

<dialog id="edit" class="edit-dlg">
  <form method="dialog" id="edit-form">
    <h3 id="edit-title"></h3>
    <div class="photo-row">
      <div class="avatar big" id="edit-photo"></div>
      <div class="photo-btns">
        <label class="file-btn"><span data-i18n="photo.choose">Choose photo…</span><input type="file" id="photo-file" accept="image/*"></label>
        <button type="button" class="link err" id="photo-remove" data-i18n="photo.remove">Remove photo</button>
        <small class="err" id="photo-err" hidden></small>
      </div>
    </div>
    <label><span data-i18n="team.fName">Name</span><input name="name" maxlength="60" autocomplete="name"></label>
    <label><span data-i18n="team.fEmail">Email</span><input name="email" type="email" maxlength="100" autocomplete="email"></label>

    <div class="row">

      <button type="submit" class="primary" data-i18n="details.save">Save</button>
    </div>
  </form>
</dialog>

<script>window.SKELETON_PAGE = true;</script>
<script src="icons.js"></script>
<script src="config.js"></script>
<script src="team.js"></script>
<script src="i18n.js"></script>

<script>
const FED = /^[A-Za-z0-9 .\/-]{1,20}$/;
const EMAIL = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
const initials = name => initials0(name) || "?";
let filterText = "";

// Season numbers for one player: answers, and carpool rides as driver / passenger.
function statsFor(p) {
  const s = { yes: 0, maybe: 0, answered: 0, drove: 0, rode: 0 };
  for (const e of EVENTS) {
    const a = (p.avail || {})[e.date];
    if (a) s.answered++;
    if (a === "yes") s.yes++;
    if (a === "maybe") s.maybe++;
    const c = root.carpool && root.carpool[e.date] && root.carpool[e.date][p.id];
    if (c && c.role === "driver") s.drove++;
    if (c && c.role === "rider" && c.with) s.rode++;
  }
  return s;
}

let render = function () {
  document.getElementById("export").hidden = !session.admin;
  const q = filterText.toLowerCase();
  const players = sortedPlayers().filter(p => p.name)
    .filter(p => !q || [p.name, p.gemeente, p.email, p.fed, ...Object.values(p.extra || {})].some(x => String(x || "").toLowerCase().includes(q)));
  const grid = document.getElementById("grid");
  if (!dataLoaded) { grid.innerHTML = skeletonCards(6); return; }
  if (!players.length) {
    grid.innerHTML = q ? emptyState("search", t("team.none"), t("empty.searchText"), `<button type="button" data-clear-search>${ic("x")} ${t("empty.clearSearch")}</button>`)
      : emptyState("users", t("empty.noPlayers"), t(session.admin ? "empty.noPlayersAdmin" : "empty.noPlayersPlayer"));
    return;
  }
  grid.innerHTML = players.map(p => {
    const st = statsFor(p), mine = AUTH_ON && p.id === session.pid, editable = canEdit(p.id);
    const place = (p.geo && p.geo.label) || p.gemeente;
    // Only what's filled in, on one line: email · custom fields · federation number (copyable).
    const facts = [
      p.email && `<a href="mailto:${esc(p.email)}">${esc(p.email)}</a>`,
      ...customFields().filter(([k]) => (p.extra || {})[k]).map(([k, label]) => `<span title="${esc(label)}"><span class="lbl">${esc(label)}</span> ${esc(p.extra[k])}</span>`),
      awayNext(p) && `<span class="pill maybe" title="${esc(awayNext(p).n || "")}">${ic("calendar")} ${t("away.label", { when: esc(awayText(awayNext(p))) })}</span>`,
      trainStat(p) && `<span class="pill gray" title="${esc(t("tr.statTitle"))}">🏃 ${esc(t("tr.stat", trainStat(p)))}</span>`,
      fedOn() && p.fed && `<span><span class="lbl">${esc(fedLabel())}</span> <span class="fed">${esc(p.fed)}</span><button class="copy" data-copy="${esc(p.fed)}" title="${t("copy")}" aria-label="${t("copy")}">${ic("clipboard")}</button></span>`,
    ].filter(Boolean);
    const missing = mine && (!p.email || customFields().some(([k]) => !(p.extra || {})[k]) || (fedOn() && !p.fed));
    const awayNow = !!awayNext(p) && awayNext(p).f <= TODAY;
    const dot = awayNow ? "away" : AUTH_ON && !p.uid ? "off" : AUTH_ON ? "on" : "";
    const pct = EVENTS.length ? Math.round(100 * st.yes / EVENTS.length) : 0;
    const f1 = customFields().find(([k]) => (p.extra || {})[k]);
    const tags = [f1 && `<span>${esc(p.extra[f1[0]])}</span>`, st.drove && `<span>🚗 ${st.drove}</span>`].filter(Boolean);
    return `<article class="card ${mine ? "me" : ""}">
      <div class="head">
        <span class="av-wrap"><div class="avatar" style="${avatarBg(p)}">${photoOf(p) ? "" : esc(initials(p.name))}</div>${dot ? `<span class="dot ${dot}"></span>` : ""}</span>
        <div class="who"><div class="name">${esc(p.name)}${mine ? `<span class="you">${t("team.you")}</span>` : ""}</div>
          <div class="place">${awayNow ? esc(t("away.label", { when: awayText(awayNext(p)) })) : place ? esc(place) : ""}</div>
          ${tags.length ? `<div class="p-tags">${tags.join("")}</div>` : ""}</div>
        <div class="p-ring" style="--p:${pct}%" title="${esc(t("team.statYes"))}"><b>${pct}%</b></div>
        <div class="icons">
          ${p.phone && !mine ? `<a class="icon-btn wa" href="https://wa.me/${p.phone}" target="_blank" rel="noopener" title="WhatsApp" aria-label="WhatsApp">${ic("message")}</a>` : ""}
          ${editable ? `<button class="icon-btn" data-edit="${p.id}" title="${t(mine ? "team.editMine" : "team.edit")}" aria-label="${t(mine ? "team.editMine" : "team.edit")}">${ic("pencil")}</button>` : ""}
        </div>
      </div>
      ${facts.length ? `<div class="facts">${facts.join('<span class="dot">·</span>')}</div>` : ""}
      ${missing ? `<button class="fill-in" data-edit="${p.id}">${ic("plus")} ${t("team.fillIn")}</button>` : ""}
      <div class="stats">
        <div title="${st.maybe ? `? ${st.maybe}` : ""}"><b>${st.yes}<small>/${EVENTS.length}</small></b><span>${t("team.statYes")}</span></div>
        <div><b>${st.drove}</b><span>${t("team.statDrove")}</span></div>
        <div><b>${st.rode}</b><span>${t("team.statRode")}</span></div>
      </div>
    </article>`;
  }).join("");
  renderSeasonTop();
};
function renderSeasonTop() {
  const box = document.getElementById("season-top");
  const all = sortedPlayers().filter(p => p.name).map(p => ({ p, st: statsFor(p) }));
  if (!dataLoaded || filterText || !EVENTS.length || !all.length) { box.innerHTML = ""; return; }
  const list = (key, val) => all.filter(x => x.st[key] > 0).sort((a, b) => b.st[key] - a.st[key] || a.p.name.localeCompare(b.p.name)).slice(0, 3)
    .map((x, i) => `<div class="lb-row"><span class="rk">${i + 1}</span><div class="avatar" style="${avatarBg(x.p)}">${photoOf(x.p) ? "" : esc(initials(x.p.name))}</div>
      <span class="nm">${esc(x.p.name)}</span><span class="v">${val(x)}</span></div>`).join("");
  const yes = list("yes", x => `${x.st.yes}/${EVENTS.length}`), drove = list("drove", x => `🚗 ${x.st.drove}`);
  box.innerHTML = (yes ? `<div><h3>${t("team.topYes")}</h3><div class="lb">${yes}</div></div>` : "") +
    (drove ? `<div><h3>${t("team.topDrove")}</h3><div class="lb">${drove}</div></div>` : "");
}
// Phones: a tap on a tile opens a sheet with the whole card (contact, fields, numbers, edit).
const sheet = document.createElement("dialog");
sheet.className = "p-sheet";
document.body.appendChild(sheet);
sheet.addEventListener("click", ev => {
  if (ev.target === sheet || ev.target.closest("[data-sheet-close]")) return sheet.close();
  const e = ev.target.closest("[data-edit]");
  if (e) { sheet.close(); openEdit(e.dataset.edit); }
});
function openSheet(card) {
  sheet.innerHTML = `<article class="${card.className}">${card.innerHTML}</article>
    <div class="sheet-close"><button type="button" data-sheet-close>${t("close")}</button></div>`;
  sheet.showModal();
}

document.getElementById("filter").addEventListener("input", ev => { filterText = ev.target.value.trim(); render(); });
document.addEventListener("click", ev => {
  if (!ev.target.closest("[data-clear-search]")) return;
  const f = document.getElementById("filter");
  f.value = ""; filterText = ""; render(); f.focus();
});
document.getElementById("grid").addEventListener("click", async ev => {
  const c = ev.target.closest("[data-copy]");
  if (c) {
    try { await navigator.clipboard.writeText(c.dataset.copy); c.textContent = "✓"; setTimeout(() => (c.textContent = "📋"), 1200); } catch {}
  }
  const e = ev.target.closest("[data-edit]");
  if (e) return openEdit(e.dataset.edit);
  const card = ev.target.closest(".card");
  if (card && !c && !ev.target.closest("a, button") && matchMedia("(max-width: 700px)").matches) openSheet(card);
});

// ---- Edit my (or, for the admin, anyone's) details ----
const dlg = document.getElementById("edit"), form = document.getElementById("edit-form");
let editing = null;
function openEdit(pid) {
  const p = root.players[pid];
  editing = pid;
  document.getElementById("edit-title").textContent = p.name || "";
  form.name.value = p.name || "";
  form.email.value = p.email || "";
  form.fed.value = p.fed || "";
  document.getElementById("fed-field").hidden = !fedOn();
  document.getElementById("fed-label").textContent = fedLabel();
  document.getElementById("custom-fields").innerHTML = customFields().map(([k, label]) =>
    `<label><span>${esc(label)}</span><input name="x_${k}" maxlength="60" value="${esc((p.extra || {})[k] || "")}" autocomplete="off"></label>`).join("");
  editPhoto = undefined; // unchanged
  renderEditPhoto();
  form.phone.value = p.phone ? "+" + p.phone : "";
  document.getElementById("edit-err").hidden = true;
  dlg.showModal();
}
document.getElementById("edit-cancel").onclick = () => dlg.close();

// Photo in the edit dialog: picked, shrunk in the browser, saved with the other details.
let editPhoto; // undefined: unchanged · "": removed · data URL: new photo
function renderEditPhoto() {
  const p = root.players[editing] || {}, shown = editPhoto === undefined ? photoOf(p) : editPhoto;
  const box = document.getElementById("edit-photo");
  box.style.cssText = shown ? `background:center/cover no-repeat url(${shown})` : `background:${avColor(p.name)}`;
  box.textContent = shown ? "" : initials(p.name || "?");
  document.getElementById("photo-remove").hidden = !shown;
}
document.getElementById("photo-file").addEventListener("change", async ev => {
  const file = ev.target.files[0], err = document.getElementById("photo-err");
  ev.target.value = "";
  if (!file) return;
  err.hidden = true;
  try { editPhoto = await photoFromFile(file); renderEditPhoto(); }
  catch (e) { err.textContent = t(e && e.message === "big" ? "photo.big" : "photo.bad"); err.hidden = false; }
});
document.getElementById("photo-remove").onclick = () => { editPhoto = ""; renderEditPhoto(); };
form.addEventListener("submit", ev => {
  const err = msg => { ev.preventDefault(); const el = document.getElementById("edit-err"); el.textContent = msg; el.hidden = false; };
  const name = form.name.value.trim(), email = form.email.value.trim(), fed = form.fed.value.trim().toUpperCase(), rawPhone = form.phone.value.trim();
  if (!name) return err(t("team.errName"));
  if (email && !EMAIL.test(email)) return err(t("team.errEmail"));
  if (fed && !FED.test(fed)) return err(t("team.errFed"));
  const phone = rawPhone ? normPhone(rawPhone) : null;
  if (rawPhone && !phone) return err(t("phone.invalid"));
  const base = `players/${editing}/`;
  const changes = { [base + "name"]: name.slice(0, 60), [base + "email"]: email || null, [base + "phone"]: phone };
  if (fedOn()) changes[base + "fed"] = fed || null;
  for (const [k] of customFields()) changes[`${base}extra/${k}`] = (form[`x_${k}`].value.trim().slice(0, 60)) || null;
  if (editPhoto !== undefined) changes[base + "photo"] = editPhoto || null;
  update(changes);
});

// ---- Admin: member list as CSV (e.g. for registrations) ----
document.getElementById("export").onclick = () => {
  const extra = customFields();
  const rows = [[t("team.fName"), t("team.fEmail"), ...(fedOn() ? [fedLabel()] : []), ...extra.map(([, l]) => l), "Gemeente", t("team.fPhone")]];
  for (const p of sortedPlayers().filter(p => p.name))
    rows.push([p.name, p.email || "", ...(fedOn() ? [p.fed || ""] : []), ...extra.map(([k]) => (p.extra || {})[k] || ""),
      (p.geo && p.geo.label) || p.gemeente || "", p.phone ? "+" + p.phone : ""]);
  const csv = rows.map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(";")).join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob(["﻿" + csv], { type: "text/csv" }));
  a.download = `ledenlijst-${TODAY}.csv`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
};

// ploeg.html#me (from the welcome card): open my own details once the data is in.
let openMine = location.hash === "#me";
const renderPage = render;
render = function () {
  renderPage();
  if (openMine && dataLoaded && session.pid && root.players && root.players[session.pid]) {
    openMine = false;
    history.replaceState(null, "", location.pathname + location.search);
    openEdit(session.pid);
  }
};

start();
</script>
