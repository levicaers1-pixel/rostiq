# Push notifications (see tools/push/send.mjs):
# - every 10 minutes: new access requests -> the team's admins; calendar invitations by email (new/changed/cancelled matches)
# - daily: match reminders for players who haven't answered, plus cleanup
name: Push reminders
on:
  schedule:
    - cron: "30 16 * * *"   # daily run: 18:30 Belgian summer time, 17:30 winter time
    - cron: "*/10 * * * *"  # access requests only
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only count, send nothing"
        type: boolean
        default: false
      test_email:
        description: "Only send a test notification to this account's devices"
        type: string
        default: ""
permissions:
  contents: read
concurrency:
  group: push-reminders
jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools/push
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/push/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: tools/push
      - run: node send.mjs
        working-directory: tools/push
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          BREVO_SMTP_LOGIN: ${{ secrets.BREVO_SMTP_LOGIN }}   # calendar invitations by email (Brevo SMTP relay)
          BREVO_SMTP_KEY: ${{ secrets.BREVO_SMTP_KEY }}
          INVITE_FROM: ${{ vars.INVITE_FROM }}   # optional repository variable, default agenda@rostiq.be
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          TEST_EMAIL: ${{ inputs.test_email }}
          MODE: ${{ github.event.schedule == '*/10 * * * *' && 'requests' || 'all' }}
