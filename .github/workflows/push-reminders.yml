# Runs the RostiQ job by hand (functions/cli.mjs). Normally Firebase runs it on its own timer (functions/index.js:
# every 10 minutes and daily at 18:30 Belgian time); GitHub's timer was too unreliable. Use this as a backup, for a dry
# run, or to send a test notification.
name: Push reminders
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "all = everything incl. match reminders; requests = only the 10-minute part"
        type: choice
        options: [all, requests]
        default: all
      dry_run:
        description: "Only count, send nothing"
        type: boolean
        default: false
      test_email:
        description: "Only send a test notification to this account's devices"
        type: string
        default: ""
permissions:
  contents: read
concurrency:
  group: push-reminders
jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: functions
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: functions
      - run: node cli.mjs
        working-directory: functions
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          BREVO_SMTP_LOGIN: ${{ secrets.BREVO_SMTP_LOGIN }}   # calendar invitations by email (Brevo SMTP relay)
          BREVO_SMTP_KEY: ${{ secrets.BREVO_SMTP_KEY }}
          INVITE_FROM: ${{ vars.INVITE_FROM }}   # optional repository variable, default agenda@rostiq.be
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          TEST_EMAIL: ${{ inputs.test_email }}
          MODE: ${{ inputs.mode }}
