<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title data-i18n-doc="admin.pageTitle">RostiQ · Admin</title>
<meta name="theme-color" content="#1e1b4b">
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="RostiQ">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Cormorant+Garamond:wght@600&display=swap">
<link rel="stylesheet" href="common.css">
<script src="boot.js"></script>
<style>
  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow-sm); padding: 14px 16px; margin-top: 16px; }
  .panel h2 { margin: 0 0 4px; }
  .help { color: var(--muted); font-size: .85rem; margin: 0 0 12px; }
  .muted { color: var(--muted); font-size: .8rem; }
  .ok { color: var(--yes); }
  .err { color: var(--no); }
  input, select { font: inherit; font-size: .9rem; color: var(--text); background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 7px 8px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .row input[type=text], .row input[type=url], .row input:not([type]) { flex: 1 1 220px; min-width: 0; }
  .primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
  .danger { color: var(--no); border-color: var(--no); }

  /* Players */
  .plist { list-style: none; margin: 0 0 12px; padding: 0; }
  .plist li { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center; padding: 8px 0; border-top: 1px solid var(--border); }
  .plist li:first-child { border-top: none; }
  .plist .name { font-weight: 600; }
  .plist .flags { display: flex; gap: 10px; flex-wrap: wrap; font-size: .8rem; color: var(--muted); }
  .plist .flags .off { opacity: .45; text-decoration: line-through; }
  .plist .acts { display: flex; gap: 12px; align-items: center; grid-row: span 2; flex-wrap: wrap; justify-content: flex-end; }
  .invite { margin-top: 14px; border-top: 1px solid var(--border); padding-top: 12px; }
  .invite label { display: grid; gap: 6px; font-size: .9rem; }
  .invite input { flex: 1 1 260px; min-width: 0; }
  #requests-panel { border-color: var(--maybe); }

  /* Settings */
  .settings { display: grid; gap: 14px; max-width: 640px; }
  .settings label { display: grid; gap: 4px; font-size: .85rem; color: var(--muted); }

  /* Branding */
  .brandform { display: grid; gap: 14px; max-width: 640px; }
  .brandform label { display: grid; gap: 4px; font-size: .85rem; color: var(--muted); }
  .brandform .two { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(min(220px, 100%), 1fr)); }
  .field-label { font-size: .85rem; color: var(--muted); margin: 0 0 6px; }
  .logo-box { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .logo-preview { background: var(--brand); border-bottom: 3px solid var(--pampas); border-radius: 8px; padding: 10px 14px; min-height: 64px; display: flex; align-items: center; max-width: 100%; }
  .logo-preview img { display: block; height: 44px; width: auto; max-width: 100%; }
  .logo-preview span { font-family: var(--font-head); font-weight: var(--head-weight); font-size: 1.6rem; color: var(--brand-text); }
  .brandform label.file-btn { position: relative; overflow: hidden; display: inline-block; cursor: pointer; font-size: .9rem; padding: 6px 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); color: var(--text); }
  .file-btn input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
  .swatches { display: flex; gap: 8px; flex-wrap: wrap; }
  .swatches button { width: 44px; height: 44px; padding: 0; border-radius: 10px; border: 2px solid var(--border); cursor: pointer;
    background: linear-gradient(135deg, var(--a) 0 58%, var(--b) 58% 100%); }
  .swatches button[aria-pressed=true] { border-color: var(--text); box-shadow: 0 0 0 2px var(--bg) inset; }
  .colors { display: flex; gap: 18px; flex-wrap: wrap; margin-top: 10px; }
  .brandform .colors label { display: flex; gap: 8px; align-items: center; color: var(--text); font-size: .9rem; }
  .colors input[type=color] { width: 44px; height: 34px; padding: 2px; }
  .brand-actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .dirty-note { color: var(--maybe); font-size: .85rem; }

  /* Matches */
  .mlist { list-style: none; margin: 0 0 12px; padding: 0; }
  .mlist li { display: grid; grid-template-columns: 92px 1fr auto; gap: 4px 12px; align-items: center; padding: 8px 0; border-top: 1px solid var(--border); }
  .mlist li:first-child { border-top: none; }
  .mlist li.past { opacity: .5; }
  .mlist .when { font-variant-numeric: tabular-nums; color: var(--muted); font-size: .85rem; }
  .mlist .opp { font-weight: 600; }
  .mlist .details { margin-top: 2px; }
  .mlist .acts { display: flex; gap: 6px; align-items: center; }
  .mlist .acts a, .mlist .acts button { font-size: .85rem; padding: 4px 8px; text-decoration: none; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); color: var(--text); }
  .tag { font-size: .7rem; font-weight: 600; color: var(--final); border: 1px solid var(--final); border-radius: 999px; padding: 0 6px; margin-left: 6px; white-space: nowrap; }
  .addmatch { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .addmatch input[name=opp] { flex: 1 1 200px; min-width: 0; }
  @media (max-width: 480px) {
    .mlist li { grid-template-columns: 1fr auto; }
    .mlist .when { grid-column: 1 / -1; }
  }
</style>
</head>
<body>
<header class="brand">
  <div class="brand-inner">
    <a href="./"><img class="logo rostiq-logo" src="assets/rostiq-logo-header.png" alt="RostiQ"></a>
    <nav class="tabs"><a href="./" data-i18n="tab.availability">Availability</a><a href="carpool.html" data-i18n="tab.carpool">🚗 Carpool</a><a href="ploeg.html" data-i18n="tab.team">👥 Team</a><a href="admin.html" class="admin-tab" aria-current="page" hidden data-i18n="tab.admin">⚙️ Admin</a></nav>
  </div>
</header>
<script>rostiqBootHeader()</script>
<main>
  <h1 data-i18n="admin.title">Admin</h1>
  <p class="sub"><span data-i18n="admin.sub"></span> · <span class="status" id="status" data-i18n="status.connecting">Connecting…</span></p>
  <p class="banner" id="banner" hidden data-i18n-html="banner.noDb"></p>
  <p class="banner" id="no-access" hidden data-i18n="admin.noAccess"></p>

  <div id="admin" hidden>
    <!-- Access requests (new sign-ins waiting to be linked) -->
    <section class="panel" id="requests-panel">
      <h2 data-i18n="admin.requests">Access requests</h2>
      <p class="help" data-i18n="admin.requestsHelp"></p>
      <ul class="plist" id="requests"></ul>
      <div class="invite">
        <label><b data-i18n="admin.invite">Invite link</b>
          <span class="row"><input id="invite-link" readonly> <button type="button" id="invite-copy" data-i18n="copy">Copy</button></span></label>
        <p class="muted" data-i18n="admin.inviteHelp"></p>
      </div>
    </section>

    <!-- Players & accounts -->
    <section class="panel">
      <h2 data-i18n="admin.players">Players & accounts</h2>
      <p class="help" data-i18n="admin.playersHelp"></p>
      <ul class="plist" id="players"></ul>
      <form class="row" id="add-player">
        <input name="name" maxlength="60" data-i18n-placeholder="admin.addPh" autocomplete="off" required>
        <button type="submit" class="primary" data-i18n="admin.add">+ Add</button>
      </form>
    </section>

    <!-- Settings -->
    <section class="panel">
      <h2 data-i18n="admin.settings">Settings</h2>
      <div class="settings">
        <form id="f-season"><label><span data-i18n="admin.season">Season name</span>
          <span class="row"><input name="v" maxlength="60" required> <button data-i18n="admin.save">Save</button> <span class="msg"></span></span></label></form>
        <form id="f-min"><label><span data-i18n="admin.min">Minimum players</span>
          <span class="row"><input name="v" type="number" min="1" max="50" inputmode="numeric" required style="width:90px"> <button data-i18n="admin.save">Save</button> <span class="msg"></span></span></label></form>
        <form id="f-wa"><label><span data-i18n="wa.setting">WhatsApp group link</span>
          <span class="row"><input name="v" type="url" placeholder="https://chat.whatsapp.com/…" autocomplete="off"> <button data-i18n="admin.save">Save</button> <button type="button" id="wa-remove" data-i18n="wa.remove">Remove</button> <span class="msg"></span></span></label>
          <span class="muted" data-i18n="wa.help"></span></form>
      </div>
    </section>

    <!-- Branding -->
    <section class="panel">
      <h2 data-i18n="brand.title">Branding</h2>
      <p class="help" data-i18n="brand.help"></p>
      <form class="brandform" id="f-brand">
        <div class="two">
          <label><span data-i18n="brand.name">Team name</span><input name="brand" maxlength="60" required></label>
          <label><span data-i18n="brand.short">Short name (in messages)</span><input name="shortName" maxlength="60"></label>
          <label><span data-i18n="brand.calendar">Name in calendars</span><input name="calendarLabel" maxlength="60"></label>
          <label><span data-i18n="brand.adminName">Admin name (players see this)</span><input name="adminName" maxlength="60"></label>
        </div>
        <div>
          <p class="field-label" data-i18n="brand.logo">Logo</p>
          <div class="logo-box">
            <div class="logo-preview" id="logo-preview"></div>
            <label class="file-btn"><span data-i18n="brand.upload">Choose image…</span><input type="file" id="logo-file" accept="image/png,image/jpeg,image/webp,image/svg+xml"></label>
            <button type="button" class="link err" id="logo-remove" data-i18n="brand.logoRemove">Remove logo</button>
          </div>
          <p class="muted" data-i18n="brand.logoHelp"></p>
          <p class="err" id="logo-err" hidden></p>
        </div>
        <div>
          <p class="field-label" data-i18n="brand.colors">Colours</p>
          <div class="swatches" id="swatches"></div>
          <div class="colors">
            <label><input type="color" name="main"> <span data-i18n="brand.main">Header</span></label>
            <label><input type="color" name="highlight"> <span data-i18n="brand.highlight">Highlight</span></label>
          </div>
        </div>
        <label style="max-width:320px"><span data-i18n="brand.font">Headings</span>
          <select name="font"><option value="" data-i18n="brand.fontModern">Modern</option><option value="serif" data-i18n="brand.fontClassic">Classic</option></select></label>
        <div class="brand-actions">
          <button class="primary" data-i18n="admin.save">Save</button>
          <button type="button" id="brand-cancel" data-i18n="brand.cancel">Cancel</button>
          <span class="dirty-note" id="brand-dirty" hidden data-i18n="brand.dirty"></span>
          <span class="msg"></span>
        </div>
      </form>
    </section>

    <!-- Matches -->
    <section class="panel">
      <h2 data-i18n="admin.matches">Matches</h2>
      <p class="help" data-i18n="admin.matchesHelp"></p>
      <ul class="mlist" id="matches"></ul>
      <form class="addmatch" id="add-match">
        <input name="date" type="date" required data-i18n-title="admin.date">
        <input name="opp" maxlength="60" required data-i18n-placeholder="admin.opp" autocomplete="off">
        <label class="muted"><input name="final" type="checkbox"> <span data-i18n="admin.final">Final</span></label>
        <button type="submit" class="primary" data-i18n="admin.addMatch">+ Add match</button>
        <span class="msg err"></span>
      </form>
    </section>

    <!-- Backup -->
    <section class="panel">
      <h2 data-i18n="admin.backup">Backup</h2>
      <p class="help" data-i18n="admin.backupHelp"></p>
      <button id="backup" data-i18n="admin.backupBtn">⬇️ Download backup</button>
    </section>

    <!-- New season -->
    <section class="panel">
      <h2 data-i18n="admin.newSeason">New season</h2>
      <p class="help" data-i18n="admin.newSeasonHelp"></p>
      <button id="new-season" class="danger" data-i18n="admin.newSeasonBtn">Start a new season…</button>
      <span class="msg ok" id="new-season-msg"></span>
    </section>
  </div>
</main>

<script src="icons.js"></script>
<script src="config.js"></script>
<script src="team.js"></script>
<script src="i18n.js"></script>
<script src="common.js"></script>
<script>
const flag = (on, text) => `<span class="${on ? "" : "off"}">${text}</span>`;
const savedMsg = (form, ok, text) => {
  const m = form.querySelector(".msg");
  m.textContent = text || (ok ? t("admin.saved") : "");
  m.className = "msg " + (ok ? "ok" : "err");
};

// ---- Rendering ----
function render() {
  document.getElementById("no-access").hidden = session.admin || !session.ready;
  document.getElementById("admin").hidden = !session.admin;
  if (!session.admin) return;
  renderRequests();
  renderPlayers();
  renderSettings();
  renderBrand();
  renderMatches();
}

document.getElementById("invite-copy").onclick = ev => {
  navigator.clipboard.writeText(document.getElementById("invite-link").value).catch(() => {});
  ev.target.textContent = t("copied");
};

function renderRequests() {
  document.getElementById("invite-link").value = pageUrl("");
  const reqs = Object.entries(root.requests || {}).sort((a, b) => (a[1].at || 0) - (b[1].at || 0));
  const free = sortedPlayers().filter(p => p.name && !p.uid);
  document.getElementById("requests").innerHTML = reqs.length ? reqs.map(([uid, r]) => `
    <li>
      <div><span class="name">${esc(r.name || "?")}</span>
        <div class="flags"><span>✉️ ${esc(r.email || "")}</span>${r.at ? `<span>${esc(new Date(r.at).toLocaleString(LOCALE, { dateStyle: "short", timeStyle: "short" }))}</span>` : ""}</div></div>
      <div class="acts">
        <select data-req-select="${uid}">
          <option value="">${t("admin.choose")}</option>
          ${free.map(p => `<option value="${p.id}" ${p.name.toLowerCase() === (r.name || "").toLowerCase() ? "selected" : ""}>${esc(p.name)}</option>`).join("")}
          <option value="__new">${esc(t("admin.newFromRequest", { name: r.name || "?" }))}</option>
        </select>
        <button class="primary" data-req-link="${uid}">${t("admin.link")}</button>
        <button class="link err" data-req-reject="${uid}">${t("admin.reject")}</button>
      </div>
    </li>`).join("") : `<li class="muted">${t("admin.noRequests")}</li>`;
}
document.getElementById("requests").addEventListener("click", ev => {
  const link = ev.target.closest("[data-req-link]");
  if (link) {
    const uid = link.dataset.reqLink, r = root.requests[uid];
    let pid = document.querySelector(`[data-req-select="${uid}"]`).value;
    if (!pid) return;
    const changes = { [`requests/${uid}`]: null };
    // Their details from their other teams (phone, email, federation number, home town) come along.
    const prof = r.profile && typeof r.profile === "object" ? r.profile : {};
    if (pid === "__new") {
      pid = "p" + Date.now().toString(36);
      const order = sortedPlayers().reduce((m, p) => Math.max(m, p.order || 0), 0) + 1;
      changes[`players/${pid}`] = { order, name: (r.name || "?").slice(0, 60), uid, ...(r.email ? { email: r.email.toLowerCase() } : {}), ...prof };
    } else {
      for (const [f, v] of Object.entries(prof)) changes[`players/${pid}/${f}`] = v;
      // Otherwise their login email becomes the contact email, unless one is already filled in.
      if (!prof.email && r.email && !root.players[pid].email) changes[`players/${pid}/email`] = r.email.toLowerCase();
    }
    linkAccount(uid, pid, changes);
  }
  const rej = ev.target.closest("[data-req-reject]");
  if (rej && confirm(t("admin.rejectConfirm", { name: (root.requests[rej.dataset.reqReject] || {}).name || "?" })))
    write(`requests/${rej.dataset.reqReject}`, null);
});

function renderPlayers() {
  const me = session.user && session.user.uid;
  document.getElementById("players").innerHTML = sortedPlayers().map((p, i) => `
    <li>
      <div><span class="name">${esc(displayName(p, i))}</span>
        <div class="flags">
          ${AUTH_ON ? (p.uid ? `<span>🔗 ${t("accounts.linked")}${p.uid === me ? " " + t("accounts.you") : ""}</span>` : flag(false, "🔗 " + t("accounts.notLinked"))) : ""}
          ${p.uid && root.admins && root.admins[p.uid] ? `<span>${t("admin.isAdmin")}</span>` : ""}
          ${p.email ? `<span>✉️ ${esc(p.email)}</span>` : ""}
          ${flag(!!p.phone, t("admin.hasPhone"))}
          ${flag(!!(p.geo || p.gemeente), t("admin.hasPlace"))}
        </div></div>
      <div class="acts">
        ${AUTH_ON && p.uid && session.platformAdmin ? `<button class="link" data-admin="${p.id}">${t(root.admins && root.admins[p.uid] ? "admin.removeAdmin" : "admin.makeAdmin")}</button>` : ""}
        ${AUTH_ON && p.uid ? `<button class="link" data-reset="${p.id}">${t("accounts.reset")}</button>` : ""}
        ${AUTH_ON && !p.uid && p.name && !session.pid ? `<button class="link" data-mine="${p.id}">${t("accounts.mine")}</button>` : ""}
        <button class="link err" data-remove="${p.id}">${t("admin.remove")}</button>
      </div>
    </li>`).join("");
}

function renderSettings() {
  const s = root.settings || {};
  const set = (id, v) => { const inp = document.querySelector(`#${id} [name=v]`); if (document.activeElement !== inp) inp.value = v; };
  set("f-season", seasonName());
  set("f-min", s.minPlayers || TEAM.minPlayers || 3);
  set("f-wa", s.waGroup || "");
  document.getElementById("wa-remove").hidden = !s.waGroup;
}

function renderMatches() {
  document.getElementById("matches").innerHTML = EVENTS.length ? EVENTS.map(e => `
    <li class="${isPast(e) ? "past" : ""}">
      <span class="when">${esc(fmt(e.date, { weekday: "short", day: "numeric", month: "short", year: "numeric" }))}</span>
      <div><span class="opp">${esc(e.opp)}</span>${e.final ? `<span class="tag">${t("final")}</span>` : ""}${detailsHtml(e, "", true)}</div>
      <div class="acts">
        <a href="./?t=${TEAM_ID}#edit=${e.date}" title="${t("details.edit")}">✏️</a>
        <button data-del-match="${e.date}" title="${t("admin.remove")}">🗑️</button>
      </div>
    </li>`).join("") : `<li class="muted">${t("admin.noMatches")}</li>`;
}

// ---- Players ----
document.getElementById("players").addEventListener("click", ev => {
  const mine = ev.target.closest("[data-mine]");
  if (mine) return linkAccount(session.user.uid, mine.dataset.mine).then(syncSession);
  const adm = ev.target.closest("[data-admin]");
  if (adm) {
    const uid = root.players[adm.dataset.admin].uid;
    return write(`admins/${uid}`, root.admins && root.admins[uid] ? null : true);
  }
  const reset = ev.target.closest("[data-reset]");
  if (reset) {
    const p = root.players[reset.dataset.reset];
    if (confirm(t("accounts.unlinkConfirm", { name: p.name || "" }))) unlinkAccount(p.uid, reset.dataset.reset);
  }
  const rm = ev.target.closest("[data-remove]");
  if (rm) {
    const p = root.players[rm.dataset.remove];
    if (!confirm(t("admin.removeConfirm", { name: p.name || "?" }))) return;
    const changes = { [`players/${rm.dataset.remove}`]: null };
    for (const [date, entries] of Object.entries(root.carpool || {}))
      if (entries[rm.dataset.remove]) changes[`carpool/${date}/${rm.dataset.remove}`] = null;
    if (p.uid) unlinkAccount(p.uid, null, changes); else update(changes);
  }
});
document.getElementById("add-player").addEventListener("submit", ev => {
  ev.preventDefault();
  const name = ev.target.name.value.trim();
  if (!name) return;
  const order = sortedPlayers().reduce((m, p) => Math.max(m, p.order || 0), 0) + 1;
  write(`players/p${Date.now().toString(36)}`, { order, name: name.slice(0, 60) });
  ev.target.reset();
});

// ---- Settings ----
document.getElementById("f-season").addEventListener("submit", ev => {
  ev.preventDefault();
  const v = ev.target.v.value.trim().slice(0, 60);
  if (!v) return;
  write("settings/seasonName", v); savedMsg(ev.target, true);
});
document.getElementById("f-min").addEventListener("submit", ev => {
  ev.preventDefault();
  const n = Math.round(Number(ev.target.v.value));
  if (n >= 1 && n <= 50) { write("settings/minPlayers", n); savedMsg(ev.target, true); }
});
document.getElementById("f-wa").addEventListener("submit", ev => {
  ev.preventDefault();
  const link = ev.target.v.value.trim().replace(/[?#].*$/, "");
  if (!WA_LINK.test(link)) return savedMsg(ev.target, false, t("wa.invalid"));
  write("settings/waGroup", link); savedMsg(ev.target, true);
});
document.getElementById("wa-remove").onclick = () => write("settings/waGroup", null);

// ---- Branding: name, logo and colours of this team (shown live while editing) ----
const bf = document.getElementById("f-brand");
const BRAND_TEXT = ["brand", "shortName", "calendarLabel", "adminName"];
const LOGO_MAX = 140000; // characters of the stored image (the database rules allow 150 000)
// Colours of the saved team (older teams only have the generated light/dark lists).
const savedColors = () => {
  const c = TEAM.colors, [, main, hi] = BRAND_PRESETS[0];
  if (!c) return { main, highlight: hi };
  return { main: c.main || (c.light && c.light["--brand"]) || main, highlight: c.highlight || (c.light && c.light["--pampas"]) || hi };
};

function renderBrand() {
  if (!brandPreview) {
    for (const k of BRAND_TEXT) if (document.activeElement !== bf[k]) bf[k].value = TEAM[k] || "";
    const c = savedColors();
    bf.main.value = c.main; bf.highlight.value = c.highlight;
    bf.font.value = TEAM.font === "serif" ? "serif" : "";
  }
  const B = { ...TEAM, ...(brandPreview || {}) };
  document.getElementById("logo-preview").innerHTML = B.logo
    ? `<img src="${esc(B.logo)}" alt="">` : `<span>${esc(B.brand || "")}</span>`;
  document.getElementById("logo-remove").hidden = !B.logo;
  document.getElementById("brand-dirty").hidden = !brandPreview;
  const main = bf.main.value.toLowerCase(), hi = bf.highlight.value.toLowerCase();
  document.getElementById("swatches").innerHTML = BRAND_PRESETS.map(([key, a, b]) => {
    const name = esc(t("brand.preset." + key));
    return `<button type="button" data-preset="${key}" style="--a:${a};--b:${b}" title="${name}" aria-label="${name}" aria-pressed="${a === main && b === hi}"></button>`;
  }).join("");
}

// Collect the form into a preview and show it everywhere on the page.
function previewBrand(extra = {}) {
  const text = Object.fromEntries(BRAND_TEXT.map(k => [k, bf[k].value.trim()]));
  const main = bf.main.value.toLowerCase(), hi = bf.highlight.value.toLowerCase();
  const isDefault = main === BRAND_PRESETS[0][1] && hi === BRAND_PRESETS[0][2];
  brandPreview = { ...(brandPreview || {}), ...text, brand: text.brand || TEAM.brand, font: bf.font.value,
    colors: isDefault ? null : makePalette(main, hi), ...extra };
  applyBranding();
  renderBrand();
}
bf.addEventListener("input", ev => { if (ev.target.type !== "file") previewBrand(); });
document.getElementById("swatches").addEventListener("click", ev => {
  const b = ev.target.closest("[data-preset]");
  if (!b) return;
  const [, main, hi] = BRAND_PRESETS.find(p => p[0] === b.dataset.preset);
  bf.main.value = main; bf.highlight.value = hi;
  previewBrand();
});
document.getElementById("logo-remove").onclick = () => previewBrand({ logo: "" });
document.getElementById("brand-cancel").onclick = () => {
  brandPreview = null;
  document.getElementById("logo-err").hidden = true;
  bf.querySelector(".msg").textContent = "";
  applyBranding(); renderBrand();
};

// Logo: scaled down in the browser (max 720x180) and stored with the team, so no file hosting is needed.
document.getElementById("logo-file").addEventListener("change", async ev => {
  const file = ev.target.files[0], err = document.getElementById("logo-err");
  ev.target.value = "";
  if (!file) return;
  err.hidden = true;
  try {
    const img = await new Promise((ok, fail) => {
      const i = new Image(), url = URL.createObjectURL(file);
      i.onload = () => { URL.revokeObjectURL(url); ok(i); };
      i.onerror = () => { URL.revokeObjectURL(url); fail(new Error("bad")); };
      i.src = url;
    });
    const w0 = img.naturalWidth || 600, h0 = img.naturalHeight || 150;
    const scale = Math.min(1, 720 / w0, 180 / h0);
    const canvas = document.createElement("canvas");
    canvas.width = Math.max(1, Math.round(w0 * scale));
    canvas.height = Math.max(1, Math.round(h0 * scale));
    canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
    let data = canvas.toDataURL("image/png");
    if (data.length > LOGO_MAX) {
      const webp = canvas.toDataURL("image/webp", .9); // smaller, keeps transparency (not on every browser)
      if (webp.startsWith("data:image/webp")) data = webp;
    }
    if (data.length > LOGO_MAX) throw new Error("big");
    previewBrand({ logo: data });
  } catch (e) {
    err.textContent = t(e && e.message === "big" ? "brand.logoBig" : "brand.logoBad");
    err.hidden = false;
  }
});

bf.addEventListener("submit", async ev => {
  ev.preventDefault();
  if (!brandPreview) previewBrand();
  const p = brandPreview, changes = {};
  for (const k of BRAND_TEXT) changes[`info/${k}`] = k === "brand" ? p.brand.slice(0, 60) : (p[k] || null);
  changes["info/logo"] = p.logo === undefined ? (TEAM.logo || null) : (p.logo || null);
  changes["info/colors"] = p.colors || null;
  changes["info/font"] = p.font === "serif" ? "serif" : null;
  const ok = await update(changes);
  if (ok) { brandPreview = null; mergeTeamInfo(root.info); applyBranding(); renderBrand(); }
  savedMsg(bf, ok, ok ? "" : t("status.saveFailed"));
});

// ---- Matches (the first change copies the built-in list into the database) ----
function scheduleUpdate(changes) {
  const base = {};
  if (!(root.settings && root.settings.scheduleInDb)) {
    base["settings/scheduleInDb"] = true;
    for (const e of EVENTS) base[`schedule/${e.date}`] = { opp: e.opp, ...(e.final ? { final: true } : {}) };
  }
  return update({ ...base, ...changes });
}
document.getElementById("add-match").addEventListener("submit", ev => {
  ev.preventDefault();
  const f = ev.target, date = f.date.value, opp = f.opp.value.trim().slice(0, 60);
  if (!date || !opp) return;
  if (EVENTS.some(e => e.date === date)) { f.querySelector(".msg").textContent = t("admin.matchExists"); return; }
  f.querySelector(".msg").textContent = "";
  scheduleUpdate({ [`schedule/${date}`]: { opp, ...(f.final.checked ? { final: true } : {}) } });
  f.reset();
});
document.getElementById("matches").addEventListener("click", ev => {
  const b = ev.target.closest("[data-del-match]");
  if (!b) return;
  const e = EVENTS.find(x => x.date === b.dataset.delMatch);
  if (!confirm(t("admin.removeMatchConfirm", { opp: e.opp, when: fmt(e.date, { day: "numeric", month: "long", year: "numeric" }) }))) return;
  scheduleUpdate({ [`schedule/${e.date}`]: null, [`matches/${e.date}`]: null });
});

// ---- Backup & new season ----
function downloadBackup() {
  const data = { exportedAt: new Date().toISOString(), season: seasonName(), data: root };
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], { type: "application/json" }));
  a.download = `pampas-backup-${TODAY}.json`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
document.getElementById("backup").onclick = downloadBackup;

document.getElementById("new-season").onclick = () => {
  const word = t("admin.newSeasonWord");
  if ((prompt(t("admin.newSeasonPrompt")) || "").trim().toUpperCase() !== word) return;
  downloadBackup();
  // Clear answers, carpools, match details and the schedule; keep players, logins, phones, places and settings.
  const changes = { "settings/scheduleInDb": true, schedule: null, matches: null };
  for (const id of Object.keys(root.players || {})) if (root.players[id].avail) changes[`players/${id}/avail`] = null;
  for (const [date, entries] of Object.entries(root.carpool || {}))
    for (const pid of Object.keys(entries)) changes[`carpool/${date}/${pid}`] = null;
  update(changes);
  document.getElementById("new-season-msg").textContent = t("admin.newSeasonDone");
};

start();
</script>
