  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px; margin-top: 16px; }

  .mine { background: var(--bg); border-radius: 8px; padding: 8px; margin-bottom: 10px; }
  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; flex-wrap: wrap; }
  .seg button { border: none; border-radius: 0; }
  .seg button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
  .mine .seg { display: flex; }

  .mine .extra select, .mine .extra input {
    font: inherit; font-size: .85rem; color: var(--text); background: var(--surface);
    border: 1px solid var(--border); border-radius: 8px; padding: 5px 8px;

  h4 { margin: 12px 0 6px; font-size: .75rem; letter-spacing: .06em; color: var(--muted); text-transform: uppercase; }
  .car { border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; margin-bottom: 8px; }

  .car .top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .car .who { font-weight: 600; flex: 1; }

<script>
let me = pref.get("me:" + TEAM_ID, "");

// ---- Locations ----
// Each player confirms their own place from a list of matches (OpenStreetMap
// Nominatim), and the chosen coordinates are stored with the player, so
// everyone's distances use the same, correct location.
const km = (idA, idB) => kmBetween(geoOf(idA), geoOf(idB));

// Driving time by road (OSRM, free public router), cached per device per pair of places.
const routeCache = {};
function routeBetween(a, b) {
  if (!a || !b || a.lat == null || b.lat == null) return null;
  const key = `route:${a.lat.toFixed(3)},${a.lon.toFixed(3)}>${b.lat.toFixed(3)},${b.lon.toFixed(3)}`;
  if (key in routeCache) return routeCache[key];
  try { const saved = JSON.parse(pref.get(key, "null")); if (saved) return (routeCache[key] = saved); } catch {}
  routeCache[key] = null;
  fetch(`https://router.project-osrm.org/route/v1/driving/${a.lon},${a.lat};${b.lon},${b.lat}?overview=false`)
    .then(r => r.json())
    .then(j => {
      const r = j.routes && j.routes[0];
      if (!r) return;
      const v = { min: Math.max(1, Math.round(r.duration / 60)), km: Math.round(r.distance / 1000) };
      routeCache[key] = v;
      pref.set(key, JSON.stringify(v));
      render();
    })
    .catch(() => {});
  return null;
}
// Latest departure: start time minus driving time minus 15 minutes, rounded down to 5 minutes.
function leaveBy(start, min) {
  const [h, m] = start.split(":").map(Number);
  const t0 = Math.floor((h * 60 + m - min - 15) / 5) * 5;
  return t0 > 0 ? `${String(Math.floor(t0 / 60)).padStart(2, "0")}:${String(t0 % 60).padStart(2, "0")}` : "";
}

const COUNTRY = LANG === "nl" ? { be: "", nl: "Nederland", fr: "Frankrijk", lu: "Luxemburg" } : { be: "", nl: "Netherlands", fr: "France", lu: "Luxembourg" };
let search = { status: "idle", results: [] }; // idle | loading | results | none | error

function describe(r) {
  const a = r.address || {};
  const name = r.name || (r.display_name || "").split(",")[0];
  const town = a.city || a.town || a.village || a.municipality;
  const region = a.county || a.state;
  const extra = [...new Set([town, region].filter(x => x && x !== name))];
  return { name, label: extra.length ? `${name} (${extra.join(", ")})` : name, country: COUNTRY[a.country_code] || "" };
}

async function findPlace(q) {
  q = q.trim();
  if (q.length < 2) { search = { status: "idle", results: [] }; return render(); }
  search = { status: "loading", results: [] };
  render();
  try {
    const url = "https://nominatim.openstreetmap.org/search?format=jsonv2&limit=10&addressdetails=1" +
      "&countrycodes=be,nl,fr,lu&q=" + encodeURIComponent(q);
    const hits = await fetch(url, { headers: { "Accept-Language": "nl,en" } }).then(r => r.json());
    const seen = new Set();
    const results = hits
      .filter(r => ["boundary", "place"].includes(r.category))
      .map(r => ({ ...describe(r), lat: Number(r.lat), lon: Number(r.lon), be: (r.address || {}).country_code === "be" }))
      .filter(r => !seen.has(r.label) && seen.add(r.label))
      .sort((a, b) => b.be - a.be)
      .slice(0, 6);
    search = { status: results.length ? "results" : "none", results };
  } catch {
    search = { status: "error", results: [] };
  }
  render();
}

function pickPlace(i) {
  const r = search.results[i];
  search = { status: "idle", results: [] };
  write(`players/${me}/gemeente`, r.name.slice(0, 60));
  write(`players/${me}/geo`, { lat: r.lat, lon: r.lon, label: r.label.slice(0, 120) });
}

// ---- Data helpers ----
const named = () => sortedPlayers().filter(p => p.name);
const player = id => (root.players && root.players[id]) ? { id, ...root.players[id] } : null;
const nameOf = id => (player(id) || {}).name || "?";
const placeOf = id => (player(id) || {}).gemeente || "";
const geoOf = id => (player(id) || {}).geo || null;
const placeText = id => (geoOf(id) && geoOf(id).label) || placeOf(id);
const entries = e => (root.carpool && root.carpool[e.date]) || {};

function distLabel(otherId) {
  if (!me || otherId === me) return "";
  const d = km(me, otherId);
  if (d === null) return "";
  return `<span class="km">${d < 1 ? t("sameArea") : t("kmFrom", { km: Math.round(d) })}</span>`;
}
// 💬 link to a direct WhatsApp chat with a ready message, chosen by who I am in this match.
function dmLink(e, other, st) {
  const phone = phoneOf(other);
  if (!me || other === me || !phone) return "";
  const mine = st.all[me] || {}, theirs = st.all[other] || {};
  const vars = { first: firstName(nameOf(other)), opp: e.opp, when: shortDate(e.date), place: placeOf(me), note: mine.note || "" };
  const key =
    mine.role === "driver" && theirs.with === me ? "msg.myRider" :
    mine.role === "driver" ? "msg.offerRide" :
    theirs.role === "driver" && mine.with === other ? "msg.toMyDriver" :
    theirs.role === "driver" ? "msg.askRide" : "msg.carpoolGeneric";
  return ` <a class="dm-icon" href="${waChat(phone, t(key, vars))}" target="_blank" rel="noopener" title="${esc(t("dm.title", { name: nameOf(other) }))}">💬</a>`;
}

const placeLabel = id =>
  geoOf(id) ? `<span class="place">📍 ${esc(placeText(id))}</span>`
  : placeOf(id) ? `<span class="place">📍 ${esc(placeOf(id))} <span class="warn">${t("carpool.notConfirmed")}</span></span>`
  : `<span class="place warn">📍 ${t("carpool.gemUnknown")}</span>`;
const byDistance = (a, b) => (km(me, a) ?? 1e9) - (km(me, b) ?? 1e9);

function matchState(e) {
  const all = entries(e);
  const drivers = Object.keys(all).filter(id => all[id].role === "driver" && player(id));
  const cars = drivers.map(id => ({
    id,
    seats: all[id].seats || 1,
    note: all[id].note || "",
    riders: Object.keys(all).filter(r => all[r].role === "rider" && all[r].with === id && player(r)),
  }));
  const waiting = Object.keys(all).filter(id =>
    all[id].role === "rider" && player(id) && !drivers.includes(all[id].with));
  const open = named().filter(p =>
    !all[p.id] && (p.avail || {})[e.date] && ["yes", "maybe"].includes(p.avail[e.date])).map(p => p.id);
  return { all, cars, waiting, open };
}

// ---- Actions (all write straight to the shared database) ----
function setRole(e, role) {
  const path = `carpool/${e.date}/${me}`;
  const mineNow = entries(e)[me];
  if (mineNow && mineNow.role === "driver" && role !== "driver") {
    // Riders in my car go back to the waiting list.
    for (const [id, x] of Object.entries(entries(e))) if (x.with === me) write(`carpool/${e.date}/${id}/with`, null);
  }
  if (!role) return write(path, null);
  if (role === "driver") return write(path, { role, seats: (mineNow && mineNow.seats) || 3, ...(mineNow && mineNow.note ? { note: mineNow.note } : {}) });
  return write(path, { role });
}
const join = (e, driverId) => write(`carpool/${e.date}/${me}`, { role: "rider", with: driverId });
const leave = e => write(`carpool/${e.date}/${me}/with`, null);
const take = (e, riderId) => write(`carpool/${e.date}/${riderId}/with`, me);
const drop = (e, riderId) => write(`carpool/${e.date}/${riderId}/with`, null);

// ---- Rendering ----
function renderMe() {
  const sel = document.getElementById("me");
  sel.innerHTML = `<option value="">${t("carpool.choose")}</option>` +
    named().map(p => `<option value="${p.id}" ${p.id === me ? "selected" : ""}>${esc(p.name)}</option>`).join("");
  sel.disabled = AUTH_ON && !session.admin;
  const ph = document.getElementById("my-phone");
  ph.disabled = !me;
  document.querySelector("#phone-form button").disabled = !me;
  if (document.activeElement !== ph) ph.value = phoneOf(me) ? "+" + phoneOf(me) : "";
  const g = document.getElementById("gemeente");
  g.disabled = !me;
  document.getElementById("geo-find").disabled = !me;
  if (document.activeElement !== g && search.status === "idle") g.value = placeOf(me);

  const box = document.getElementById("geo-results");
  box.innerHTML =
    search.status === "loading" ? `<div class="hint">${t("carpool.searching")}</div>` :
    search.status === "none" ? `<div class="hint warn">${t("carpool.noPlace")}</div>` :
    search.status === "error" ? `<div class="hint warn">${t("carpool.searchFailed")}</div>` :
    search.status === "results" ? `<div class="hint">${t("carpool.whichOne")}</div>` + search.results.map((r, i) =>
      `<button data-pick="${i}">📍 ${esc(r.label)}${r.country ? ` <span class="country">${esc(r.country)}</span>` : ""}</button>`).join("") : "";

  const name = esc(nameOf(me));
  document.getElementById("me-hint").innerHTML = !me
    ? t(AUTH_ON ? "carpool.hintAdminPick" : "carpool.hintNone")
    : geoOf(me)
      ? `<span class="ok">✓</span> ${t("carpool.hintOk", { name, place: esc(placeText(me)) })}`
      : placeOf(me)
        ? `<span class="warn">${t("carpool.hintConfirm", { name })}</span>`
        : `<span class="warn">${t("carpool.hintAdd", { name })}</span>`;
}

const UNKNOWN = t("carpool.unknown");
function renderPlaces() {
  const groups = {};
  for (const p of named()) {
    const k = (p.geo && p.geo.label) || (p.gemeente || "").trim() || UNKNOWN;
    (groups[k] ||= []).push(p.name);
  }
  const keys = Object.keys(groups).sort((a, b) =>
    (a === UNKNOWN) - (b === UNKNOWN) || groups[b].length - groups[a].length || a.localeCompare(b));
  document.getElementById("places").innerHTML = keys.length
    ? keys.map(k => `<div><b>${esc(k)}</b> (${groups[k].length}) <span>${groups[k].map(esc).join(", ")}</span></div>`).join("")
    : `<div class="empty">${t("carpool.noNames")}</div>`;
}

function renderMatch(e) {
  const st = matchState(e);
  const my = st.all[me];
  const myRole = my ? my.role : "";
  const freeSeats = st.cars.reduce((n, c) => n + Math.max(0, c.seats - c.riders.length), 0);
  const el = document.createElement("section");
  el.className = "match" + (e.final ? " final" : "");

  // How far the venue is from me (if both locations are known).
  const venue = matchInfo(e).venue;
  const toVenue = me ? kmBetween(geoOf(me), venue) : null;
  let html = `
    <div class="when">${fmt(e.date, { weekday: "long", day: "numeric", month: "long" })}</div>
    <div class="title">${esc(e.opp)}${e.final ? `<span class="tag">${t("final")}</span>` : ""}</div>
    ${detailsHtml(e, venueExtra(e, toVenue))}
    <div class="summary">${t("carpool.summary", { cars: st.cars.length, free: freeSeats, waiting: st.waiting.length })}
      <button class="small share" data-act="share">${t("share.carpool")}</button></div>`;

  if (me) {
    html += `<div class="mine">
      <div class="seg" role="group" aria-label="${t("carpool.myPlan")}">
        <button data-act="role" data-role="driver" aria-pressed="${myRole === "driver"}">${t("carpool.drive")}</button>
        <button data-act="role" data-role="rider" aria-pressed="${myRole === "rider"}">${t("carpool.ride")}</button>
        <button data-act="role" data-role="" aria-pressed="${!myRole}">${t("carpool.notNeeded")}</button>
      </div>`;
    if (myRole === "driver") {
      html += `<div class="extra">${t("carpool.seats")}
        <select data-act="seats">${[1, 2, 3, 4, 5, 6, 7, 8].map(n => `<option ${n === (my.seats || 1) ? "selected" : ""}>${n}</option>`).join("")}</select>
        <input data-act="note" data-key="note-${e.date}" maxlength="120" placeholder="${t("carpool.notePh")}" value="${esc(my.note || "")}"></div>`;
    } else if (myRole === "rider") {
      const car = st.cars.find(c => c.id === my.with);
      html += `<div class="extra">${car
        ? `${t("carpool.rideWith", { name: esc(nameOf(car.id)) })} ${placeLabel(car.id)} <button class="small" data-act="leave">${t("carpool.leave")}</button>`
        : `<span class="warn">${t("carpool.pickCar")}</span>`}</div>`;
    }
    html += `</div>`;
  }

  // Cars: nearest to me first.
  const cars = [...st.cars].sort((a, b) => (b.id === me) - (a.id === me) || byDistance(a.id, b.id));
  html += `<h4>${t("carpool.cars")}</h4>` + (cars.length ? cars.map(c => {
    const free = c.seats - c.riders.length;
    const canJoin = me && c.id !== me && free > 0 && !(myRole === "rider" && my.with === c.id) && myRole !== "driver";
    return `<div class="car ${c.id === me ? "me" : ""}">
      <div class="top"><span class="who">🚗 ${esc(nameOf(c.id))}${dmLink(e, c.id, st)} ${placeLabel(c.id)}</span> ${distLabel(c.id)}
        <span class="seats ${free <= 0 ? "full" : ""}">${free > 0 ? t("carpool.free", { free, seats: c.seats }) : t("carpool.full")}</span>
        ${canJoin ? `<button class="small" data-act="join" data-id="${c.id}">${t("carpool.join")}</button>` : ""}</div>
      ${c.note ? `<div class="note">🕘 ${esc(c.note)}</div>` : ""}
      ${c.riders.length ? `<div class="riders">${c.riders.map(r => `<span class="rider">${esc(nameOf(r))}${dmLink(e, r, st)} · ${esc(placeOf(r) || "?")}${distLabel(r) ? " " + distLabel(r) : ""}${
        c.id === me ? ` <button class="small" data-act="drop" data-id="${r}" title="${t("carpool.dropTitle")}">✕</button>` : ""}</span>`).join("")}</div>` : ""}
    </div>`;
  }).join("") : `<div class="empty">${t("carpool.noDrivers")}</div>`);

  // Riders without a car: nearest to me first, so drivers can pick them up.
  const myCar = st.cars.find(c => c.id === me);
  const iHaveRoom = myCar && myCar.seats - myCar.riders.length > 0;
  if (st.waiting.length) {
    html += `<h4>${t("carpool.waiting")}</h4><ul class="list">` + [...st.waiting].sort(byDistance).map(id => `
      <li><span class="who">🙋 ${esc(nameOf(id))}${dmLink(e, id, st)} ${placeLabel(id)}</span> ${distLabel(id)}
        ${iHaveRoom ? `<button class="small" data-act="take" data-id="${id}">${t("carpool.take")}</button>` : ""}</li>`).join("") + `</ul>`;
  }

  // Available players who haven't said anything about transport yet.
  if (st.open.length) {
    html += `<h4>${t("carpool.open")}</h4><ul class="list">` + [...st.open].sort(byDistance).map(id => `
      <li><span class="who">${esc(nameOf(id))}${dmLink(e, id, st)} ${placeLabel(id)}</span> ${distLabel(id)}</li>`).join("") + `</ul>`;
  }

  el.innerHTML = html;
  el.addEventListener("click", ev => {
    const b = ev.target.closest("button[data-act]");
    if (!b) return;
    ({
      role: () => setRole(e, b.dataset.role || null),
      join: () => join(e, b.dataset.id),
      leave: () => leave(e),
      take: () => take(e, b.dataset.id),
      drop: () => drop(e, b.dataset.id),
      share: () => openShare(t("share.carpoolTitle", { opp: e.opp }), carpoolMessage(e)),
    })[b.dataset.act]();
  });
  el.addEventListener("change", ev => {
    if (ev.target.dataset.act === "seats") write(`carpool/${e.date}/${me}/seats`, Number(ev.target.value));
  });
  el.addEventListener("input", ev => {
    if (ev.target.dataset.act !== "note") return;
    clearTimeout(noteTimers[e.date]);
    const v = ev.target.value.trim();
    noteTimers[e.date] = setTimeout(() => write(`carpool/${e.date}/${me}/note`, v || null), 500);
  });
  return el;
}
const noteTimers = {};

// Driving time from my place to the venue (and when to leave); straight-line distance until the route is known.
function venueExtra(e, toVenue) {
  const route = me ? routeBetween(geoOf(me), matchInfo(e).venue) : null;
  if (route) {
    const start = matchInfo(e).start, leave = start ? leaveBy(start, route.min) : "";
    return ` <span class="km" title="${t("carpool.leaveTitle")}">${t("carpool.driveTime", route)}${leave ? " · " + t("carpool.leaveAt", { time: leave }) : ""}</span>`;
  }
  return toVenue !== null ? ` <span class="km">${t("carpool.toVenue", { km: Math.round(toVenue) })}</span>` : "";
}

// ---- Carpool stats: km shared, CO₂ saved, most loyal drivers ----
function renderStats() {
  let km = 0, anyCar = false;
  const drivers = {};
  for (const e of EVENTS) {
    const st = matchState(e), v = matchInfo(e).venue;
    for (const c of st.cars) {
      anyCar = true;
      const d = (drivers[c.id] ||= { rides: 0, pax: 0 });
      d.rides++;
      d.pax += c.riders.length;
      // Each rider who didn't drive saves their own trip: straight line × 1.25 for roads, there and back.
      for (const r of c.riders) { const k = kmBetween(geoOf(r), v); if (k !== null) km += k * 1.25 * 2; }
    }
  }
  const box = document.getElementById("stats");
  box.hidden = !anyCar;
  if (!anyCar) return;
  const round10 = x => Math.round(x / 10) * 10;
  const top = Object.entries(drivers).filter(([id]) => player(id))
    .sort((a, b) => b[1].rides - a[1].rides || b[1].pax - a[1].pax).slice(0, 3);
  box.innerHTML = `<h3>${t("stats.title")}</h3>
    <p>${km > 0 ? t("stats.shared", { km: round10(km).toLocaleString(LOCALE), co2: round10(km * 0.15).toLocaleString(LOCALE) }) : t("stats.none")}</p>
    <div class="muted">${t("stats.top")}</div>
    <ol>${top.map(([id, d], i) => `<li>${["🥇", "🥈", "🥉"][i]} <b>${esc(nameOf(id))}</b> <span class="muted">${t("stats.driver", d)}</span></li>`).join("")}</ol>
    <p class="muted" style="margin-top:8px">${t("stats.note")}</p>`;
}

// ---- Season map: golf courses, where players live, and who rides with whom (Leaflet, loaded on demand) ----
let map = null, mapLayer = null;
let mapMatch = (EVENTS.find(e => !isPast(e)) || {}).date || "";
const initials = name => String(name).split(/\s+/).slice(0, 2).map(w => w[0] || "").join("").toUpperCase();

function loadLeaflet() {
  if (window.L) return Promise.resolve();
  return new Promise((resolve, reject) => {
    const css = document.createElement("link");
    css.rel = "stylesheet";
    css.href = "https://unpkg.com/leaflet@1.9.4/dist/leaflet.css";
    document.head.append(css);
    const js = document.createElement("script");
    js.src = "https://unpkg.com/leaflet@1.9.4/dist/leaflet.js";
    js.onload = resolve;
    js.onerror = reject;
    document.head.append(js);
  });
}

function renderMapSelect() {
  const sel = document.getElementById("map-match");
  sel.innerHTML = `<option value="">${t("map.none")}</option>` + EVENTS.filter(e => !isPast(e)).map(e =>
    `<option value="${e.date}" ${e.date === mapMatch ? "selected" : ""}>${esc(fmt(e.date, { weekday: "short", day: "numeric", month: "short" }))} – ${esc(e.opp)}</option>`).join("");
}
document.getElementById("map-match").addEventListener("change", ev => { mapMatch = ev.target.value; drawMap(false); });

document.getElementById("map-panel").addEventListener("toggle", async ev => {
  if (!ev.target.open || map) return;
  try { await loadLeaflet(); } catch { document.getElementById("map").textContent = t("map.failed"); return; }
  map = L.map("map", { scrollWheelZoom: false });
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
    maxZoom: 18,
  }).addTo(map);
  mapLayer = L.layerGroup().addTo(map);
  drawMap(true);
});

function drawMap(fit) {
  if (!map) return;
  mapLayer.clearLayers();
  const pts = [];
  const key = g => g.lat.toFixed(3) + "," + g.lon.toFixed(3);
  // Golf courses, with the matches played there.
  const venues = {};
  for (const e of EVENTS) {
    const v = matchInfo(e).venue;
    if (v && v.lat != null) (venues[key(v)] ||= { v, evs: [] }).evs.push(e);
  }
  for (const { v, evs } of Object.values(venues)) {
    pts.push([v.lat, v.lon]);
    L.marker([v.lat, v.lon], { icon: L.divIcon({ className: "pin venue", html: "⛳", iconSize: [30, 30] }) })
      .bindPopup(`<b>${esc(v.name)}</b><br>${evs.map(e => `${esc(fmt(e.date, { day: "numeric", month: "short" }))} – ${esc(e.opp)}`).join("<br>")}`)
      .addTo(mapLayer);
  }
  // Where players live: one marker per gemeente (initials, or the number of players there).
  const homes = {};
  for (const p of named()) if (p.geo && p.geo.lat != null) (homes[key(p.geo)] ||= { g: p.geo, names: [] }).names.push(p.name);
  for (const { g, names } of Object.values(homes)) {
    pts.push([g.lat, g.lon]);
    L.marker([g.lat, g.lon], { icon: L.divIcon({ className: "pin home", html: names.length > 1 ? String(names.length) : esc(initials(names[0])), iconSize: [28, 28] }) })
      .bindPopup(`<b>${esc(g.label || "")}</b><br>${names.map(esc).join("<br>")}`)
      .addTo(mapLayer);
  }
  // Carpools for the chosen match: riders → driver (dashed), driver → golf course.
  const e = EVENTS.find(x => x.date === mapMatch);
  if (e) {
    const st = matchState(e), v = matchInfo(e).venue;
    for (const c of st.cars) {
      const dg = geoOf(c.id);
      if (!dg) continue;
      for (const r of c.riders) {
        const rg = geoOf(r);
        if (rg) L.polyline([[rg.lat, rg.lon], [dg.lat, dg.lon]], { color: "#b08d57", weight: 3, dashArray: "6 6" })
          .bindTooltip(`${esc(nameOf(r))} → ${esc(nameOf(c.id))}`).addTo(mapLayer);
      }
      if (v && v.lat != null) L.polyline([[dg.lat, dg.lon], [v.lat, v.lon]], { color: "#2c4a3a", weight: 4, opacity: .85 })
        .bindTooltip(`🚗 ${esc(nameOf(c.id))}`).addTo(mapLayer);
    }
  }
  if (fit) pts.length ? map.fitBounds(pts, { padding: [30, 30], maxZoom: 11 }) : map.setView([50.85, 4.35], 8);
}

// Ready-made WhatsApp message with the carpool plan for one match.
function carpoolMessage(e) {
  const st = matchState(e), m = matchInfo(e), v = m.venue;
  const where = id => (placeOf(id) ? ` (${placeOf(id)})` : "");
  const cars = st.cars.map(c => {
    const free = c.seats - c.riders.length;
    return lines([
      `🚗 *${nameOf(c.id)}*${where(c.id)} – ${free > 0 ? t("msg.seatsFree", { n: free }) : t("msg.full")}`,
      c.note && `   🕘 ${c.note}`,
      c.riders.length && `   👥 ${c.riders.map(r => nameOf(r) + where(r)).join(", ")}`,
    ]);
  });
  return lines([
    `*🚗 Carpool – ${e.opp}${e.final ? " " + t("ics.final") : ""}*`,
    `📅 ${fmt(e.date, { weekday: "long", day: "numeric", month: "long" })}${timeText(e) ? " · 🕘 " + timeText(e) : ""}`,
    v && `📍 ${venueText(v)}`,
    v && `🗺️ ${chatMapsUrl(v)}`,
    weatherFor(e) && wxText(weatherFor(e)),
    m.meet && `🚩 ${t("meet")}: ${m.meet}`,
    BLANK,
    cars.length ? cars.join("\n") : t("msg.noCars"),
    st.waiting.length ? BLANK : null,
    st.waiting.length && `${t("msg.waiting")}: ${st.waiting.map(id => nameOf(id) + where(id)).join(", ")}`,
    st.open.length ? BLANK : null,
    st.open.length && `${t("msg.open")}: ${st.open.map(id => nameOf(id) + where(id)).join(", ")}`,
    BLANK,
    t("msg.carpoolLink", { url: pageUrl("carpool.html") }),
  ]);
}

function render() {
  if (AUTH_ON) {
    if (!session.admin) me = session.pid || "";
    else if (!me || !player(me)) me = session.pid || "";
  }
  // Keep a text field someone is typing in intact across live updates.
  const a = document.activeElement;
  const key = a && a.dataset && a.dataset.key;
  const saved = key ? { value: a.value, sel: [a.selectionStart, a.selectionEnd] } : null;

  renderMe();
  renderPlaces();
  renderStats();
  renderMapSelect();
  drawMap(false);
  const wrap = document.getElementById("matches");
  wrap.innerHTML = "";
  const upcoming = EVENTS.filter(e => !isPast(e));
  upcoming.forEach(e => wrap.append(renderMatch(e)));
  if (!upcoming.length) wrap.innerHTML = `<div class="empty">${t("carpool.none")}</div>`;

  if (key) {
    const el = document.querySelector(`[data-key="${key}"]`);
    if (el) { el.value = saved.value; el.focus(); el.setSelectionRange(...saved.sel); }
  }
}

document.getElementById("me").addEventListener("change", ev => {
  me = ev.target.value; pref.set("me:" + TEAM_ID, me); search = { status: "idle", results: [] }; render();
});
document.getElementById("phone-form").addEventListener("submit", ev => {
  ev.preventDefault();
  const raw = document.getElementById("my-phone").value.trim();
  const n = raw ? normPhone(raw) : null;
  const msg = document.getElementById("phone-msg");
  if (raw && !n) { msg.textContent = t("phone.invalid"); msg.className = "hint err"; return; }
  write(`players/${me}/phone`, n);
  msg.textContent = t("phone.saved"); msg.className = "hint";
});

let gemTimer;
const gemInput = document.getElementById("gemeente");
gemInput.addEventListener("input", () => {
  clearTimeout(gemTimer);
  gemTimer = setTimeout(() => findPlace(gemInput.value), 800);
});
gemInput.addEventListener("keydown", ev => {
  if (ev.key === "Enter") { clearTimeout(gemTimer); findPlace(gemInput.value); }
});
document.getElementById("geo-find").onclick = () => { clearTimeout(gemTimer); findPlace(gemInput.value); };
document.getElementById("geo-results").addEventListener("click", ev => {
  const b = ev.target.closest("[data-pick]");
  if (b) pickPlace(Number(b.dataset.pick));
});

start();
</script>
