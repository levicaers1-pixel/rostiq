<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 140" width="520" height="140">
  <title>RostiQ Logo - Primary</title>
  <desc>Full color wordmark for RostiQ</desc>
  <!-- Deep Indigo #1E1B4B + Electric Cyan #22D3EE -->
  
  <!-- Wordmark "Rosti" -->
  <text x="20" y="95" 
        font-family="Inter, 'Helvetica Neue', Arial, sans-serif" 
        font-weight="800" 
        font-size="78" 
        fill="#1E1B4B"
        letter-spacing="-1.5">Rosti</text>
  
  <!-- Stylized Q mark -->
  <g transform="translate(340, 70)">
    <!-- Ring -->
    <circle cx="0" cy="0" r="48" fill="none" stroke="#22D3EE" stroke-width="14"/>
    <!-- Tail -->
    <line x1="28" y1="28" x2="62" y2="58" stroke="#22D3EE" stroke-width="14" stroke-linecap="round"/>
    <!-- Center node -->
    <circle cx="0" cy="0" r="9" fill="#22D3EE"/>
  </g>
</svg>
