<template data-statement="nl">
  <h2>Wie zijn we?</h2>
  <p>RostiQ is een teamplanner voor sportploegen, een project van <a href="https://www.caersultancy.com" target="_blank" rel="noopener">Caersultancy</a>. Wij zijn verantwoordelijk voor de gegevens die je in RostiQ invult. Vragen? Mail naar <a href="mailto:levi@caersultancy.com">levi@caersultancy.com</a> of gebruik <b>Feedback</b> onderaan elke pagina.</p>

  <h2>Welke gegevens bewaren we?</h2>
  <ul>
    <li><b>Je login</b>: je e-mailadres en een technische account-ID (via Google of een inloglink per e-mail).</li>
    <li><b>Wat je zelf invult</b>: je naam, gsm-nummer, e-mailadres, gemeente (met de ligging op de kaart), federatienummer, de extra velden van je ploeg en eventueel een profielfoto.</li>
    <li><b>Wat je in de app doet</b>: je beschikbaarheid per wedstrijd en je carpools.</li>
    <li><b>Laatst gezien</b>: wanneer je de app voor het laatst opende in een ploeg.</li>
    <li><b>Antwoordgeschiedenis</b>: per wedstrijd wie wanneer een antwoord wijzigde (bv. Misschien → Ja). Die wordt gewist zodra de wedstrijd gespeeld is.</li>
    <li><b>Agenda-abonnement</b>: als je je wedstrijden in je agenda zet, een geheime link met je ploeg, je taal en of je Nee-wedstrijden verbergt. Je agenda-app haalt via die link je wedstrijden op (Firebase, in de EU). Je kan de link altijd vervangen.</li>
    <li><b>Agenda-uitnodigingen</b> (als je ze aanzet): je login-e-mailadres, waarnaar we per wedstrijd een uitnodiging sturen via <b>Brevo</b> (e-maildienst in de EU). Uitzetten kan altijd in de app.</li>
    <li><b>Feedback</b> die je stuurt, met de pagina, je toestel (bv. „iPhone · Safari”) en de appversie.</li>
    <li><b>Foutmeldingen</b>: als de app een fout tegenkomt, sturen we de foutmelding met de pagina, je toestel en de appversie. Zonder je naam of account.</li>
    <li><b>Op je eigen toestel</b>: je taal, je laatste ploeg, een kopie van de ploeggegevens om offline te werken en wijzigingen die nog verstuurd moeten worden. Geen tracking-cookies, geen advertenties, geen statistiekdiensten.</li>
  </ul>

  <h2>Waarom?</h2>
  <p>Enkel om de teamplanner te laten werken waarvoor jij en je ploeg RostiQ gebruiken: zien wie er kan spelen, carpools regelen en elkaar bereiken. Je gsm-nummer dient alleen voor de WhatsApp-knoppen. Feedback en foutmeldingen gebruiken we om RostiQ te verbeteren. We verkopen niets door en tonen geen reclame.</p>

  <h2>Wie ziet wat?</h2>
  <ul>
    <li><b>Je ploegmaten</b> (aangemeld en door de beheerder gekoppeld) zien je naam, foto, contactgegevens, gemeente, beschikbaarheid en carpools. Je gsm-nummer staat nergens op de site, maar ploegmaten kunnen je via de WhatsApp-knoppen een bericht sturen.</li>
    <li><b>De beheerders van je ploeg</b> zien daarnaast wanneer je de app laatst opende, wie wanneer een antwoord wijzigde en de toegangsaanvragen.</li>
    <li><b>De RostiQ-beheerder</b> heeft technisch toegang tot alle gegevens, en gebruikt die alleen voor support en onderhoud.</li>
    <li>Iemand die niet in je ploeg zit, ziet niets behalve de naam en het logo van de ploeg (op het aanmeldscherm).</li>
  </ul>

  <h2>Waar staan je gegevens?</h2>
  <ul>
    <li>De database en de logins: <b>Google Firebase</b>, met de database in de EU (België, europe-west1).</li>
    <li>De website zelf: <b>GitHub Pages</b>. Lettertypes: <b>Google Fonts</b>.</li>
    <li>Kaarten: <b>OpenStreetMap</b>. Een plaats zoeken: <b>Nominatim</b> en <b>Photon</b> (alleen de tekst die je intypt). Rijtijden: <b>OSRM</b> (de coördinaten van vertrek en wedstrijd). Weer: <b>Open-Meteo</b> (de ligging van de wedstrijd).</li>
    <li><b>WhatsApp</b> opent pas als je zelf op een WhatsApp-knop drukt.</li>
  </ul>
  <p>Deze diensten zien bij gebruik ook je IP-adres, zoals elke website.</p>

  <h2>Hoe lang?</h2>
  <p>Zolang je account en je ploeg bestaan. Een nieuw seizoen wist de antwoorden en carpools. Verwijder je je account, dan verdwijnen je gegevens meteen uit RostiQ. Een back-up die een ploegbeheerder zelf downloadde, valt daarbuiten. Foutmeldingen worden gewist zodra ze bekeken zijn.</p>

  <h2>Je rechten</h2>
  <ul>
    <li><b>Inzien</b>: op de pagina Ploeg, of download alles hierboven met <b>Download mijn gegevens</b>.</li>
    <li><b>Aanpassen</b>: via <b>Mijn gegevens aanpassen</b> op de pagina Ploeg.</li>
    <li><b>Wissen</b>: met <b>Verwijder mijn account</b> hierboven.</li>
    <li>Niet tevreden? Je kunt klacht indienen bij de <a href="https://www.gegevensbeschermingsautoriteit.be" target="_blank" rel="noopener">Gegevensbeschermingsautoriteit</a>.</li>
  </ul>
  <p class="updated">Laatst bijgewerkt: 11 oktober 2026</p>
</template>

<template data-statement="en">
  <h2>Who are we?</h2>
  <p>RostiQ is a team planner for sports teams, a project of <a href="https://www.caersultancy.com" target="_blank" rel="noopener">Caersultancy</a>. We are responsible for the data you enter in RostiQ. Questions? Email <a href="mailto:levi@caersultancy.com">levi@caersultancy.com</a> or use <b>Feedback</b> at the bottom of every page.</p>

  <h2>What data do we keep?</h2>
  <ul>
    <li><b>Your login</b>: your email address and a technical account ID (via Google or a sign-in link by email).</li>
    <li><b>What you fill in</b>: your name, mobile number, email address, town (with its location on the map), federation number, your team's extra fields and, if you like, a profile photo.</li>
    <li><b>What you do in the app</b>: your availability per match and your carpools.</li>
    <li><b>Last seen</b>: when you last opened the app in a team.</li>
    <li><b>Answer history</b>: per match, who changed an answer and when (e.g. Maybe → Yes). It's deleted as soon as the match has been played.</li>
    <li><b>Calendar subscription</b>: if you put your matches in your calendar, a secret link with your team, your language and whether you hide No matches. Your calendar app fetches your matches through that link (Firebase, in the EU). You can replace the link at any time.</li>
    <li><b>Calendar invitations</b> (if you switch them on): your login email address, to which we send an invitation per match through <b>Brevo</b> (an email service in the EU). You can switch them off in the app at any time.</li>
    <li><b>Feedback</b> you send, with the page, your device (e.g. “iPhone · Safari”) and the app version.</li>
    <li><b>Error reports</b>: when the app runs into an error, we send the error with the page, your device and the app version. Without your name or account.</li>
    <li><b>On your own device</b>: your language, your last team, a copy of the team's data to work offline and changes still waiting to be sent. No tracking cookies, no ads, no analytics services.</li>
  </ul>

  <h2>Why?</h2>
  <p>Only to run the team planner you and your team use RostiQ for: seeing who can play, arranging carpools and reaching each other. Your mobile number is only used for the WhatsApp buttons. We use feedback and error reports to improve RostiQ. We don't sell anything on and show no ads.</p>

  <h2>Who sees what?</h2>
  <ul>
    <li><b>Your teammates</b> (signed in and linked by the admin) see your name, photo, contact details, town, availability and carpools. Your mobile number isn't shown anywhere on the site, but teammates can message you through the WhatsApp buttons.</li>
    <li><b>Your team's admins</b> also see when you last opened the app, who changed an answer and when, and the access requests.</li>
    <li><b>The RostiQ admin</b> has technical access to all data, and uses it only for support and maintenance.</li>
    <li>Someone outside your team sees nothing except the team's name and logo (on the sign-in screen).</li>
  </ul>

  <h2>Where is your data?</h2>
  <ul>
    <li>The database and the logins: <b>Google Firebase</b>, with the database in the EU (Belgium, europe-west1).</li>
    <li>The website itself: <b>GitHub Pages</b>. Fonts: <b>Google Fonts</b>.</li>
    <li>Maps: <b>OpenStreetMap</b>. Finding a place: <b>Nominatim</b> and <b>Photon</b> (only the text you type). Driving times: <b>OSRM</b> (the coordinates of departure and match). Weather: <b>Open-Meteo</b> (the match location).</li>
    <li><b>WhatsApp</b> only opens when you press a WhatsApp button yourself.</li>
  </ul>
  <p>Like any website, these services also see your IP address when used.</p>

  <h2>How long?</h2>
  <p>As long as your account and your team exist. A new season clears the answers and carpools. If you delete your account, your data disappears from RostiQ right away. A backup a team admin downloaded themselves is outside of that. Error reports are deleted once they've been looked at.</p>

  <h2>Your rights</h2>
  <ul>
    <li><b>See</b> your data: on the Team page, or download everything above with <b>Download my data</b>.</li>
    <li><b>Correct</b> it: with <b>Edit my details</b> on the Team page.</li>
    <li><b>Erase</b> it: with <b>Delete my account</b> above.</li>
    <li>Not happy? You can file a complaint with the Belgian <a href="https://www.dataprotectionauthority.be" target="_blank" rel="noopener">Data Protection Authority</a>.</li>
  </ul>
  <p class="updated">Last updated: 11 October 2026</p>
</template>

<script>
// The statement in the chosen language.
document.getElementById("statement").innerHTML =
  (document.querySelector(`template[data-statement="${LANG}"]`) || document.querySelector('template[data-statement="en"]')).innerHTML;

// Signed in again on purpose (to confirm deleting the account): show the sign-in screen, then reopen the dialog.
const REAUTH = "reauthDelete";
if (pref.get(REAUTH, "")) session.wantLogin = true;
const RECENT = 5 * 60e3; // Firebase only deletes a login that signed in during the last few minutes
let done = false, busy = false;

function render() {
  const box = document.getElementById("mydata"), u = session.user;
  if (done) {
    box.innerHTML = `<div class="done-card">${emptyState("check", t("priv.done"), t("priv.doneSub"),
      `<a class="btn" href="./">${t("priv.home")}</a>`)}</div>`;
    return;
  }
  if (!u) {
    box.innerHTML = `<h2>${ic("shield")} ${t("priv.mine")}</h2><p>${t("priv.mineSignedOut")}</p>
      <div class="data-actions"><div><button class="primary" data-login>${ic("user")} ${t("priv.signIn")}</button></div></div>`;
    return;
  }
  box.innerHTML = `<h2>${ic("shield")} ${t("priv.mine")}</h2><p>${t("priv.signedInAs", { email: esc(u.email || "") })}</p>
    <div class="data-actions">
      <div class="data-act"><b>${ic("download")} ${t("priv.download")}</b><p>${t("priv.downloadHelp")}</p>
        <button data-export>${ic("download")} ${t("priv.download")}</button></div>
      <div class="data-act danger"><b>${ic("trash")} ${t("priv.delete")}</b><p>${t("priv.deleteHelp")}</p>
        <button class="danger" data-delete>${ic("trash")} ${t("priv.delete")}…</button></div>
    </div>`;
  if (pref.get(REAUTH, "") && isRecent()) { pref.set(REAUTH, ""); session.wantLogin = false; openDelete(); }
}

const isRecent = () => {
  const m = fbAuth && fbAuth.currentUser && fbAuth.currentUser.metadata, at = Date.parse(m && m.lastSignInTime);
  return !at || Date.now() - at < RECENT;
};

// Everything of mine: my-teams index, profile, feedback ids, and per team the team data and my last-seen.
async function loadMine() {
  const uid = session.user.uid, me = (await getAbs(`users/${uid}`)) || {};
  const teams = await Promise.all(Object.entries(me.teams || {}).map(async ([id, pid]) => ({
    id, pid, data: await getAbs(`teams/${id}`), seen: await getAbs(`lastSeen/${id}/${uid}`) })));
  const fbIds = Object.keys(me.feedback || {});
  const feedback = (await Promise.all(fbIds.map(id => getAbs(`feedback/${id}`)))).map((x, i) => x && { id: fbIds[i], ...x }).filter(Boolean);
  return { uid, me, teams, feedback };
}

async function exportData(btn) {
  btn.disabled = true;
  try {
    const { uid, me, teams, feedback } = await loadMine();
    const out = {
      app: "RostiQ", exportedAt: new Date().toISOString(),
      account: { uid, email: session.user.email || null },
      profile: me.profile || {},
      teams: teams.map(x => {
        const d = x.data || {}, carpool = {};
        for (const [date, entries] of Object.entries(d.carpool || {})) if (entries && entries[x.pid]) carpool[date] = entries[x.pid];
        return { team: x.id, name: (d.info || {}).brand || x.id, player: (d.players || {})[x.pid] || null, carpool,
          admin: !!(d.admins || {})[uid], lastSeen: typeof x.seen === "number" ? new Date(x.seen).toISOString() : null,
          startedByYou: (d.meta || {}).createdBy === uid };
      }),
      feedback: feedback.map(f => ({ ...f, at: typeof f.at === "number" ? new Date(f.at).toISOString() : f.at })),
      teamsYouStarted: Object.values(me.created || {}),
    };
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([JSON.stringify(out, null, 2)], { type: "application/json" }));
    a.download = t("priv.fileName");
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  } catch { toast(t("priv.failed"), "err"); }
  btn.disabled = false;
}

// One atomic write that removes everything of mine (the database rules allow exactly this for your own data).
function deletionPlan({ uid, me, teams, feedback }) {
  const ch = {}, names = [], blockers = [];
  for (const x of teams) {
    ch[`users/${uid}/teams/${x.id}`] = null;
    const d = x.data;
    if (!d) continue; // no access any more: only the index entry
    const T = `teams/${x.id}`, name = (d.info || {}).brand || x.id, admins = d.admins || {};
    const isAdmin = admins[uid] === true;
    const otherAdmins = Object.keys(admins).filter(a => a !== uid && admins[a] === true).length;
    const others = Object.keys(d.members || {}).filter(m => m !== uid).length;
    if (isAdmin && !otherAdmins && others) blockers.push(name);
    names.push(name);
    if (((d.players || {})[x.pid] || {}).uid === uid) {
      ch[`${T}/players/${x.pid}`] = null;
      for (const [date, entries] of Object.entries(d.carpool || {})) {
        if (entries[x.pid]) ch[`${T}/carpool/${date}/${x.pid}`] = null;
        for (const [o, en] of Object.entries(entries)) if (o !== x.pid && en && en.with === x.pid) ch[`${T}/carpool/${date}/${o}/with`] = null;
      }
    }
    if ((d.members || {})[uid]) { ch[`${T}/members/${uid}`] = null; ch[`lastSeen/${x.id}/${uid}`] = null; }
    if (isAdmin) ch[`${T}/admins/${uid}`] = null;
    if ((d.requests || {})[uid]) ch[`${T}/requests/${uid}`] = null;
    const meta = d.meta || {};
    if (meta.createdBy === uid) {
      if (meta.creatorName) ch[`${T}/meta/creatorName`] = null;
      if (meta.creatorEmail) ch[`${T}/meta/creatorEmail`] = null;
    }
  }
  if (me.profile) ch[`users/${uid}/profile`] = null;
  for (const id of Object.keys(me.feedback || {})) ch[`users/${uid}/feedback/${id}`] = null;
  for (const f of feedback) ch[`feedback/${f.id}`] = null;
  ch[`feedbackLast/${uid}`] = null;
  ch[`errorsLast/${uid}`] = null;
  ch[`pushTokens/${uid}`] = null; // this person's devices for notifications
  return { ch, names, blockers };
}

let plan = null;
async function openDelete() {
  const dlg = document.getElementById("del-dlg");
  if (!isRecent()) {
    dlg.innerHTML = `<h3>${ic("shield")} ${t("priv.reauthTitle")}</h3><p>${t("priv.reauth")}</p>
      <div class="row"><button data-close>${t("details.cancel")}</button><button class="primary" data-reauth>${t("priv.reauthBtn")}</button></div>`;
    dlg.showModal();
    return;
  }
  dlg.innerHTML = `<p>${t("priv.loading")}</p>`;
  dlg.showModal();
  try { plan = deletionPlan(await loadMine()); } catch { dlg.innerHTML = `<p class="ff-err">${t("priv.failed")}</p><div class="row"><button data-close>${t("close")}</button></div>`; return; }
  const word = t("priv.confirmWord");
  dlg.innerHTML = `<h3>${ic("trash")} ${t("priv.dlgTitle")}</h3>
    ${plan.blockers.length ? `<div class="blocker">${t("priv.soleAdmin", { teams: plan.blockers.map(esc).join(", ") })}</div>` : ""}
    <p>${t("priv.willIntro")}</p>
    <ul>
      <li>${t("priv.willProfile")}</li>
      ${plan.names.map(n => `<li>${t("priv.willTeam", { team: esc(n) })}</li>`).join("")}
      <li>${t("priv.willFeedback")}</li>
      <li>${t("priv.willLogin")}</li>
    </ul>
    <p class="ff-help">${t("priv.afterNote")}</p>
    <label class="ff" style="margin-top:12px"><span class="ff-label">${t("priv.confirmLabel", { word })}</span>
      <input id="del-word" autocomplete="off" autocapitalize="characters" ${plan.blockers.length ? "disabled" : ""}></label>
    <p class="ff-err" id="del-err" hidden></p>
    <div class="row"><button data-close>${t("details.cancel")}</button>
      <button class="danger solid" data-confirm-delete disabled>${t("priv.confirmBtn")}</button></div>`;
  const inp = document.getElementById("del-word"), go = dlg.querySelector("[data-confirm-delete]");
  inp.addEventListener("input", () => { go.disabled = inp.value.trim().toUpperCase() !== word; });
  if (!plan.blockers.length) inp.focus();
}

async function doDelete(btn) {
  if (busy || !plan) return;
  busy = true; btn.disabled = true; btn.textContent = t("priv.deleting");
  const err = document.getElementById("del-err");
  const fail = msg => { err.textContent = msg; err.hidden = false; busy = false; btn.disabled = false; btn.textContent = t("priv.confirmBtn"); };
  let res;
  try { res = await fetch(await dbUrlAbs(""), { method: "PATCH", body: JSON.stringify(plan.ch) }); } catch { return fail(t("fb.offline")); }
  if (!res.ok) return fail(t("priv.failedNothing")); // one write: either everything is removed, or nothing
  forgetDevice();
  try { await A.deleteUser(fbAuth.currentUser); }
  catch { document.getElementById("del-dlg").close(); try { await A.signOut(fbAuth); } catch {} toast(t("priv.loginLeft"), "err"); }
  done = true; busy = false;
  const dlg = document.getElementById("del-dlg");
  if (dlg.open) dlg.close();
  render();
}

// This device forgets everything of the account too (only the language stays).
function forgetDevice() {
  try {
    const keep = localStorage.getItem("lang");
    localStorage.clear();
    if (keep) localStorage.setItem("lang", keep);
  } catch {}
}

document.addEventListener("click", ev => {
  if (ev.target.closest("[data-login]")) { session.wantLogin = true; renderAuth(); scrollTo(0, 0); }
  const ex = ev.target.closest("[data-export]");
  if (ex) exportData(ex);
  if (ev.target.closest("[data-delete]")) openDelete();
  const dlg = document.getElementById("del-dlg");
  if (ev.target.closest("[data-close]") || ev.target === dlg) { if (!busy) dlg.close(); }
  if (ev.target.closest("[data-reauth]")) { pref.set(REAUTH, "1"); dlg.close(); session.wantLogin = true; A.signOut(fbAuth); }
  const go = ev.target.closest("[data-confirm-delete]");
  if (go) doDelete(go);
});

start();
